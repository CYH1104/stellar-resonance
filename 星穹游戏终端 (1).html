            if (act === 'stu-load') {
                const name = b.dataset.name || '';
                const hit = getStuFiles().filter(it => it.fields.name === name)[0];
                if (hit) { stuWriteForm(hit.fields); memToast('已载入:' + name); }
                else { stuPaintList(getStuFiles()); memToast('这份档案不在了'); }
                return;
            }
            if (act === 'stu-del') { stuDel(b.dataset.name || ''); return; }
            if (act === 'stu-save') { stuSaveForm(false); return; }
            if (act === 'stu-clear') { stuClearForm(); memToast('已清空'); return; }
            if (act === 'stu-send') { stuSubmit(false); return; }
            if (act === 'stu-fill') { stuSubmit(false); return; }
            if (act === 'rot-skip') { root.dataset.rot = 'skip'; return; }
            /* v4.22.1:菜单 01/02/03 = 全屏设置页。01/03 是开屏内部子页,
               02 是全屏化的导出面板(开屏不关,关掉面板就回来) */
            if (act === 'rev') { root.__revOpen(); return; }
            if (act === 'rev-back') { root.__revApply(); root.classList.remove('spl-rev'); return; }   /* v4.28.1:退回也自动保存 */
            if (act === 'rev-toggle') { const c = getRevCfg(); c.on = !c.on; setRevCfg(c); syncRevPanelBtn(); root.__revSync(); return; }
            if (act === 'rev-vis') { setEvtVis(!getEvtVis()); ensureEvtStyle(); root.__revSync(); return; }
            if (act === 'rev-sendtag') { setSendTagPref(!getSendTagPref()); root.__revSync(); return; }
            if (act === 'rev-trimode') {
                const order = triModeOrder();
                setTriMode(order[(order.indexOf(getTriMode()) + 1) % order.length]);
                root.__revSync();
                return;
            }
            if (act === 'rev-save') {
                const n = root.__revApply();
                memToast('随机事件已保存,立即生效(共 ' + n + ' 条)');
                return;
            }
            if (act === 'export') { openPanel(null, true); return; }
            if (act === 'pet') { root.__petOpen(); return; }
            if (act === 'pet-back') { root.classList.remove('spl-pet'); return; }
            if (act === 'pet-toggle') {
                const on = !getQPetPref();
                setQPetPref(on);
                applySpritePref();
                root.__petSync();
                memToast(on ? '小精灵已开启(三只小 Clawd 上班了)' : '小精灵已关闭');
                return;
            }
            if (act === 'pet-home') {
                if (!getQPetPref()) { memToast('先把精灵打开'); return; }
                const next = getQHomePref() === 'input' ? 'ball' : 'input';
                setQHomePref(next);
                mountQPets(next, true);
                root.__petSync();
                return;
            }
            if (act === 'pet-size') {
                applyQScale(QSCALE_STEPS[(QSCALE_STEPS.indexOf(getQPetScale()) + 1) % QSCALE_STEPS.length]);
                root.__petSync();
                return;
            }
            if (act === 'pet-mark') { setMarkPref(!getMarkVisible()); root.__petSync(); return; }
            if (act === 'pet-dock') { cycleDock(); root.__petSync(); return; }
            /* v4.22.1:Enter the module → 恢复打开小悬浮窗(点悬浮方块那种);
               全屏设置页走菜单 01/02/03,⤢ 想手动放大随时可按 */
            if (act === 'enter') { closeSplash(); if (!rpgIsOpen()) openRPG(); return; }
        });

        /* 鼠标光晕跟随(参考稿 body 那圈 radial-gradient) */
        root.addEventListener('mousemove', e => {
            if (splashRAF) return;
            splashRAF = requestAnimationFrame(() => {
                splashRAF = 0;
                root.style.setProperty('--s-mx', e.clientX + 'px');
                root.style.setProperty('--s-my', e.clientY + 'px');
            });
        });

        /* 角色图片加载失败(比如 URL 还没填/挂了)→ 退回深蓝占位字母 */
        root.addEventListener('error', e => {
            const el = e.target;
            if (!el || el.tagName !== 'IMG' || !el.parentElement) return;
            const ph = document.createElement('b');
            ph.textContent = el.dataset.init || '?';
            el.parentElement.textContent = '';
            el.parentElement.appendChild(ph);
        }, true);

        /* 窗口尺寸/横竖屏变化时,重新居中这一排卡片(位置用像素算,不重算会跑偏) */
        root.__mapApi = buildMapPage(root);
        root.__splRelayout = () => {
            if (!root.classList.contains('spl-chars')) return;
            charLayout();
            charPlaceStill();
        };

        /* Esc 关开屏(只绑一次);角色介绍子页开着时 Esc 先退回主页,左右方向键切换轮播 */
        if (!splashEscBound) {
            splashEscBound = true;
            document.addEventListener('keydown', e => {
                if (!splashOpen()) return;
                if (splashRoot.classList.contains('spl-chars')) {
                    if (e.key === 'Escape') { splashRoot.classList.remove('spl-chars'); return; }
                    if (e.key === 'ArrowLeft') { if (charFanned) charGo(charActive - 1); else charFoldScroll(charStep, true); return; }
                    if (e.key === 'ArrowRight') { if (charFanned) charGo(charActive + 1); else charFoldScroll(-charStep, true); return; }
                    return;
                }
                /* v4.17.0:档案页里 Esc 先退回主页;表单里的输入框该照常打字,
                   所以只有焦点不在输入框上时才拦截(否则删字按 Esc 会把页面退掉) */
                if (splashRoot.classList.contains('spl-stu')) {
                    const ae = document.activeElement;
                    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
                    if (e.key === 'Escape') {
                        if (typing) { try { ae.blur(); } catch (err) {} return; }
                        splashRoot.classList.remove('spl-stu');
                    }
                    return;
                }
                /* v4.22.1:随机事件 / 桌面宠物全屏设置页 —— Esc 退回主页(输入框里打字不拦) */
                if (splashRoot.classList.contains('spl-rev')) {
                    const ae = document.activeElement;
                    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
                    if (e.key === 'Escape') {
                        if (typing) { try { ae.blur(); } catch (err) {} return; }
                        splashRoot.classList.remove('spl-rev');
                    }
                    return;
                }
                if (splashRoot.classList.contains('spl-pet')) {
                    if (e.key === 'Escape') splashRoot.classList.remove('spl-pet');
                    return;
                }
                if (splashRoot.classList.contains('spl-map')) {
                    const ae = document.activeElement;
                    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
                    const api = splashRoot.__mapApi;
                    if (e.key === 'Escape') {
                        if (typing) { try { ae.blur(); } catch (err) {} return; }
                        if (api && api.closeDetail()) return;
                        splashRoot.classList.remove('spl-map');
                        return;
                    }
                    if (!typing && api) {
                        if (e.key === 'ArrowDown') { e.preventDefault(); api.step(1); }
                        if (e.key === 'ArrowUp') { e.preventDefault(); api.step(-1); }
                    }
                    return;
                }
                if (e.key === 'Escape') closeSplash();
            }, true);
            const _relayout = () => { if (splashRoot && splashRoot.__splRelayout) splashRoot.__splRelayout(); };
            window.addEventListener('resize', _relayout);
            window.addEventListener('orientationchange', _relayout);
            if (window.visualViewport) window.visualViewport.addEventListener('resize', _relayout);
        }
        return root;
    }
    /* v4.22.2:手机竖屏/横屏 —— 默认竖屏直接摆开(不再弹「请横屏观看」);
       选了横屏(splashOrient:v1 = landscape)就把整个开屏旋转 90° 铺满竖屏,
       像横版游戏那样看到完整前端。电脑(pointer: fine)不参与,按钮也不显示。 */
    function isCoarsePointer() {
        try { return !!(window.matchMedia && matchMedia('(pointer: coarse)').matches); } catch (e) { return false; }
    }
    function getSplashOrient() {
        try { return GM_getValue('splashOrient:v1', 'portrait') === 'landscape' ? 'landscape' : 'portrait'; }
        catch (e) { return 'portrait'; }
    }
    function setSplashOrient(v) {
        try { GM_setValue('splashOrient:v1', v === 'landscape' ? 'landscape' : 'portrait'); } catch (e) {}
    }
    function applySplashOrient() {
        if (!splashRoot || !splashRoot.isConnected) return;
        const touch = isCoarsePointer();
        const btn = splashRoot.querySelector('.spl-orient');
        if (btn) btn.style.display = touch ? '' : 'none';
        splashRoot.classList.toggle('spl-ls', touch && getSplashOrient() === 'landscape');
        const lbl = splashRoot.querySelector('#__spl_orlbl__');
        if (lbl) lbl.textContent = (getSplashOrient() === 'landscape' ? '横屏' : '竖屏') + ' ⇄';
    }
    function openSplash() {
        ensureRPGSkin();
        if (!splashRoot || !splashRoot.isConnected) {
            if (!document.getElementById('__exp_splashcss__')) {
                const st = document.createElement('style');
                st.id = '__exp_splashcss__';
                st.textContent = SPLASH_CSS + MAP_CSS + MAP_CSS_X;
                (document.head || document.documentElement).appendChild(st);
            }
            splashRoot = buildSplash();
            document.body.appendChild(splashRoot);
        }
        splashRoot.dataset.theme = getRPGTheme();
        if (splashRoot.__splashTheme) splashRoot.__splashTheme();
        applySplashOrient();
        splashRoot.style.display = 'flex';
        splashRoot.removeAttribute('aria-hidden');
        if (splashRoot.__splashFill) splashRoot.__splashFill();
    }

        /* ---- 主面板 / 次要面板切换(v4.3) ----
           主面板只放三个入口:导出工具 / 桌宠 / 跑团模式;
           点进去之后 rpg-body 换成那一项的细项,左上角「←」回主面板。 */
        const viewEls = {};

        /* 鼠标位置驱动的一层橙色光晕(参考稿 body 上那圈 radial-gradient);

        };
        makeDraggable(root, $('.rpg-head'), savePos);
        makeDraggable(root, $('.rpg-mini'), savePos);

        root.__memToast = toast;        // v4.4:记忆库模块借它提示一句
        root.__rpgRefresh = refresh;
        root.__rpgReset = () => showView('home');                  // 每次打开都从主面板起
        root.__rpgView = () => curView;
        root.__rpgBack = () => showView('home');                   // Esc:次要面板先退回主面板
        rpgRoot = root;
        return root;
    }

    let rpgLaid = false;
    function getRpgPos() { try { return GM_getValue('rpgPos:v1', null) || null; } catch (e) { return null; } }
    /* 把存档位置(没有就居中)写回面板,并夹回可视区 —— 开窗和退出全屏共用 */
    function rpgApplySavedPos(root) {
        const pos = getRpgPos();
        if (pos && pos.left) { root.style.left = pos.left; root.style.top = pos.top; }
        else {
            const w = Math.min(320, window.innerWidth * .92), h = Math.min(520, window.innerHeight * .86);
            root.style.left = Math.max(8, Math.round((window.innerWidth - w) / 2)) + 'px';
            root.style.top = Math.max(8, Math.round((window.innerHeight - h) / 2)) + 'px';
        }
        clampIntoView(root);                           // v4.3.3:存档位置跑到屏幕外就拉回来
    }
    /* v4.22.0:小悬浮窗 ⇄ 全屏详细面板。进全屏只挂类(CSS 里定位全 !important,
       拖动痕迹压不过它);退全屏把存档位置写回去,别停在拖脏的坐标上。 */
    function setRPGFull(on) {
        if (!rpgRoot) return;
        rpgRoot.classList.toggle('is-full', !!on);
        const fb = rpgRoot.querySelector('[data-act="full"]');
        if (fb) {
            fb.textContent = on ? '⤡' : '⤢';
            fb.title = on ? '缩回悬浮小窗' : '放大成全屏面板';
        }
        if (!on && rpgRoot.style.display !== 'none') rpgApplySavedPos(rpgRoot);
    }
    function openRPG(full) {
        if (rpgIsOpen()) { closeRPG(); return; }       // 悬浮方块再点一下 = 收起
        const root = buildRPG();
        if (!root.isConnected) document.body.appendChild(root);   // 首建/曾被外部移除:重新挂上
        root.dataset.theme = getRPGTheme();
        syncRPGSkin();                                 // 面板皮肤跟随当前主题
        if (!rpgLaid) {                                // 首开居中;拖过的位置已存档,尊重它
            rpgApplySavedPos(root);
            rpgLaid = true;
        }
        root.removeAttribute('aria-hidden');
        root.style.display = 'flex';
        /* v4.22.0:上次收成圆点后又被隐藏的面板,全屏打开前先解除收起(否则 is-min
           会把除圆点外的内容全部藏掉);小窗打开维持原行为 */
        if (full) {
            root.classList.remove('is-min');
            const mb = root.querySelector('[data-act="min"]');
            if (mb) mb.textContent = '—';
        }
        setRPGFull(!!full);                            // v4.22.0:开屏 Enter 进全屏;悬浮方块进小窗
        if (!full) clampIntoView(root);                // v4.3.3:存档位置跑到屏幕外就拉回来
        if (root.__rpgReset) root.__rpgReset();          // 每次打开:回到主面板
        if (root.__rpgRefresh) root.__rpgRefresh();
    }
    function closeRPG() {
        if (!rpgRoot) return;
        rpgRoot.style.display = 'none';
        rpgRoot.setAttribute('aria-hidden', 'true');
    }
    if (typeof document !== 'undefined' && document.addEventListener) {
        document.addEventListener('keydown', e => {    // Esc 关 RPG 前端(不碰输入法的 Esc)
            if (e.key !== 'Escape' || !rpgIsOpen()) return;
            const t = e.target;
            if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable)) return;
            if (rpgRoot && rpgRoot.__rpgView && rpgRoot.__rpgView() === 'sub') { rpgRoot.__rpgBack(); return; }
            /* v4.22.0:全屏时 Esc 先缩回小悬浮窗(悬浮窗要保留),再按才是关闭 */
            if (rpgRoot && rpgRoot.classList.contains('is-full')) { setRPGFull(false); return; }
            closeRPG();
        }, true);
    }

    function composeDiagnose() {
        const lines = ['页面:' + location.href.slice(0, 120)];
        const found = findComposer();
        lines.push('记住的选择器:' + (getComposerSel() || '(无)'));
        lines.push('选中:' + (found ? (found.sel + ' | ' + found.el.tagName + ' | rect=' +
            Math.round(found.rect.width) + 'x' + Math.round(found.rect.height) +
            ' | up=' + (found.el.closest('.qqy-input-wrap') ? 'Y' : 'N')) : '(没找到)'));
        const all = [];
        try {
            document.querySelectorAll('textarea, input[type="text"], [contenteditable="true"]').forEach(el => {
                const r = el.getBoundingClientRect();
                all.push(el.tagName + (el.className ? '.' + String(el.className).split(' ').join('.') : '') +
                    ' | ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' | up=' +
                    (el.closest && (el.closest('.qqy-input-wrap') || el.closest('.input-wrap')) ? 'Y' : 'N'));
            });
        } catch (e) {}
        lines.push('候选共 ' + all.length + ' 个:');
        all.slice(0, 12).forEach((l, i) => lines.push('  ' + (i + 1) + '. ' + l));
        return lines.join('\n');
    }

    /* ---------- 复制:优先 clipboard API,失败退回隐藏 textarea ---------- */
    function copyText(text, onOk, onFail) {
        const fallback = () => {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;left:-99999px;top:0;';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                ta.remove();
                ok ? (onOk && onOk()) : (onFail && onFail());
            } catch (e) { onFail && onFail(); }
        };
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => onOk && onOk(), fallback);
            } else fallback();
        } catch (e) { fallback(); }
    }

    /* ================== 通用拖动 ================== */

    function makeDraggable(el, handle, onEnd) {
        handle.style.cursor = 'grab';
        handle.addEventListener('pointerdown', e => {
            if (e.target.closest('button,textarea,input,select')) return;
            e.preventDefault();
            const rect = el.getBoundingClientRect();
            const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
            let moved = false;
            const move = ev => {
                // 第一次真的动了才切成绝对坐标;之前一直留着原来的定位方式,
                // 免得「按一下没拖」就把方块坐标改掉(贴附状态下会被拉回原点)
                if (!moved) { moved = true; el.style.transform = 'none'; }
                const x = Math.max(4, Math.min(window.innerWidth - rect.width - 4, ev.clientX - sx));
                const y = Math.max(4, Math.min(window.innerHeight - 40, ev.clientY - sy));
                el.style.left = x + 'px';
                el.style.top = y + 'px';
            };
            const up = () => {
                document.removeEventListener('pointermove', move);
                document.removeEventListener('pointerup', up);
                if (moved && onEnd) onEnd();
            };
            document.addEventListener('pointermove', move);
            document.addEventListener('pointerup', up);
        });
    }

    function storePos(key, x, y) {
        try { GM_setValue(key, { x: x, y: y }); } catch (e) {}
    }
    function loadPos(key) {
        try { return GM_getValue(key, null); } catch (e) { return null; }
    }

    /* v4.3.3:把面板拉回可视区。
       位置存档是像素值,窗口尺寸/布局一变(宽屏、缩放、换显示器),面板就可能整个开在
       屏幕外 —— 看着跟"打不开"一模一样。每次打开都按当前视口夹一次。
       只处理 px 定位:left/top 还带 % 的说明是靠 transform 居中的,别动它。 */
    function clampIntoView(el) {
        if (!el || !el.isConnected) return;
        const ls = el.style.left || '', ts = el.style.top || '';
        if (ls.indexOf('%') >= 0 || ts.indexOf('%') >= 0) return;
        let x = parseFloat(ls), y = parseFloat(ts);
        if (!isFinite(x) || !isFinite(y)) return;
        const w = el.offsetWidth || 320, h = el.offsetHeight || 240;
        const vw = window.innerWidth, vh = window.innerHeight;
        const nx = Math.min(Math.max(4, x), Math.max(4, vw - w - 4));
        const ny = Math.min(Math.max(4, y), Math.max(4, vh - Math.min(h, vh - 8) - 4));
        if (nx !== x) el.style.left = nx + 'px';
        if (ny !== y) el.style.top = ny + 'px';
        const r = el.getBoundingClientRect();
        // 还是整个在视口外(拖到角落里去了)就直接居中
        if (r.right < 8 || r.bottom < 8 || r.left > vw - 8 || r.top > vh - 8) {
            el.style.left = Math.max(4, Math.round((vw - w) / 2)) + 'px';
            el.style.top = Math.max(4, Math.round((vh - Math.min(h, vh - 8)) / 2)) + 'px';
        }
    }

    /* ================== 上滚停止等待秒数(悬浮窗滚轮可调) ================== */

    function getSecs() {
        try { return parseInt(GM_getValue('scrollSecs', 25), 10) || 25; } catch (e) { return 25; }
    }
    function setSecs(v) {
        try { GM_setValue('scrollSecs', v); } catch (e) {}
    }

    /* ================== 悬浮方块(纯白极简) ================== */

    /* ============================================================================
       小精灵：三只戴帽子的小 Clawd（巫师 / 墨镜 / 牛仔帽）
       美术与行为照 SillyTavern claude-web 扩展的 clawd-pile.js 移植,只保留它们互相相处的
       那一半(作息、走位、拖放、叠罗汉),去掉和大 Clawd 联动的那部分。

       · 像素:每只 22×18 格、一格 2px。字符画 → canvas → dataURL → background-image,
         配 image-rendering:pixelated 整张放大 —— 比 SVG rect 干净,边缘不糊、不漏缝。
       · 作息:睡 40–110 秒 → 醒 → 走走停停 2–4 段(每段 30–100px,中间站着停 1.5–4 秒)
         → 打盹 → 睡回去。睡着时头顶每隔几秒飘一个 Z。
       · 眨眼走随机定时器链,不是固定 CSS 周期,所以看着不机械。
       · 位置存「离中线多远」而不是百分比:容器变宽变窄时在屏幕上原地不动。
       ============================================================================ */

    /* ===== 精灵大小可调:一格多少像素(1~3,步进 0.5),面板/菜单随时切换 ===== */
    const QSCALE_KEY = 'qpetScale:v1';
    const QSCALE_STEPS = [1, 1.5, 2, 2.5, 3];
    function getQPetScale() {
        try {
            const v = parseFloat(GM_getValue(QSCALE_KEY, ''));
            return QSCALE_STEPS.indexOf(v) >= 0 ? v : 1.5;
        } catch (e) { return 1.5; }
    }
    let QPX = getQPetScale(), QW = 22, QH = 18, QT = 3;   // 一格 QPX 像素;一张图 22×18 格;头顶留 3 格
    let QBODYW = 16 * QPX;                         // 身子 16 格宽
    let QLIFT = 7 * QPX;                           // 叠到别人头上抬高 7 格
    let QGAP = 2 * QPX;                            // 两只之间至少留这么多
    const QSTEP = 160;                             // 走路:160ms 一格
    function applyQScale(v) {
        if (QSCALE_STEPS.indexOf(v) < 0) return;
        QPX = v; QBODYW = 16 * QPX; QLIFT = 7 * QPX; QGAP = 2 * QPX;
        try { GM_setValue(QSCALE_KEY, String(v)); } catch (e) {}
        ensureQPetStyle(true);                     // 尺寸都写死在样式里,得整个重建
        applySpritePref();                         // 重挂小精灵,方块也让出新宽度
    }
    const QLEGX = [3, 5, 10, 12];                  // 四条腿的 x(0、2 近侧;1、3 远侧,暗一号)

    const QPAL = { '#': '#4a7dff', 's': '#3a62d9', 'o': '#0a1024', 'Z': '#101a33',
        'w': '#fbf8f1', 'B': '#5b8fb9', 'b': '#3f6f99',
        'y': '#e8b64a', 'Y': '#fff3c4', 'n': '#8b5e3c', 'l': '#cc4f45', 'k': '#8e8e8e' };

    const QBODY_ROWS = ['..############..', '..############..', '..############..', '################',
        '################', '..############..', '..############..', '..############..'];
    const QLEGS = {
        stand: ['...#.#....#.#...', '...#.#....#.#...'],
        dangleA: ['...#.#....#.#...', '...#.#..........', '...#.#..........'],
        dangleB: ['...#.#....#.#...', '..........#.#...', '..........#.#...'],
    };
    const QEYES = { shut: [[3, 2, 'oo'], [11, 2, 'oo']], open: [[4, 1, 'o'], [4, 2, 'o'], [11, 1, 'o'], [11, 2, 'o']], half: [[4, 2, 'o'], [11, 2, 'o']] };
    const QGLASSES = {
        on: [[3, 1, 'ZZZZ'], [9, 1, 'ZZZZ'], [7, 1, 'ZZ'], [3, 2, 'ZZZ'], [10, 2, 'ZZZ'], [4, 1, 'w'], [10, 1, 'w']],
        down: [[3, 2, 'ZZZZ'], [9, 2, 'ZZZZ'], [7, 2, 'ZZ'], [3, 3, 'ZZZ'], [10, 3, 'ZZZ'], [4, 2, 'w'], [10, 2, 'w']],
    };
    const QCOWBOY = ['.....nnnnnn.....', '....nnnnnnnn....', '....llllllll....', '.nnnnnnnnnnnnnn.'];
    const QWIZARD = ['...........b....', '..........Bb....', '.........BBB....', '.......BBBBB....',
        '......ByBBBBB...', '.....BBBBBByBB..', '..BBBBBBBBBBBB..'];
    const QWAND = {
        rest: [[0, 3, 'n'], [1, 2, 'n'], [2, 1, 'n'], [2, -1, '.y.'], [2, 0, 'yYy'], [2, 1, '.y.']],
        shine: [[0, 3, 'n'], [1, 2, 'n'], [2, 1, 'n'], [2, -1, '.Y.'], [2, 0, 'YwY'], [2, 1, '.Y.']],
    };
    const QNAMES = ['cowboy', 'shades', 'wizard'];   // 原版不戴帽的 claude 不常住,发送消息时才登场(见发送哨兵)

    function qpetCssText() {
        return '.q-dl{line-height:0;display:block}' +
        '.qpet{position:absolute;left:0;right:0;bottom:100%;height:0;z-index:5;pointer-events:none}' +
        '.qpet[data-unlaid]{visibility:hidden}' +
        '.qpet>.qpc{position:absolute;width:' + (QW * QPX) + 'px;height:' + (QH * QPX) + 'px;' +
        'pointer-events:auto;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}' +
        '.qpet>.qpc.qpc-held{cursor:grabbing}' +
        '.qpet .qpb{position:absolute;inset:0;transform-origin:' + (8 * QPX) + 'px 100%}' +
        '.qpet .qps{position:absolute;inset:0;background-repeat:no-repeat;image-rendering:pixelated;pointer-events:none}' +
        '.qpet .qpl{position:absolute;display:none;width:' + QPX + 'px;height:' + (2 * QPX) + 'px;' +
        'background:#4a7dff;transform-origin:50% 0;pointer-events:none}' +
        '.qpet .qpl.qpl-far{background:#3a62d9}' +
        '.qpet .qpc.qpc-walk .qpl{display:block}' +
        '.qpet>.qpsh{position:absolute;top:-2px;width:' + (13 * QPX) + 'px;height:3px;' +
        'border-radius:50%;background:rgba(20,20,19,.14);pointer-events:none}' +
        /* 睡着:果冻一样轻轻压扁再回弹,周期和起点各自错开 */
        '.qpet .qpc.qpc-sleep>.qpb{animation:qpet-breathe 3.1s ease-in-out infinite}' +
        '.qpet .qpc.qpc-sleep[data-name="shades"]>.qpb{animation-duration:3.5s;animation-delay:-1.2s}' +
        '.qpet .qpc.qpc-sleep[data-name="wizard"]>.qpb{animation-duration:2.8s;animation-delay:-.6s}' +
        '@keyframes qpet-breathe{0%,100%{transform:scale(1,1)}42%{transform:scale(1.07,.91)}' +
        '58%{transform:scale(.96,1.05)}72%{transform:scale(1.015,.985)}84%{transform:scale(1,1)}}' +
        /* Z 和魔杖上的小星星:一直挂着,平时透明,要用才播一下(不反复增删元素) */
        '.qpet :is(.qpz,.qpsp){position:absolute;left:0;top:0;z-index:8;pointer-events:none;opacity:0}' +
        '.qpet .qpsp{background-repeat:no-repeat;background-size:100% 100%;image-rendering:pixelated}' +
        '@media (prefers-reduced-motion:reduce){.qpet *{animation:none!important}}';
    }

    function ensureQPetStyle(force) {
        let st = document.getElementById('__exp_petcss__');
        if (!st) {
            st = document.createElement('style');
            st.id = '__exp_petcss__';
            document.head.appendChild(st);
        }
        if (force || !st.textContent) st.textContent = qpetCssText();
    }

    const qGrid = (rows, ox, oy) => {
        const o = [];
        rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] !== '.') o.push([x + ox, y + oy, r[x]]); });
        return o;
    };
    const qSpans = (list, ox, oy) => {
        const o = [];
        for (let i = 0; i < list.length; i++) for (let j = 0; j < list[i][2].length; j++) {
            const ch = list[i][2][j];
            if (ch !== '.') o.push([list[i][0] + j + ox, list[i][1] + oy, ch]);
        }
        return o;
    };
    const qIsDangle = p => String(p).indexOf('dangle') === 0;

    /* 一帧长什么样:名字(帽子)+ 眼睛 + 姿势 + 朝向 → 一串 [x, y, 色号]
       转向不镜像:背光那一侧暗一列,眼睛(墨镜)往要去的方向偏一格。 */
    function qCells(name, eyes, pose, face) {
        const up = pose === 'crouch' ? 0 : qIsDangle(pose) ? 3 : 2, by = QT + 7 - up;
        let c = [];
        if (name === 'cowboy') c = c.concat(qGrid(QCOWBOY, 0, by - 4));
        if (name === 'wizard') c = c.concat(qGrid(QWIZARD, 0, by - 7));
        let body = qGrid(QBODY_ROWS, 0, by);
        if (face) { const dark = face > 0 ? 2 : 13; body = body.map(p => (p[0] === dark ? [p[0], p[1], 's'] : p)); }
        c = c.concat(body);
        if (pose === 'stand' || qIsDangle(pose)) c = c.concat(qGrid(QLEGS[pose] || QLEGS.stand, 0, by + 8));
        if (name === 'shades') c = c.concat(eyes === 'open'
            ? qSpans(QEYES.open, face, by).concat(qSpans(QGLASSES.down, face, by))
            : qSpans(QGLASSES.on, face, by));
        else c = c.concat(qSpans(QEYES[eyes] || QEYES.half, face, by));
        if (name === 'wizard') c = c.concat(qSpans(eyes === 'open' ? QWAND.shine : QWAND.rest, 15, by));
        return c;
    }

    /* 多帧横着拼成一条图,Web Animations 换 background-position,不改 DOM;同样的组合只画一次 */
    const qSheetCache = new Map();
    function qSheet(frameCells) {
        const key = JSON.stringify(frameCells);
        if (qSheetCache.has(key)) return qSheetCache.get(key);
        let url = 'none';
        try {
            const cv = document.createElement('canvas');
            cv.width = QW * frameCells.length;
            cv.height = QH;
            const g = cv.getContext && cv.getContext('2d');
            if (g) {
                frameCells.forEach((cs, i) => {
                    for (let k = 0; k < cs.length; k++) {
                        const p = cs[k];
                        if (p[1] < 0 || p[1] >= QH) continue;
                        g.fillStyle = QPAL[p[2]] || '#4a7dff';
                        g.fillRect(p[0] + i * QW, p[1], 1, 1);
                    }
                });
                url = 'url("' + cv.toDataURL() + '")';
            }
        } catch (e) { url = 'none'; }
        qSheetCache.set(key, url);
        return url;
    }
    const qShadowOf = cs => cs.slice().reverse()
        .map(p => (p[0] * QPX) + 'px ' + (p[1] * QPX) + 'px 0 .3px ' + (QPAL[p[2]] || '#000')).join(',');
    function qSmallBmp(cs, w, h) {
        try {
            const cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            const g = cv.getContext && cv.getContext('2d');
            if (!g) return 'none';
            for (let i = 0; i < cs.length; i++) { g.fillStyle = QPAL[cs[i][2]] || '#000'; g.fillRect(cs[i][0], cs[i][1], 1, 1); }
            return 'url("' + cv.toDataURL() + '")';
        } catch (e) { return 'none'; }
    }

    /* ---------------------------------------------------------------------------
       一群小精灵住在同一个 layer 上。layer 是铺满宿主、贴着宿主上沿的一条零高度的线,
       它们就站在那条线上(bottom:100%),脚正好落在宿主的上边框。
       --------------------------------------------------------------------------- */
    function createPile(cfg) {
        const layer = cfg.layer, names = cfg.names.slice(), edge = cfg.edge || 8;
        const stepMin = cfg.stepMin || 30, stepMax = cfg.stepMax || 100;   // 走一步挑多远(方块上地方小,步子也小)
        const K = {};
        const timers = new Set();
        let destroyed = false, laid = false, lastW = 0, atHome = false, busy = false;
        let zs = [], sparks = [], zTimer = 0, zi = 0;

        const rnd = (a, b) => a + Math.random() * (b - a);
        const width = () => layer.clientWidth || 0;
        const calm = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
        const later = (k, fn, ms) => {
            const t = setTimeout(() => { timers.delete(t); if (k && k.timers) k.timers.delete(t); fn(); }, ms);
            timers.add(t); if (k && k.timers) k.timers.add(t);
            return t;
        };
        const clearK = k => { if (!k || !k.timers) return; for (const t of k.timers) { clearTimeout(t); timers.delete(t); } k.timers.clear(); };

        /* ===== 位置 =====
           存在的是「离中线多远」,不是百分比:宿主变宽变窄时两边一样地挤,
           它们在屏幕上原地不动,间距也不变。 */
        const bounds = () => ({ min: edge, max: Math.max(edge, width() - edge - QBODYW) });
        function clampX(x) { const b = bounds(); return Math.round(Math.min(b.max, Math.max(b.min, x)) / QPX) * QPX; }
        function homeLayout() {
            const s = QPX / 2;                             // 间距按尺寸等比缩(基准是 2x 那版)
            const r = Math.max(edge, width() - edge - 30 * s);
            const one = clampX((width() - QBODYW) / 2);
            if (names.length === 1) { const o = {}; names.forEach(n => { o[n] = { x: one, on: [] }; }); return o; }
            const o = { cowboy: { x: clampX(r), on: [] }, shades: { x: clampX(r + 28 * s), on: [] }, wizard: { x: clampX(r + 14 * s), on: ['cowboy', 'shades'] } };
            const out = {};
            names.forEach(n => { out[n] = o[n] ? { x: o[n].x, on: o[n].on.filter(m => names.indexOf(m) >= 0) } : { x: one, on: [] }; });
            return out;
        }
        function save(keepHome) {
            if (!keepHome) atHome = false;
            const w = width(); if (!w) return;
            if (!names.length) { try { GM_setValue(cfg.store, ''); } catch (e) {} return; }   // 空的别留档
            const data = {};
            names.forEach(n => { data[n] = { dx: Math.round(K[n].x - w / 2), on: K[n].on.slice() }; });
            try { GM_setValue(cfg.store, JSON.stringify(data)); } catch (e) { /* 存不了就不记 */ }
        }
        function load() {
            const w = width(); if (!w) return null;
            try {
                const s = JSON.parse(GM_getValue(cfg.store, '') || 'null');
                if (!s || !names.some(n => s[n])) return null;   // 空存档不算存档
                const out = {};
                names.forEach(n => {
                    const it = s[n] || null;
                    out[n] = {
                        x: clampX(w / 2 + (it && typeof it.dx === 'number' ? it.dx : 0)),
                        on: (it && Array.isArray(it.on) ? it.on : []).filter(m => names.indexOf(m) >= 0 && m !== n),
                    };
                });
                return out;
            } catch (e) { return null; }
        }
        const supportTop = n => lift(K[n]) + QLIFT;
        const lift = k => (k.on.length ? Math.max.apply(null, k.on.map(supportTop)) : 0);
        const carriers = k => names.filter(n => K[n].on.indexOf(k.name) >= 0);
        const grounded = except => names.map(n => K[n]).filter(o => o.name !== except && !o.on.length && o.mode !== 'held');
        const posX = o => (o.walk ? o.walk.base + o.walk.off : o.x);
        function freeAt(x, except) {
            const b = bounds();
            if (x < b.min || x > b.max) return false;
            return grounded(except).every(o => Math.abs(posX(o) - x) >= QBODYW + QGAP);
        }
        function nearestFree(x, except) {
            const b = bounds();
            x = clampX(x);
            if (freeAt(x, except)) return x;
            for (let d = QPX; d < width(); d += QPX) {
                for (let s = 0; s < 2; s++) {
                    const t = x + (s ? d : -d);
                    if (t >= b.min && t <= b.max && freeAt(t, except)) return t;
                }
            }
            return null;
        }
        function clearPath(a, b, except) {
            const lo = Math.min(a, b), hi = Math.max(a, b);
            const apart = o => (o + QBODYW + QGAP <= lo) || (o >= hi + QBODYW + QGAP);
            return grounded(except).every(o => apart(posX(o)));
        }

        /* ===== 画 ===== */
        function look(k) {
            const walking = k.pose === 'walk', dangle = k.pose === 'dangle';
            const frames = walking ? ['raised'] : dangle ? ['dangleA', 'dangleB'] : [k.pose];
            k.el.classList.toggle('qpc-sleep', k.mode === 'sleep' && k.pose === 'crouch');
            k.el.classList.toggle('qpc-walk', walking);
            k.ps.style.backgroundSize = (frames.length * 100) + '% 100%';
            const url = qSheet(frames.map(p => qCells(k.name, k.eyes, p, k.face)));
            if (k.ps.style.backgroundImage !== url) k.ps.style.backgroundImage = url;
            if (k.kick) { k.kick.cancel(); k.kick = null; }
            if (dangle && k.ps.animate && !calm()) {
                k.kick = k.ps.animate([{ backgroundPosition: '0% 0' }, { backgroundPosition: '100% 0' }],
                    { duration: 720, iterations: Infinity, easing: 'steps(2,jump-none)' });
            } else k.ps.style.backgroundPosition = '0 0';
            legs(k, walking);
        }
        /* 走路的腿:四条小腿各自平滑地缩短(抬脚)再伸长(落地),两两差半个周期 */
        function legs(k, on) {
            if (!on) { k.legAnims.forEach(a => a.cancel()); k.legAnims = []; return; }
            if (k.legAnims.length || !k.legEls[0].animate || calm()) return;
            const dir = k.face || 1, ease = 'cubic-bezier(.45,0,.55,1)';
            const kf = [{ transform: 'scale(1,1) translate(0,0)', easing: ease },
            { offset: .28, transform: 'scale(1,.4) translate(' + (dir * QPX * .6) + 'px,0)', easing: ease },
            { offset: .5, transform: 'scale(1,1) translate(0,0)' },
            { transform: 'scale(1,1) translate(0,0)' }];
            k.legAnims = k.legEls.map((leg, i) => leg.animate(kf, { duration: 2 * QSTEP, iterations: Infinity, delay: -(i % 2 ? QSTEP : 0) }));
        }
        function place(k) {
            const l = lift(k);
            k.el.style.left = k.x + 'px';
            k.el.style.top = (-QH * QPX - l) + 'px';
            k.el.style.zIndex = String(1 + Math.round(l / QLIFT));
            k.el.classList.toggle('qpc-up', !!k.on.length);
            k.sh.style.left = (k.x + 1.5 * QPX) + 'px';
            k.sh.style.display = k.on.length ? 'none' : '';
        }
        function make(name) {
            const el = document.createElement('div');
            el.className = 'qpc'; el.dataset.name = name;
            const b = document.createElement('div'); b.className = 'qpb';
            const ps = document.createElement('div'); ps.className = 'qps'; b.appendChild(ps);
            const legEls = QLEGX.map((x, i) => {
                const l = document.createElement('i');
                l.className = 'qpl' + (i % 2 ? ' qpl-far' : '');
                l.style.cssText = 'left:' + (x * QPX) + 'px;top:' + ((QT + 13) * QPX) + 'px';
                b.appendChild(l); return l;
            });
            el.appendChild(b);
            const sh = document.createElement('div'); sh.className = 'qpsh';
            layer.appendChild(sh); layer.appendChild(el);
            const k = { name: name, el: el, b: b, ps: ps, sh: sh, legEls: legEls,
                x: 0, on: [], eyes: 'shut', pose: 'crouch', mode: 'sleep', face: 0,
                timers: new Set(), legAnims: [], kick: null, walk: null, hop: null };
            K[name] = k;
            bindPointer(k);
            return k;
        }
        function buildFx() {
            if (!layer) return;
            const fx = (cls, w, h, css) => {
                const n = document.createElement('div');
                n.className = cls;
                n.style.cssText = 'width:' + (w * QPX) + 'px;height:' + (h * QPX) + 'px;' + css;
                layer.appendChild(n); return n;
            };
            const star = qSmallBmp([[0, 1, 'Y'], [1, 0, 'Y'], [1, 2, 'Y'], [2, 1, 'Y'], [1, 1, 'w']], 3, 3);
            sparks = [[19, -3, 0], [21, -1, 120], [18, -1, 220], [20, -5, 320]].map(() => fx('qpsp', 3, 3, 'background-image:' + star));
            // Z 不用图片:三四格的小图放大后斜笔画会时有时无,直接用 box-shadow 拼方块
            const bigZ = qSpans([[0, 0, 'kkkk'], [2, 1, 'k'], [1, 2, 'k'], [0, 3, 'kkkk']], 0, 0);
            const smallZ = qSpans([[0, 0, 'kkk'], [1, 1, 'k'], [0, 2, 'kkk']], 0, 0);
            zs = [fx('qpz', 1, 1, 'box-shadow:' + qShadowOf(bigZ)), fx('qpz', 1, 1, 'box-shadow:' + qShadowOf(smallZ))];
        }
        const QSPARK = [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.6)' }];
        const QZFLOAT = [{ opacity: 0, transform: 'translate(0,0)' }, { offset: .12, opacity: 1 },
        { offset: .8, opacity: .9 }, { opacity: 0, transform: 'translate(' + (6 * QPX) + 'px,' + (-14 * QPX) + 'px)' }];
        function sparkle(k) {
            const top = -QH * QPX - lift(k);
            sparks.forEach((s, i) => {
                const at = [[19, -3, 0], [21, -1, 120], [18, -1, 220], [20, -5, 320]][i];
                s.style.left = (k.x + (at[0] - 1) * QPX) + 'px';
                s.style.top = (top + (QT + 7 + at[1] - 1) * QPX) + 'px';
                if (s.animate) s.animate(QSPARK, { duration: 500, delay: at[2], easing: 'steps(4)' });
            });
        }
        function puffZ() {
            if (destroyed || !layer || document.hidden || calm()) return;
            const sleeping = names.map(n => K[n]).filter(k => k && k.mode === 'sleep' && !carriers(k).length);
            if (!sleeping.length) return;
            const k = sleeping[(Math.random() * sleeping.length) | 0], z = zs[zi++ % zs.length];
            if (!z) return;
            z.style.left = (k.x + 12 * QPX) + 'px';
            z.style.top = (-QH * QPX - lift(k) + (QT + 5) * QPX) + 'px';
            if (z.animate) z.animate(QZFLOAT, { duration: 4200, easing: 'linear' });
        }

        /* ===== 作息 ===== */
        function sleep(k, first) {
            k.mode = 'sleep'; k.eyes = 'shut'; k.pose = 'crouch'; k.face = 0; look(k);
            later(k, () => wake(k), first ? rnd(8000, 60000) : rnd(40000, 110000));
        }
        function wake(k) {
            if (destroyed || k.mode !== 'sleep') return;
            if (calm() || document.hidden) { sleep(k); return; }   // 关了动效 / 页面在后台:接着睡
            k.mode = 'sit'; k.eyes = 'half'; look(k);
            later(k, () => { k.eyes = 'open'; look(k); blink(k, 3); }, 700);
            later(k, () => stroll(k), rnd(1200, 2500));
        }
        /* 眨眼是一条随机间隔的定时器链,不是固定周期 — 固定周期看着像发报机 */
        function blink(k, n) {
            if (!n || k.mode !== 'sit') return;
            later(k, () => {
                if (k.mode !== 'sit') return;
                k.eyes = 'shut'; look(k);
                later(k, () => { if (k.mode !== 'sit') return; k.eyes = 'open'; look(k); blink(k, n - 1); }, 140);
            }, rnd(1200, 2600));
        }
        function doze(k) {
            k.eyes = 'half'; look(k);
            later(k, () => sleep(k), 900);
        }
        function stroll(k) {
            clearK(k);
            if (carriers(k).length) { k.mode = 'sit'; k.eyes = 'open'; look(k); blink(k, 3); later(k, () => doze(k), rnd(5000, 9000)); return; }
            if (k.on.length) { hopDown(k, () => stroll(k, true)); return; }
            wander(k, 2 + ((Math.random() * 3) | 0));
        }
        function wander(k, n) {
            if (destroyed) return;

    const BALL_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8fb0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="导出">' +

    /* fresh=true 是用户刚切了主栖息地:不管之前手动挪到哪,都归位到新家 */

        }
        // 2) 扫码:先找带指定图标指纹的那个 right-item
        const sels = ['div.right-item', '[class*="right-item"]', '[class*="rightItem"]'];
        let fallback = null;
        for (const s of sels) {
            const list = Array.prototype.slice.call(document.querySelectorAll(s)).filter(isVisible);
            if (!list.length) continue;
            const hit = list.filter(n => matchSig(n, DEFAULT_FP));
            if (hit.length) {
                // 记住它,下次直接命中,不用再扫
                saveDock(Object.assign({}, st, { sel: pathTo(hit[0]), sig: anchorSig(hit[0]) }));
                return hit[0];
            }
            if (!fallback) fallback = list[list.length - 1];
        }
        return fallback;
    }

    // 按方位算出方块该待的坐标(锚点 survive 不了的地方自动夹紧到可视区内)
    function dockPos(a, bw, bh, side) {
        const r = a.getBoundingClientRect();
        const gap = 6;
        const vw = window.innerWidth, vh = window.innerHeight;
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const clampX = x => Math.max(4, Math.min(Math.round(x), vw - bw - 4));
        const clampY = y => Math.max(4, Math.min(Math.round(y), vh - bh - 4));
        switch (side) {
            case 'left':  return { x: clampX(r.left - bw - gap),   y: clampY(cy - bh / 2) };
            case 'right': return { x: clampX(r.right + gap),       y: clampY(cy - bh / 2) };
            case 'up':    return { x: clampX(cx - bw / 2),         y: clampY(r.top - bh - gap) };
            default:      return { x: clampX(r.right - bw),        y: clampY(r.bottom + gap) }; // 下:右边缘对齐
        }
    }

    function applyBallDock() {
        const ball = document.getElementById('__exp_ball__');
        if (!ball) return;
        const st = loadDock();
        if (st.mode === 'free') { clampIntoView(ball); return; }   // 用户手动拖过,尊重他的位置(但要看得见)
        const a = findAnchor();
        if (!a) { positionBall(ball); return; }      // 锚点还没渲染出来 → 老位置顶着
        const bw = ball.offsetWidth || 40, bh = ball.offsetHeight || 28;
        // 贴附位置也可能算到视口外(锚点在浮层里、页面改版…),夹回来
        let px = 0, py = 0;
        {
            const p0 = dockPos(a, bw, bh, st.side || 'down');
            px = Math.min(Math.max(4, p0.x), Math.max(4, window.innerWidth - bw - 4));
            py = Math.min(Math.max(4, p0.y), Math.max(4, window.innerHeight - bh - 4));
        }
        // 位置没变就别写,不然 MutationObserver 会跟自己打架
        if (ball.style.left === px + 'px' && ball.style.top === py + 'px') return;
        ball.style.left = px + 'px';
        ball.style.top = py + 'px';
    }

    let dockWatchStarted = false;
    function watchDock() {
        if (dockWatchStarted) return;
        dockWatchStarted = true;
        let raf = 0;
        const tick = () => {
            if (raf) return;
            raf = requestAnimationFrame(() => { raf = 0; applyBallDock(); });
        };
        window.addEventListener('resize', tick);
        window.addEventListener('scroll', tick, true);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', tick);
        setInterval(() => { if (document.getElementById('__exp_ball__')) applyBallDock(); }, 700);
        new MutationObserver(tick).observe(document.documentElement, {
            childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style'],
        });
    }

    function setDockSide(side) {
        const st = loadDock();
        saveDock(Object.assign({}, st, { mode: 'dock', side: side }));
        applyBallDock();
    }
    function cycleDock() {
        const st = loadDock();
        if (st.mode === 'free') { setDockSide(st.side || 'down'); return st.side || 'down'; }
        const order = ['down', 'left', 'right', 'up'];
        const next = order[(order.indexOf(st.side || 'down') + 1) % order.length];
        setDockSide(next);
        return next;
    }
    const SIDE_NAME = { down: '下', left: '左', right: '右', up: '上' };

    // 实在怕认错:让用户自己在页面上点一个元素当锚点
    function pickAnchor() {
        const ball = document.getElementById('__exp_ball__');
        const tip = document.createElement('div');
        tip.textContent = '点一下你想让方块贴着的按钮(Esc 取消)';
        tip.style.cssText = 'position:fixed;z-index:2147483647;left:50%;top:8px;transform:translateX(-50%);' +
            'padding:6px 10px;border-radius:6px;background:#262626;color:#fff;font-size:12px;' +
            'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;pointer-events:none;';
        document.body.appendChild(tip);
        let lastHl = null;
        const clean = () => {
            document.removeEventListener('mousemove', move, true);
            document.removeEventListener('click', click, true);
            document.removeEventListener('keydown', key, true);
            if (lastHl) lastHl.style.outline = lastHl.__oldOutline || '';
            tip.remove();
        };
        const move = ev => {
            const n = ev.target;
            if (n === tip || n === ball) return;
            if (lastHl && lastHl !== n) lastHl.style.outline = lastHl.__oldOutline || '';
            if (n && n.nodeType === 1) { n.__oldOutline = n.style.outline; n.style.outline = '2px solid #1677ff'; lastHl = n; }
        };
        const key = ev => { if (ev.key === 'Escape') clean(); };
        const click = ev => {
            ev.preventDefault(); ev.stopPropagation();
            const n = ev.target;
            clean();
            if (!n || !n.isConnected) return;
            saveDock({ mode: 'dock', side: (loadDock().side || 'down'), sel: pathTo(n), sig: anchorSig(n) });
            applyBallDock();
        };
        document.addEventListener('mousemove', move, true);
        document.addEventListener('click', click, true);
        document.addEventListener('keydown', key, true);
    }

    function clampPanel(panel) {
        if (!panel || panel.style.transform === 'none') {
            if (!panel) return;
            const rect = panel.getBoundingClientRect();
            const x = Math.max(4, Math.min(parseFloat(panel.style.left) || 0, window.innerWidth - rect.width - 4));
            const y = Math.max(4, Math.min(parseFloat(panel.style.top) || 0, window.innerHeight - rect.height - 4));
            panel.style.left = x + 'px';
            panel.style.top = y + 'px';
        }
    }

    /* ================== 自动上滚加载全部历史 ================== */

    function findScrollContainer() {
        const start = document.querySelector('.message-list') || document.querySelector('.message-item');
        let el = start ? start.parentElement : null;
        while (el && el !== document.body) {
            const style = getComputedStyle(el);
            if (/(auto|scroll)/.test(style.overflowY) && el.scrollHeight > el.clientHeight + 10) return el;
            el = el.parentElement;
        }
        return document.scrollingElement || document.documentElement;
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // 浮动"停止上滚"按钮:面板关着也能随时停(v3.7)
    function showStopPill() {
        if (stopPill && stopPill.isConnected) return stopPill;
        hideStopPill();
        const ball = document.getElementById('__exp_ball__');

        p.onclick = stopAutoScroll;

    }
    function hideStopPill() { if (stopPill) { stopPill.remove(); stopPill = null; } }
    // 干活状态下让小精灵跑快一点(CSS 里 [data-busy="1"] 提速)
    function setBusy(v) {

    }
    // 统一终止入口:面板按钮 / 浮动按钮 / Esc / 脚本菜单都走这里
    function stopAutoScroll() {

    /* v4.9.2:采集前自动展开被折叠的文本(上滚读历史时尤其重要)。
       qqy 的长文折叠是聊天页全局开关:action-bar 里那颗「展开/收起」(toggleContentExpansion),
       状态存 localStorage['chat-content-expanded']('true'=展开);
       折叠时外层 .chat-container_Ek2sv 挂 content-expanded 类、内层 .content_Ek2sv 反而没有。
       消息里 markdown 渲染出的 <details> 折叠块也一并展开 —— 保证读到的是全文不是半截。 */
    function expandFoldedText() {
        let changed = false;
        try {
            document.querySelectorAll('.message-item details:not([open])').forEach(d => { d.open = true; changed = true; });
        } catch (e) {}
        try {
            const saved = localStorage.getItem('chat-content-expanded');
            const cont = document.querySelector('.chat-container_Ek2sv');
            const foldedByClass = !!(cont && cont.classList.contains('content-expanded'));
            const folded = saved === 'false' || (saved == null && foldedByClass);
            if (folded) {
                const items = Array.prototype.slice.call(document.querySelectorAll('.action-bar-item'));
                const tg = items.find(b => String(b.textContent || '').indexOf('展开') >= 0);
                if (tg) tg.click();                       // 优先走官方开关,Vue 自己重渲染
                else if (foldedByClass) {                 // 点不到开关:手动摘类兜底已渲染的 DOM
                    document.querySelectorAll('.chat-container_Ek2sv.content-expanded').forEach(el => {
                        el.classList.remove('content-expanded');
                        const inner = el.querySelector('.content_Ek2sv');
                        if (inner && !inner.classList.contains('content-expanded')) inner.classList.add('content-expanded');
                    });
                }
                try { localStorage.setItem('chat-content-expanded', 'true'); } catch (e) {}
                changed = true;
            }
        } catch (e) {}
        return changed;
    }

    async function autoScrollToTop(statusEl, renderFn, btn, settleSecs) {
        if (scrolling) { stopAutoScroll(); return; } // 再点一次 = 停止
        scrolling = true;
        btn.textContent = '停止';
        showStopPill();
        setBusy(true);                              // 面板关闭也能停
        const onKey = ev => { if (ev.key === 'Escape') stopAutoScroll(); };
        document.addEventListener('keydown', onKey);
        const settleMs = Math.max(5, settleSecs || 25) * 1000;
        const cont = findScrollContainer();
        expandFoldedText();                         // v4.9.2:开滚前先把折叠的文本展开
        captureNow();
        // 终点判定:开场白是上滚中才出现的 → 确切到头;一开始就有 → 只能靠静默兜底
        const introAtStart = store.merged.length > 0 && store.merged[0].intro;
        const mergedSig = () => store.merged.length + '|' + (store.merged.length ? store.merged[0].text.slice(0, 60) : '');
        let lastSig = mergedSig();
        let lastNewTime = Date.now();
        try {
            while (scrolling) {
                if (cont.scrollTop > 2) {
                    cont.scrollTop = Math.max(0, cont.scrollTop - cont.clientHeight * 1.2);
                    cont.dispatchEvent(new Event('scroll', { bubbles: true }));
                    await sleep(150);
                } else {
                    await sleep(400);
                }
                const r = captureNow(); // 边滚边采集
                const nowSig = mergedSig();
                if (nowSig !== lastSig) {
                    lastSig = nowSig;
                    lastNewTime = Date.now();
                }
                const quiet = Math.floor((Date.now() - lastNewTime) / 1000);
                const introNow = store.merged.length > 0 && store.merged[0].intro;
                const done = introNow && !introAtStart;
                // 调试信息:本轮合并计数(新增/更新/匹配/不确定/回收),默认只在状态栏一行显示
                const rcy = store.stats.recycled > 0 ? ' 回收' + store.stats.recycled : '';
                statusEl.textContent = done
                    ? '已到达最早历史(开场白),共采集 ' + store.merged.length + ' 条'
                    : '已采集 ' + store.merged.length + ' 条(新增' + r.added + ' 更新' + r.updated +
                      ' 匹配' + r.matched + ' 不确定' + r.uncertain + rcy + ')| 无新消息 ' + quiet + '/' + (settleMs / 1000) + ' 秒';
                if (stopPill) stopPill.textContent = '■ 停止上滚 (' + store.merged.length + ' 条)';
                if (cont.scrollTop <= 2 && (done || Date.now() - lastNewTime >= settleMs)) break;
            }
            if (scrolling) captureNow();
        } finally {
            document.removeEventListener('keydown', onKey);
            stopAutoScroll();
        }
        renderFn();
    }

    /* v4.3.3:自动回底 —— 上滚翻完历史之后一键回到最新那条。
       一跳到底会漏掉中间还没渲染的内容,所以照样一屏一屏往下走,到底后再钉一次。 */
    async function autoScrollToBottom(statusEl) {
        const cont = findScrollContainer();
        expandFoldedText();                         // v4.9.2:回底读最新消息前同样先展开折叠
        let lastTop = -1, same = 0;
        for (let i = 0; i < 80; i++) {
            const max = Math.max(0, cont.scrollHeight - cont.clientHeight);
            if (cont.scrollTop >= max - 4) break;
            cont.scrollTop = Math.min(max, cont.scrollTop + Math.max(240, cont.clientHeight * 1.2));
            cont.dispatchEvent(new Event('scroll', { bubbles: true }));
            if (statusEl) statusEl.textContent = '回底中…(第 ' + (i + 1) + ' 屏)';
            await sleep(90);
            if (Math.abs(cont.scrollTop - lastTop) < 2) { if (++same >= 3) break; } else same = 0;
            lastTop = cont.scrollTop;
        }
        cont.scrollTop = Math.max(0, cont.scrollHeight - cont.clientHeight);
        cont.dispatchEvent(new Event('scroll', { bubbles: true }));
        captureNow();
        return true;
    }

                    '<button data-view="cmd" class="rpg-btn" type="button">指令/小剧场 ' +
                        '<span id="__exp_cmdn__">0</span></button>' +
                    '<button data-view="lib" class="rpg-btn" type="button">快捷复制 ' +
                        '<span id="__exp_libn__">0</span></button>' +
                '</div>' +
                '<textarea id="__exp_preview__" class="rpg-input" spellcheck="false" ' +
                    'style="flex:1;min-height:200px;resize:vertical;font-family:monospace"></textarea>' +
                '<div id="__exp_list__" style="flex:1;min-height:340px;overflow:auto;display:none;' +
                    'border:1px solid var(--rpg-line-soft,#efefef);border-radius:var(--rpg-radius-small,6px);' +
                    'padding:8px"></div>' +
                '<div id="__exp_hint__" class="rpg-note" style="margin-top:6px"></div>' +
            '</div>' +
            /* v4.3.3:底部按用途分成两组并拉开距离 —— 上面是「导出」、
               下面是「采集/浏览」,不再一整块挤在一起。 */
            '<div class="rpg-foot">' +
                /* v4.3:导出面板只留导出相关的按钮。页面标记 / 贴附 / 小精灵 / 精灵大小 → 桌宠,
                   发送标注 / 随机事件 → 跑团模式,刷新会话 → 紧凑面板「导出工具」,别再全塞在这。 */
                '<div class="rpg-group-title">Export</div>' +
                '<div class="action-grid" style="margin-bottom:10px">' +
                    '<button data-fmt="txt" class="rpg-btn is-primary" type="button">下载 TXT</button>' +
                    '<button data-fmt="md" class="rpg-btn" type="button">下载 Markdown</button>' +
                    '<button data-fmt="json" class="rpg-btn" type="button">下载 JSON</button>' +
                    '<button id="__exp_copy__" class="rpg-btn" type="button">复制全文</button>' +
                '</div>' +
                '<div class="rpg-group-title">Collect</div>' +
                '<div class="action-grid">' +
                    '<button id="__exp_refresh__" class="rpg-btn" type="button">刷新预览</button>' +
                    '<button id="__exp_intro__" class="rpg-btn" type="button">含开场卡:开</button>' +
                    '<button id="__exp_scroll__" class="rpg-btn" type="button">自动上滚</button>' +
                    '<button id="__exp_bottom__" class="rpg-btn" type="button">自动回底</button>' +
                    '<button id="__exp_allscan__" class="rpg-btn is-primary" type="button">全部采集+整理</button>' +
                '</div>' +
            '</div>';

        document.body.appendChild(panel);
        if (full) panel.classList.add('is-fullx');     // v4.22.1:开屏「导出文本」= 全屏设置页
        makeDraggable(panel, panel.querySelector('#__exp_head__'), () => {
            storePos('panelPos', parseFloat(panel.style.left), parseFloat(panel.style.top));
        });

        let skipIntro = false; // 开场白默认包含
        let fmt = 'txt';
        let view = (initialView === 'cmd' || initialView === 'lib') ? initialView : 'full';
        const preview = panel.querySelector('#__exp_preview__');
        const listEl = panel.querySelector('#__exp_list__');
        const hintEl = panel.querySelector('#__exp_hint__');
        const status = panel.querySelector('#__exp_status__');
        const introBtn = panel.querySelector('#__exp_intro__');
        const nickInput = panel.querySelector('#__exp_nick__');
        const charInput = panel.querySelector('#__exp_char__');
        const secsInput = panel.querySelector('#__exp_secs__');
        const copyBtn = panel.querySelector('#__exp_copy__');
        const tabBtns = Array.prototype.slice.call(panel.querySelectorAll('button[data-view]'));

        // 没手动拖过 panel 时,让它开在悬浮方块下面,不然每次都要跨半个屏幕够它
        if (!saved) {
            const b = document.getElementById('__exp_ball__');
            const br = b ? b.getBoundingClientRect() : null;
            if (br && br.width) {
                const pw = 600, ph = 520;
                panel.style.transform = 'none';
                panel.style.left = Math.max(4, Math.min(br.left, window.innerWidth - pw - 4)) + 'px';
                panel.style.top = Math.max(4, Math.min(br.bottom + 8, window.innerHeight - 60)) + 'px';
            }
        }
        nickInput.value = getNick();
        charInput.value = getCharName();
        secsInput.value = getSecs();

        const exportList = () => store.merged.filter(m => skipIntro ? true : !m.intro);
        const cmdList = () => pickCommands(exportList());

        const HINTS = {
            full: '预览可直接编辑,导出以这里的内容为准。上滚会边滚边采集;身份无法确认的波会标记"不确定"暂存,不会盲插造成整段重复。',
            cmd: '只认 $:用户消息里出现半角 $ ,整段算一条指令/小剧场,按真实对话顺序排列(角色回复不参与)。整段正文直接摊开看;单击一行=写进输入框,双击=复制到剪贴板,行下面的「填入并发送」= 写完自动发送。「存入快捷」会先弹确认框,你点头才写进本机。',
            lib: '单击一行=写进 qqy 输入框(已有内容会追加,不覆盖你打了一半的字),双击一行=复制到剪贴板,「填入并发送」= 写完自动发送,发之前不再问。「删除」会先问一次。库存本机浏览器(油猴本地存储),不联网不上传。',
        };
        const COPY_LABEL = { full: '复制全文', cmd: '复制全部指令', lib: '复制全部' };

        /* ---------- 列表行:标题行 + 可展开正文 + 操作栏 ---------- */
        function el(tag, css, text) {
            const n = document.createElement(tag);
            if (css) n.style.cssText = css;
            if (text != null) n.textContent = text;
            return n;
        }
        // 行级反馈:在右上角临时显示一句状态,过 1.6s 自动消失
        function flashRow(box, text) {
            const t = box.querySelector('[data-flash]');
            if (!t) return;
            t.textContent = text;
            clearTimeout(box.__flashT);
            box.__flashT = setTimeout(() => { if (t.isConnected) t.textContent = ''; }, 1600);
        }

        /* ---------- 一行 = 一条指令/一条库存 ----------
           整行就是一个大按钮:
             单击 → 写进输入框;  双击(快速点两下) → 复制到剪贴板
           单击要压 240ms 再执行,否则双击会先把文字写进输入框;
           只按自己的 click 计时、不绑 dblclick,触屏双击也认。
           正文整段直接显示,不用再点开。
        */
        function addRow(idxText, title, text, buttons) {
            const box = el('div', ROW + 'cursor:pointer;');
            box.title = '单击写进输入框 · 双击复制到剪贴板';

            const head = el('div', 'display:flex;align-items:center;gap:6px;');
            head.appendChild(el('span', 'flex:none;font-size:11px;color:var(--rs-muted,#8e8e8e);', idxText));
            head.appendChild(el('span', 'flex:1;font-size:12px;color:var(--rs-text,#262626);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;', title));
            const flashBox = el('span', 'flex:none;font-size:11px;color:var(--rs-orange,#1677ff);min-width:0;');
            flashBox.setAttribute('data-flash', '1');
            head.appendChild(flashBox);

            const body = el('div', TXTBOX + 'display:block;', text);
            const bar = el('div', 'margin-top:5px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;');
            buttons.forEach(b => bar.appendChild(b));

            let timer = null;
            const onFill = () => {
                const r = fillToComposer(text);
                if (r.ok) { flashRow(box, r.appended ? '已追加到输入框' : '已填入输入框'); return; }
                copyText(text,
                    () => flashRow(box, '没输入框·已复制'),
                    () => flashRow(box, '没输入框·复制也失败'));
            };
            const onCopy = () => {
                copyText(text,
                    () => flashRow(box, '双击·已复制'),
                    () => flashRow(box, '双击·复制失败'));
            };
            box.onclick = ev => {
                const t = ev.target;
                if (t && t.closest && t.closest('button')) return;  // 点在下面的选项上不算点行
                if (timer) { clearTimeout(timer); timer = null; onCopy(); return; }
                timer = setTimeout(() => { timer = null; onFill(); }, 240);
            };

            box.appendChild(head);
            box.appendChild(body);
            box.appendChild(bar);
            return box;
        }
        function flash(btn, text, back) {
            btn.textContent = text;
            clearTimeout(btn.__flashT);
            btn.__flashT = setTimeout(() => { btn.textContent = back; }, 1500);
        }

        // 行下面的选项之一「填入并发送」:写完自动点发送,失败会告诉你卡在哪一步
        function fillSendBtn(getText, back) {
            const b = el('button', BTN + 'color:var(--rs-orange,#1677ff);border-color:var(--rs-orange,#bcd8ff);', '填入并发送');
            b.onclick = ev => {
                ev.stopPropagation();
                const r = fillAndSend(getText());
                if (r.ok) { flash(b, '已发送', back); return; }
                copyText(getText(),
                    () => flash(b, r.reason === 'NO_SEND' ? '没找到发送按钮·已复制' : '没输入框·已复制', back),
                    () => flash(b, '失败·请手动发送', back));
            };
            return b;
        }

        function renderCmdView() {
            listEl.innerHTML = '';
            const cmds = cmdList();
            if (!cmds.length) {
                listEl.appendChild(el('div', 'color:var(--rs-muted,#8e8e8e);font-size:12px;padding:8px;line-height:1.9;',
                    '还没识别到含 $ 的用户消息。\n' +
                    '规则:只扫你自己发的消息,出现半角 $ 就把整段算一条。\n' +
                    '历史没加载完,就先回「全文」点「自动上滚」。'));
                return;
            }
            cmds.forEach((m, i) => {
                const bCopy = el('button', BTN, '复制');
                bCopy.onclick = ev => {
                    ev.stopPropagation();
                    copyText(m.text, () => flash(bCopy, '已复制', '复制'), () => flash(bCopy, '复制失败', '复制'));
                };
                const bSave = el('button', BTN, '存入快捷');
                bSave.onclick = ev => {
                    ev.stopPropagation();
                    memModal({
                        title: '存入快捷复制库?',
                        note: '只存在这台浏览器里,不上传。\n以后可以在「快捷复制」页一键取用或删除。',
                        bodyHtml: '<div style="border:1px dotted var(--rpg-border);padding:8px 9px;color:var(--rpg-muted);' +
                            'white-space:pre-wrap;max-height:120px;overflow:auto">' + escHtml(previewOf(m.text)) + '</div>',
                        buttons: [
                            { key: 'ok', label: '存入', primary: true },
                            { key: 'no', label: '算了' }
                        ]
                    }).then(p => {
                        if (!p || p.key !== 'ok') return;
                        const n = libAdd(m.text);
                        if (n < 0) { flash(bSave, '库里已有', '存入快捷'); return; }
                        flash(bSave, '已存(' + n + ')', '存入快捷');
                        renderCount();
                    });
                };
                listEl.appendChild(addRow('#' + (i + 1), briefOf(m.text), m.text,
                    [fillSendBtn(() => m.text, '填入并发送'), bCopy, bSave]));
            });
        }

        function renderLibView() {
            listEl.innerHTML = '';
            const top = el('div', 'display:flex;align-items:center;gap:6px;margin:0 2px 5px;');
            top.appendChild(el('span', 'font-size:11px;color:var(--rs-muted,#8e8e8e);flex:1;',
                '点一行=写进输入框,双击=复制;写不上去就点:'));
            const diagB = el('button', BTN + 'font-size:11px;', '诊断输入框');
            diagB.onclick = () => {
                memModal({
                    title: '诊断输入框',
                    note: '内容已放进下面的框并全选,Ctrl+A / Ctrl+C 复制走。',
                    input: true,
                    value: composeDiagnose(),
                    buttons: [{ key: 'ok', label: '知道了', primary: true }]
                });
            };
            top.appendChild(diagB);
            listEl.appendChild(top);

            const items = libAll();
            if (!items.length) {
                listEl.appendChild(el('div', 'color:var(--rs-muted,#8e8e8e);font-size:12px;padding:4px 2px 8px;line-height:1.9;',
                    '快捷复制库还是空的。\n' +
                    '去「指令/小剧场」页,在某条下面点「存入快捷」,确认后就进这里了。'));
                return;
            }
            items.forEach((it, i) => {
                const bCopy = el('button', BTN, '复制');
                bCopy.onclick = ev => {
                    ev.stopPropagation();
                    copyText(it.text, () => flash(bCopy, '已复制', '复制'), () => flash(bCopy, '复制失败', '复制'));
                };
                const bDel = el('button', BTN + 'color:var(--rs-danger,#c0392b);', '删除');
                bDel.onclick = ev => {
                    ev.stopPropagation();
                    memModal({
                        title: '删掉第 ' + (i + 1) + ' 条?',
                        note: '只删本机这一条,不影响已采集的聊天记录。',
                        bodyHtml: '<div style="border:1px dotted var(--rpg-border);padding:8px 9px;color:var(--rpg-muted);' +
                            'white-space:pre-wrap;max-height:120px;overflow:auto">' + escHtml(previewOf(it.text)) + '</div>',
                        buttons: [
                            { key: 'ok', label: '删除', primary: true },
                            { key: 'no', label: '留着' }
                        ]
                    }).then(p => {
                        if (!p || p.key !== 'ok') return;
                        libRemove(it.id);
                        render();
                    });
                };
                listEl.appendChild(addRow('#' + (i + 1), briefOf(it.text), it.text,
                    [fillSendBtn(() => it.text, '填入并发送'), bCopy, bDel]));
            });
        }

        function renderCount() {
            const ce = panel.querySelector('#__exp_cmdn__');
            const le = panel.querySelector('#__exp_libn__');
            if (ce) ce.textContent = String(cmdList().length);
            if (le) le.textContent = String(libAll().length);
        }

        const render = () => {
            if (view === 'full') {
                preview.style.display = '';
                listEl.style.display = 'none';
                preview.value = buildExport(exportList(), fmt, nickInput.value.trim() || '我', charInput.value.trim() || '角色');
            } else {
                preview.style.display = 'none';
                listEl.style.display = '';
                if (view === 'cmd') renderCmdView(); else renderLibView();
            }
            hintEl.textContent = HINTS[view];
            copyBtn.textContent = COPY_LABEL[view];
            renderCount();
            const list = exportList();
            const s = store.stats;
            const rcy = s.recycled > 0 ? ' 回收' + s.recycled : '';
            status.textContent = store.merged.length === 0
                ? '未识别到消息'
                : '已采集 ' + store.merged.length + ' 条(我 ' + list.filter(m => m.role === 'user').length +
                  ' / 角色 ' + list.filter(m => m.role === 'char').length + ')| 新增' + s.added +
                  ' 更新' + s.updated + ' 匹配' + s.matched + ' 不确定' + s.uncertain + rcy +
                  (store.quarantine.length ? ' 隔离' + store.quarantine.length : '');
        };

        const fullOnlyBtns = [panel.querySelector('#__exp_refresh__'), panel.querySelector('#__exp_intro__')];
        function setView(v) {
            view = (v === 'cmd' || v === 'lib') ? v : 'full';
            // v4.3.3:预览类的按钮只对「全文」有意义,指令/快捷库视图下藏起来,
            // 免得三个视图的功能糊成一堆
            fullOnlyBtns.forEach(b => { if (b) b.style.display = (view === 'full') ? '' : 'none'; });
            // 切到指令页时顺手重采一次:刚发的新指令不用再点「刷新预览」
            if (view === 'cmd') captureNow();
            tabBtns.forEach(b => {
                const on = b.dataset.view === view;
                b.classList.toggle('is-on', on);        // v4.2:换肤靠 class,不再写死 cssText
            });
            render();
        }
        panel.__setView = setView;
        tabBtns.forEach(b => { b.onclick = () => setView(b.dataset.view); });

        // 页面可视标记开关:按上次偏好恢复(按钮在紧凑面板「桌宠」里)
        setMarkVisible(getMarkVisible());

        clampIntoView(panel);   // v4.3.3:存档位置跑到屏幕外就拉回来

        captureNow();
        setView(view);

        nickInput.addEventListener('change', () => { setNick(nickInput.value.trim()); render(); });
        charInput.addEventListener('change', () => { setCharName(charInput.value.trim()); render(); });
        introBtn.onclick = () => {
            skipIntro = !skipIntro;
            introBtn.textContent = '含开场卡:' + (skipIntro ? '关' : '开');
            render();
        };
        panel.querySelector('#__exp_refresh__').onclick = () => { captureNow(); render(); };
        panel.querySelector('#__exp_scroll__').onclick = function () {
            const secs = parseInt(secsInput.value, 10) || getSecs();
            setSecs(secs);
            autoScrollToTop(status, render, this, secs);
        };
        panel.querySelector('#__exp_bottom__').onclick = function () {
            const b = this, old = b.textContent;
            b.textContent = '回底中…';
            autoScrollToBottom(status)
                .then(() => { render(); b.textContent = '已到最新'; })
                .catch(() => { b.textContent = '回底失败'; })
                .then(() => setTimeout(() => { b.textContent = old; }, 1400));
        };
        panel.querySelector('#__exp_allscan__').onclick = function () {
            fullScanOrganize(this, status, render);
        };
        const currentText = () => {
            if (view === 'full') return preview.value;
            if (view === 'cmd') return cmdList().map(m => m.text).join('\n\n');
            return libAll().map(it => it.text).join('\n\n');
        };

        panel.querySelectorAll('button[data-fmt]').forEach(btn => {
            btn.onclick = () => {
                const f = btn.dataset.fmt;
                const ext = f === 'json' ? 'json' : (f === 'md' ? 'md' : 'txt');
                const mime = f === 'json' ? 'application/json' : 'text/plain';
                const nickV = nickInput.value.trim() || '我';
                const charV = charInput.value.trim() || '角色';
                if (view === 'full') {
                    download(fileStem() + '.' + ext, buildExport(exportList(), f, nickV, charV), mime);
                } else if (view === 'cmd') {
                    const cmds = cmdList();
                    if (!cmds.length) { flash(copyBtn, '没有含 $ 的指令', COPY_LABEL[view]); return; }
                    download(fileStem('指令') + '.' + ext, buildCmdExport(cmds, f, nickV), mime);
                } else {
                    const items = libAll();
                    if (!items.length) { flash(copyBtn, '库是空的', COPY_LABEL[view]); return; }
                    download(fileStem('快捷复制') + '.' + ext, buildLibExport(items, f), mime);
                }
            };
        });
        copyBtn.onclick = () => {
            const text = currentText();
            if (!text.trim()) { flash(copyBtn, '没有内容', COPY_LABEL[view]); return; }
            copyText(text,
                () => flash(copyBtn, '已复制', COPY_LABEL[view]),
                () => flash(copyBtn, '复制失败', COPY_LABEL[view]));
        };
        panel.querySelector('#__exp_close__').onclick = () => panel.remove();
    }

    /* ============================================================================
       v4.4 记忆库(MEMORY BANK)
       ---------------------------------------------------------------------------
       原则:
         · 原始聊天 / 整理后的记忆 / 向量三份分开存,AI 只提建议,永远不改原文;
         · 每批绑定 conversationKey,会话之间互不混批;
         · 只处理采集器确认过(merged 里、非开场卡、文本已稳定)的消息;
         · "每 5 条"只是触发一次整理,不是重建全部向量;
         · 唯一 Provider 是自接 API(浏览器内置 AI/桥接已在 v4.6.0–4.6.2 全部移除);
         · 输入/输出格式固定,随时可换 API 服务商。
       ========================================================================== */

    const isQQY = /(^|\.)qqy\.ai$/i.test(location.hostname);
    const MEM_DB = 'qqy_memory';
    const MEM_STABLE_MS = 1500;      // 消息文本多久没变才算"结束流式"
    /* v4.9.0:记忆库整体标记为「还在完善中(v0.6)」——采集/整理/注入暂时停用。
       收尾完成后把默认值改回 false,所有功能原样恢复,不用再动别处。 */
    const MEM_WIP = (() => { try { return GM_getValue('memWip:v1', true) === true; } catch (e) { return true; } })();

    /* ---------- 配置(存 GM,不进导出文件) ---------- */
    const MEM_DEFAULTS = {
        enabled: false,               // AI 整理总开关,默认关(第一版不自动发任何东西)
        mode: 'ask',                  // ask | api(浏览器内置 AI 已于 v4.6.2 移除)
        trigger: 'rounds',            // messages | rounds | manual
        triggerCount: 5,
        recentWindow: 40,             // 整理请求携带的最近消息窗口，限制 5–200
        injectVariables: true,        // 真实发送时把当前变量表注入输入内容；v4.8.0 起默认开(总开关仍默认关)
        varCleanEvery: 50,            // 变量表每被整理更新 N 次就自动「大清洗」一次，限制 5–500
        onThreshold: 'auto',          // v4.5.1 默认全自动;弹窗只在用户切到「手动确认」时出现
        vectorMode: 'memory',         // memory | batch | message
        onlyConfirmed: true,
        includeStatus: true,
        previewBeforeSend: false,     // 全自动:不再默认弹预览
        reviewBeforeWrite: false,     // 全自动:不再默认弹审核
        crossConv: false,
        activeSetId: '',            // 当前激活的记忆集(记忆都累加进它;召回也从它选)
        api: {
            baseUrl: '', token: '', model: '', timeoutMs: 120000, maxRetry: 1, jsonMode: true,
            embUrl: '', embToken: '', embModel: '', dim: 0, batchSize: 8, metric: 'cosine',
            authorizedHosts: [],        // 用户确认过的域名
        },
    };

        const out = cloneJSON(base);

            const v = patch[k];
            if (v && typeof v === 'object' && !Array.isArray(v) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k])) {
                out[k] = mergeDeep(out[k], v);
            } else out[k] = v;
        });
        return out;
    }
    function getMemCfg() {
        try {
            const raw = GM_getValue('memCfg:v1', null);
