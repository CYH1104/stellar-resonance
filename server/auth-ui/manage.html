<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号与数据 · 星穹学院</title><link rel="stylesheet" href="/auth/login.css"><script src="/auth/manage.js" defer></script></head><body><main class="passport"><h1>账号与数据</h1><p class="intro">请先在“存档与导出”备份需要保留的内容。操作仅针对当前账号。</p><form id="maintenance-form"><label for="operation">操作</label><select id="operation"><option value="reset-data">重置游戏数据，保留账号</option><option value="delete">永久删除账号</option></select><p id="scope" class="intro"></p><label for="password">当前密码</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required><label for="confirmation">输入确认文字</label><input id="confirmation" autocomplete="off" required><button class="submit">确认操作</button></form><p id="message" role="status"></p><button id="cleanup" hidden>重试清理本机缓存</button><p><a href="/terminal">返回学院</a> · <a href="/login">返回登录</a></p></main></body></html>
