<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号管理 · 学院</title><link rel="stylesheet" href="/auth/login.css"><script src="/editor/accounts.js" defer></script></head><body><main class="passport"><h1>账号管理</h1><p><a href="/editor/">返回学院档案编辑</a></p><section><h2>密码重置</h2><p class="intro">先人工核对注册邮箱所有权，再生成链接，并回复至该邮箱。链接24小时有效，重新生成会使旧链接失效。</p><form id="search-form"><label for="email">精确查询注册邮箱</label><input id="email" type="email" maxlength="254" required><button>查询用户</button></form><p id="user-info" role="status"></p><button id="issue-reset" disabled>生成一次性密码重置链接</button><input id="reset-url" readonly hidden aria-label="一次性重置链接"><p id="expires"></p></section><hr><section><h2>邀请码</h2><form id="invite-form"><label for="count">生成数量（1～1000）</label><input id="count" type="number" min="1" max="1000" value="5" required><label for="batch">批次</label><input id="batch" maxlength="100" placeholder="例如2026-W43" required><label for="note">备注</label><input id="note" maxlength="500"><button>生成邀请码</button></form><p class="intro">明文只显示本次，请及时复制保存。刷新后无法重新查看。</p><textarea id="codes" readonly rows="5" hidden aria-label="本次生成的邀请码"></textarea><button id="stats">查看批次统计</button><pre id="stats-result"></pre><form id="revoke-form"><label for="revoke-code">撤销未使用的邀请码</label><input id="revoke-code" maxlength="20" required><button>撤销邀请码</button></form></section><p id="message" role="status"></p></main></body></html>
