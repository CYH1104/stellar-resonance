<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星穹学院 · 邮箱通行证</title><link rel="stylesheet" href="/auth/login.css"></head>
<body><main class="passport"><p class="eyebrow">STELLAR ACADEMY / 星穹学院</p><h1>建立你的通行证。</h1><p class="intro">用 QQ 邮箱与密码，接续属于你的故事。</p><nav aria-label="账号操作"><button id="register-tab" type="button" aria-pressed="true">注册</button><button id="login-tab" type="button" aria-pressed="false">登录</button></nav><form id="account-form"><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="你的QQ邮箱@qq.com"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="至少 8 位"><div id="confirm-field"><label for="confirm">确认密码</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="再次输入密码"></div><label class="remember-login" for="remember"><input id="remember" name="remember" type="checkbox">记住账号并保持登录30天</label><p class="remember-help">仅在自己的设备上勾选。退出登录后需要重新输入密码，不保存明文密码。</p><p id="message" role="status" aria-live="polite"></p><button class="submit" type="submit">注册并进入 <span aria-hidden="true">→</span></button></form></main><script src="/auth/login.js" defer></script></body></html>
