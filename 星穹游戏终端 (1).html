#__exp_splash__ .ah-tools{max-height:338px;overflow-y:auto;padding-right:6px;scrollbar-width:none}
#__exp_splash__ .ah-tools::-webkit-scrollbar{display:none}
#__exp_splash__ .ah-banner{padding:9px 10px;margin-top:16px}
#__exp_splash__ .ah-banner span{font-size:8px;margin-bottom:3px}
#__exp_splash__ .ah-banner b{font-size:12px;letter-spacing:2px}
#__exp_splash__ .ah-feature{min-height:118px;padding:16px 22px;box-shadow:0 8px 20px var(--s-shadow)}
#__exp_splash__ .ah-feature h2{margin:12px 0 6px;font-size:clamp(19px,2.1vw,28px)}
#__exp_splash__ .ah-feature:hover{box-shadow:0 10px 22px rgba(var(--s-acc-rgb),.1)}
#__exp_splash__ .ah-feature .ring{width:120px;right:-40px;top:-34px}
#__exp_splash__ .ah-feature .ring:before{box-shadow:0 0 8px var(--s-acc)}
#__exp_splash__ .ah-feature .arrow{font-size:18px;right:18px;bottom:12px}
#__exp_splash__ .ah-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 20px}
#__exp_splash__ .ah-quick button{border:1px dotted var(--s-line);background:var(--s-panel);padding:10px 6px;text-align:center;cursor:pointer;transition:border-color .3s,color .3s;font-family:inherit;color:var(--s-text)}
#__exp_splash__ .ah-quick button:hover{border-color:var(--s-acc);color:var(--s-acc)}
#__exp_splash__ .ah-quick span{display:block;font:13px var(--s-font-en);letter-spacing:2px;margin-bottom:4px}
#__exp_splash__ .ah-quick small{font:9px var(--s-font-zh);letter-spacing:1px;color:var(--s-muted)}
#__exp_splash__ .spl-story-tabs{display:flex;gap:10px;padding:14px 24px 4px;overflow-x:auto;scrollbar-width:none;flex:none}
#__exp_splash__ .spl-story-tabs::-webkit-scrollbar{display:none}
#__exp_splash__ .spl-story-tab{flex:0 0 auto;display:flex;align-items:center;gap:9px;border:1px solid var(--s-line);background:var(--s-panel);color:var(--s-muted);padding:10px 16px;font:11px var(--s-font-zh);letter-spacing:2px;cursor:pointer;transition:.3s;white-space:nowrap}
#__exp_splash__ .spl-story-tab i{font:10px var(--s-font-en);color:var(--s-acc);font-style:normal}
#__exp_splash__ .spl-story-tab:hover{border-color:var(--s-acc);color:var(--s-text)}
#__exp_splash__ .spl-story-tab.on{border-color:var(--s-acc);color:var(--s-acc)}
#__exp_splash__ .spl-story-body{flex:1;min-height:0;display:grid;grid-template-columns:190px minmax(0,1fr) 250px;gap:14px;padding:12px 24px 20px}
#__exp_splash__ .spl-story-rail{display:flex;flex-direction:column;gap:12px;min-height:0}
#__exp_splash__ .spl-story-raillist{display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:none;flex:0 1 auto;max-height:46%}
#__exp_splash__ .spl-story-raillist::-webkit-scrollbar{display:none}
#__exp_splash__ .spl-story-rbtn{display:flex;align-items:center;gap:10px;border:1px dotted var(--s-line);background:var(--s-panel);color:var(--s-muted);padding:9px 11px;font:11px var(--s-font-zh);letter-spacing:1px;cursor:pointer;transition:.3s;text-align:left}
#__exp_splash__ .spl-story-rbtn i{font:10px var(--s-font-en);color:var(--s-acc);font-style:normal;flex:none}
#__exp_splash__ .spl-story-rbtn:hover{border-color:var(--s-acc);color:var(--s-text)}
#__exp_splash__ .spl-story-rbtn.on{border-style:solid;border-color:var(--s-acc);color:var(--s-acc)}
#__exp_splash__ .spl-story-sideinfo{border:1px solid var(--s-line);background:var(--s-panel);padding:16px 14px;overflow:auto;flex:1;min-height:0}

/* ---------- v4.30.6 3D 立体动态透视波浪线(慢速 + 更高起伏 + 边缘虚化) & 开屏微数据流装饰 ---------- */
(()=>{
function mountWave3D(host,cls){
    const cvs=document.createElement('canvas');cvs.className='ah-waves ah-waves-3d '+(cls||'');cvs.setAttribute('aria-hidden','true');
    host.prepend(cvs);
    const ctx=cvs.getContext('2d');let w=0,h=0,t=Math.random()*10;
    function resize(){const r=host.getBoundingClientRect();w=cvs.width=Math.max(640,r.width||window.innerWidth);h=cvs.height=Math.max(480,r.height||window.innerHeight)}
    function accRgb(){const v=getComputedStyle(root).getPropertyValue('--s-acc-rgb').trim();return v||'140,120,83'}
    function project(x,y,z){const fov=620,cz=z+540,sc=fov/Math.max(70,cz);return[w*0.5+x*sc,h*0.48+y*sc,sc]}
    function draw(){
        if(!ctx)return;
        if(!w||!h)resize();
        ctx.clearRect(0,0,w,h);
        const rgb=accRgb();
        const rows=28,cols=42,xSpan=1850,zNear=-150,zFar=1050;
        const pts=[];
        for(let r=0;r<rows;r++){
            const row=[];
            const depth=r/(rows-1);
            const z=zNear+depth*(zFar-zNear);
            for(let c=0;c<cols;c++){
                const u=(c/(cols-1))-0.5;
                const x=u*xSpan;
                /* 高度更高、层次更舒展的三维波浪 */
                const wave=Math.sin(u*4.6+t*1.1+r*0.24)*88
                          +Math.cos(u*2.7-t*0.75+r*0.36)*62
                          +Math.sin((u*1.8+depth*2.2)+t*0.6)*38;
                const y=240-depth*380+wave;
                row.push(project(x,y,z));
            }
            pts.push(row);
        }
        ctx.lineCap='round';ctx.lineJoin='round';
        for(let r=0;r<rows;r++){
            const edgeFade=Math.sin((r/(rows-1))*Math.PI);
            const alpha=((1-r/(rows-1))*0.20+0.03)*(0.45+0.55*edgeFade);
            ctx.strokeStyle='rgba('+rgb+','+alpha.toFixed(3)+')';
            ctx.lineWidth=Math.max(0.55,(1-r/rows)*1.4);
            ctx.beginPath();
            for(let c=0;c<cols;c++){
                const p=pts[r][c];
                if(c===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
            }
            ctx.stroke();
        }
        for(let c=0;c<cols;c+=2){
            const uEdge=Math.sin((c/(cols-1))*Math.PI);
            ctx.strokeStyle='rgba('+rgb+','+(0.075*uEdge).toFixed(3)+')';
            ctx.lineWidth=0.7;
            ctx.beginPath();
            for(let r=0;r<rows;r++){
                const p=pts[r][c];
                if(r===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
            }
            ctx.stroke();
        }
        t+=0.0052; /* 慢速优雅流动 */
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize',resize);
    setTimeout(()=>{resize();draw()},50);
}

async function chatStream(text){
    const c=PRO.characters[chatCur]||{};
    const hist=(chatHist[chatCur]||[]).slice(-11,-1).map(m=>({role:m.role==='me'?'user':'assistant',content:String(m.text)}));
    const body={sessionId:'academy-'+(c.no||chatCur),turnId:'t'+Date.now().toString(36),
        persona:{name:account?.nickname||'访客学员',appearance:'',personality:'',background:''},
        opening:c.intro||c.quote||c.name||'',input:text,history:hist,memories:[],
        state:{player:{id:'player',name:account?.nickname||'访客学员',energy:80,focus:70,affinity:0,present:true},
               characters:[{id:String(c.no||'guide'),name:c.name||'引导员',energy:80,focus:70,affinity:0,present:true}]},
        profile:{id:'academy',name:'进入剧情',providerId:'academy-link',model:apiCfg.model||'',temperature:.7,maxTokens:1600},
        presets:[...(storyPreset?.prompt?['【预设:'+storyPreset.name+'】\n'+storyPreset.prompt]:[]),'以星际学院角色的口吻与玩家对话,保持角色性格与说话方式。']};
    const res=await fetch((apiCfg.base||'')+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json',...chatAuth()},body:JSON.stringify(body)});
    if(!res.ok||!res.body)throw new Error('HTTP '+res.status);
    const log=root.querySelector('#chatLogEl');
    const div=document.createElement('div');div.className='scx-msg';
    div.innerHTML='<span class="who">'+chatEsc(c.name||'CHANNEL')+'</span><span class="bubble"></span>';
    log.append(div);
    const bubble=div.querySelector('.bubble');
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='',full='',finished=false;
    while(true){
        const step=await reader.read();
        if(step.done)break;
        buf+=dec.decode(step.value,{stream:true}).replace(/\r\n/g,'\n');
        let i;
        while((i=buf.indexOf('\n\n'))>=0){
            const block=buf.slice(0,i);buf=buf.slice(i+2);
            const data=block.split('\n').filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trim()).join('');
            if(!data)continue;
            try{const ev=JSON.parse(data);
                if(ev.type==='delta'&&typeof ev.text==='string'){full+=ev.text;bubble.textContent=full;log.scrollTop=log.scrollHeight;}
                else if(ev.type==='done')finished=true;
            }catch(e){}
        }
    }
    if(!full)throw new Error('空回复');
    if(!finished)full+='\n(回复流中断,内容可能不完整)';
    const h=chatHist[chatCur]=chatHist[chatCur]||[];
    h.push({role:'bot',text:full,t:Date.now()});
    if(h.length>200)h.shift();
    chatSave();chatRenderLog();
}

let chronIO=null;
function chronReduce(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}}
function chronReveal(){
    const sc=root.querySelector('#chrScroll');if(!sc)return;
    const items=[...root.querySelectorAll('.chr-item')];
    if(chronReduce()||typeof IntersectionObserver==='undefined'){items.forEach(it=>it.classList.add('in'));sc.onscroll=()=>chronParallax();chronParallax();return}
    if(chronIO)chronIO.disconnect();
    chronIO=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');chronIO.unobserve(en.target)}})},{root:sc,threshold:.12});
    items.forEach((it,i)=>{it.classList.remove('in');it.style.transitionDelay=((i%3)*110)+'ms';chronIO.observe(it)});
    sc.onscroll=()=>chronParallax();
    chronParallax();
}
function chronParallax(){
    const sc=root.querySelector('#chrScroll');if(!sc)return;
    const vh=sc.clientHeight||800;
    root.querySelectorAll('.chr-item').forEach(it=>{
        const r=it.getBoundingClientRect();
        const p=(r.top+r.height/2-vh/2)/vh;
        const img=it.querySelector('.chr-img i');
        const card=it.querySelector('.chr-card');
        if(img)img.style.transform='translateY('+(p*-30).toFixed(1)+'px)';
        if(card)card.style.transform='translateY('+(p*8).toFixed(1)+'px)';
    });
}

<script>/* Mount the shared functional workspace directly inside the original academy. */
(() => {
  const root=document.getElementById('__exp_splash__');
  if(!root)return;
  const mount=document.createElement('div');mount.id='academy-workspace';mount.hidden=true;root.append(mount);
  let ready=false,pending=null;
  function transitionPage(element){if(!element||matchMedia('(prefers-reduced-motion: reduce)').matches)return;element.getAnimations().filter(a=>a.id==='academy-page').forEach(a=>a.cancel());const animation=element.animate([{opacity:.15,transform:'translateY(9px)'},{opacity:1,transform:'translateY(0)'}],{duration:340,easing:'cubic-bezier(.22,1,.36,1)'});animation.id='academy-page';}
  window.addEventListener('academy:page-transition',()=>transitionPage(mount.querySelector('.center-content')));
  new MutationObserver(records=>{for(const {target} of records)if(target.matches('#academy-workspace,.academy-hub,.academy-home,.academy-brightness-controls')&&!target.hidden&&target.getClientRects().length)transitionPage(target);}).observe(root,{subtree:true,attributes:true,attributeFilter:['hidden']});
  function open(detail){const wasHidden=mount.hidden;const hub=root.querySelector('.academy-hub');if(hub)hub.hidden=true;mount.hidden=false;pending=detail;if(ready){window.dispatchEvent(new CustomEvent('academy:navigate',{detail}));pending=null;if(detail.accepted===false){mount.hidden=wasHidden;window.PRO?.toast?.('\u8bf7\u5148\u505c\u6b62\u5f53\u524d\u751f\u6210\uff0c\u518d\u6253\u5f00\u65b0\u9875\u9762');return;}}}
  window.addEventListener('academy:ready',()=>{ready=true;if(pending)open(pending);});
  window.addEventListener('academy:home',()=>{mount.hidden=true;window.ACADEMY?.home();});
  window.addEventListener('academy:open',event=>open(event.detail));
  window.addEventListener('academy:encounter-new',event=>{const detail=event.detail;if(!detail)return;const access={ok:false};window.dispatchEvent(new CustomEvent('academy:campus-access',{detail:access}));if(!access.ok&&access.reason&&!access.reason.includes('建立')){showHint(access.reason);return;}open(detail);if(detail.accepted!==false)window.ACADEMY?.home();});
  const ids={chatEntry:{entry:'conversation'},apiSetupBtn:{panel:'settings'},presetImportBtn:{panel:'presets'},academySettings:{panel:'game-settings'},accountButton:{entry:'personas'}};
  const modules={new:{entry:'new'},continue:{entry:'continue'},chat:{entry:'conversation'},personas:{entry:'personas'},memory:{panel:'memory'},stu:{entry:'new'},full:{panel:'saves'},export:{panel:'saves'},settings:{panel:'settings'},presets:{panel:'presets'},theaters:{panel:'forum'},relations:{panel:'relations'},saves:{panel:'saves'}};
  const hint=document.createElement('div');hint.className='academy-campus-hint';hint.setAttribute('role','status');hint.hidden=true;root.append(hint);let hintTimer;
  function showHint(text){hint.textContent=text;hint.hidden=false;clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.hidden=true,4000);}
  window.academyDraft=(text,options={})=>{const detail={text,replace:options.replace,show:!options.stay,ok:false,reason:''};window.dispatchEvent(new CustomEvent('academy:insert',{detail}));if(!detail.ok){showHint(detail.reason||'请建立一个会话才可进入校园');return false;}if(detail.show){window.ACADEMY.home();mount.hidden=false;}return true;};
  window.academyShowConversation=()=>window.academyDraft('',{show:true});
  let openingMap=false,mapOrigin={workspace:false,hub:false};
  function openMap(){mapOrigin={workspace:!mount.hidden,hub:!root.querySelector('.academy-hub').hidden};mount.hidden=true;window.ACADEMY.home();window.academyMapPreview=true;openingMap=true;try{root.querySelector('.spl-menu [data-sact="map"]').click();}finally{openingMap=false;}}
  window.addEventListener('academy:map',openMap);
  document.addEventListener('click',event=>{
    const target=event.target instanceof Element?event.target.closest('button'):null;
    if(!target||mount.contains(target))return;
    if(target.dataset.sact==='map-back'){event.preventDefault();event.stopImmediatePropagation();window.ACADEMY.home();if(mapOrigin.workspace)mount.hidden=false;else if(mapOrigin.hub)window.ACADEMY.openHub();return;}
    if(!openingMap&&(target.dataset.sact==='map'||target.dataset.module==='map')){
      event.preventDefault();event.stopImmediatePropagation();openMap();return;
    }
    const detail=(target.matches('.ah-feature,.spl-x')?{entry:'conversation'}:null)||ids[target.id]||modules[target.dataset.module]||modules[target.dataset.sact];
    if(!detail)return;
    event.preventDefault();event.stopImmediatePropagation();
    open(detail);
  },true);
})();
</script>

  modules.forEach(([action,en,label,description],index)=>{const button=document.createElement('button');button.dataset.module=action;const no=document.createElement('small');no.textContent=String(index+1).padStart(2,'0');const title=document.createElement('span');title.textContent=en;const name=document.createElement('b');name.textContent=label;const note=document.createElement('p');note.textContent=description;button.append(no,title,name,note);if(action==='chars'||action==='map')button.onclick=()=>{hub.hidden=true;root.querySelector('.spl-menu [data-sact="'+action+'"]').click();};if(action==='chronicle')button.onclick=()=>{hub.hidden=true;q('#chronicleEntry').click();};grid.append(button);});

  q('.spl-revpage').querySelectorAll('button').forEach(button=>{if(button.textContent.includes('\u751f\u6210\u4e8b\u4ef6'))button.remove();});

  const editCards=document.createElement('button');editCards.textContent='\u7f16\u8f91\u89d2\u8272';editCards.onclick=()=>window.open('http://127.0.0.1:8808/','_blank','noopener');q('.academy-card-tools').append(editCards);

  if(sessionStorage.getItem('academy:reopen-characters')){sessionStorage.removeItem('academy:reopen-characters');setTimeout(()=>{window.ACADEMY.directEnter();root.querySelector('.spl-menu [data-sact="chars"]').click();},0);}

(() => {
  const root=document.getElementById('__exp_splash__'),home=root?.querySelector('.academy-home');if(!home)return;
  const image=root.querySelector('#portraitImg');
  const layer=document.createElement('div');layer.className='portrait-backdrop';layer.setAttribute('aria-label','首页底图');
  const frame=document.createElement('div');frame.className='portrait-frame';frame.tabIndex=0;frame.setAttribute('aria-label','拖动底图移动；拖动四角缩放');
  image.draggable=false;frame.append(image);layer.append(frame);home.append(layer);
  for(const corner of ['nw','ne','sw','se']){const handle=document.createElement('button');handle.type='button';handle.className='portrait-corner '+corner;handle.dataset.corner=corner;handle.setAttribute('aria-label','缩放底图 '+corner);frame.append(handle);}
  const bar=document.createElement('div');bar.className='portrait-editor-bar';bar.hidden=true;
  bar.innerHTML='<span>拖动图片移动 · 拖动四角等比缩放</span><button type="button" data-edit="import">更换底图</button><button type="button" data-edit="reset">重置</button><button type="button" data-edit="cancel">取消</button><button type="button" data-edit="save">保存位置</button><small role="status"></small>';
  home.append(bar);const status=bar.querySelector('small');
  const cardControls=document.createElement('div');cardControls.className='card-appearance-controls';
  cardControls.innerHTML='<label>卡片底色透明度 <input type="range" data-card-control="alpha" min="0" max="100" value="100" aria-label="卡片底色不透明度"><output data-card-value="alpha">100%</output></label><label>卡片倾斜度 <input type="range" data-card-control="tilt" min="-25" max="25" value="-14" aria-label="卡片倾斜度"><output data-card-value="tilt">-14°</output></label>';
  bar.querySelector('span').after(cardControls);
  let cards={alpha:100,tilt:-14},originalCards={...cards},hadCardSettings=false;
  try{const stored=JSON.parse(localStorage.getItem('academy:card-appearance'));if(stored&&Number.isFinite(stored.alpha)&&Number.isFinite(stored.tilt)){cards={alpha:Math.max(0,Math.min(100,stored.alpha)),tilt:Math.max(-25,Math.min(25,stored.tilt))};hadCardSettings=true;}}catch{}
  function renderCards(custom=true){home.toggleAttribute('data-card-custom',custom);home.style.setProperty('--card-alpha',String(cards.alpha/100));home.style.setProperty('--card-tilt',cards.tilt+'deg');for(const key of ['alpha','tilt']){cardControls.querySelector('[data-card-control='+key+']').value=String(cards[key]);cardControls.querySelector('[data-card-value='+key+']').textContent=cards[key]+(key==='alpha'?'%':'°');}}
  renderCards(hadCardSettings);
  cardControls.addEventListener('input',event=>{const key=event.target.dataset.cardControl;if(key==='alpha'||key==='tilt'){cards[key]=Number(event.target.value);renderCards();}});
  const defaults={version:1,x:.1,y:0,width:.65};let layout={...defaults},original,editing=false,gesture;
  try{const saved=JSON.parse(localStorage.getItem('academy:portrait-layout'));if(saved?.version===1&&['x','y','width'].every(k=>Number.isFinite(saved[k]))&&saved.width>=.08&&saved.width<=3)layout=saved;}catch{}
  function render(){frame.style.left=layout.x*100+'%';frame.style.top=layout.y*100+'%';frame.style.width=layout.width*100+'%';}
  function stopEdit(){editing=false;gesture=null;home.classList.remove('portrait-editing');bar.hidden=true;}
  function beginEdit(){window.dispatchEvent(new Event('academy:home'));root.querySelector('.academy-hub').hidden=true;original={...layout};originalCards={...cards};hadCardSettings=home.hasAttribute('data-card-custom');editing=true;home.classList.add('portrait-editing');bar.hidden=false;status.textContent=image.hidden?'可调整右侧卡片；导入底图后也可拖动位置。':'';frame.focus();}
  bar.addEventListener('click',event=>{const action=event.target.closest('[data-edit]')?.dataset.edit;if(action==='import')root.querySelector('#portraitFile').click();if(action==='reset'){layout={...defaults};cards={alpha:100,tilt:-14};renderCards(false);render();}if(action==='cancel'){layout={...original};cards={...originalCards};renderCards(hadCardSettings);render();stopEdit();}if(action==='save'){try{localStorage.setItem('academy:portrait-layout',JSON.stringify(layout));localStorage.setItem('academy:card-appearance',JSON.stringify(cards));stopEdit();}catch{status.textContent='设置保存失败，请重试。';}}});
  image.addEventListener('load',()=>{render();status.textContent='';});
  frame.addEventListener('pointerdown',event=>{if(!editing||image.hidden||event.button!==0)return;event.preventDefault();const r=home.getBoundingClientRect(),box=frame.getBoundingClientRect();gesture={id:event.pointerId,startX:event.clientX,startY:event.clientY,x:box.left-r.left,y:box.top-r.top,width:box.width,height:box.height,screenW:r.width,screenH:r.height,corner:event.target.closest('[data-corner]')?.dataset.corner};frame.setPointerCapture(event.pointerId);});
  frame.addEventListener('pointermove',event=>{if(!gesture||event.pointerId!==gesture.id)return;const g=gesture,dx=event.clientX-g.startX,dy=event.clientY-g.startY;let x=g.x,y=g.y,width=g.width;
    if(g.corner){const sx=g.corner.includes('e')?1:-1,sy=g.corner.includes('s')?1:-1,ratio=g.width/g.height;const delta=(sx*dx+sy*dy/ratio)/(1+1/(ratio*ratio));width=Math.max(g.screenW*.08,Math.min(g.screenW*3,g.width+delta));if(sx<0)x+=g.width-width;if(sy<0)y+=(g.width-width)/ratio;}
    else{x+=dx;y+=dy;}
    layout={version:1,x:Math.max(-width+24,Math.min(g.screenW-24,x))/g.screenW,y:Math.max(-(width*g.height/g.width)+24,Math.min(g.screenH-24,y))/g.screenH,width:width/g.screenW};render();
  });
  for(const name of ['pointerup','pointercancel','lostpointercapture'])frame.addEventListener(name,()=>{gesture=null;});
  document.addEventListener('keydown',event=>{if(!editing)return;if(event.key==='Escape'){event.preventDefault();event.stopImmediatePropagation();layout={...original};cards={...originalCards};renderCards(hadCardSettings);render();stopEdit();}else if(event.target===frame&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();const amount=event.shiftKey?.02:.005;layout.x+=event.key==='ArrowLeft'?-amount:event.key==='ArrowRight'?amount:0;layout.y+=event.key==='ArrowUp'?-amount:event.key==='ArrowDown'?amount:0;render();}},true);
  const button=document.createElement('button');button.dataset.module='portrait';button.innerHTML='<small>10</small><span>ILLUSTRATION</span><b>调整立绘大小</b><p>拖动底图移动，拖动四角等比缩放</p>';button.onclick=beginEdit;root.querySelector('.hub-grid').append(button);
  root.querySelector('.ah-tools [data-module=portrait]').onclick=beginEdit;
  render();
})();

(() => {
  const root=document.getElementById('__exp_splash__'),nav=root?.querySelector('.ah-tools');
  if(!root||!nav)return;
  const button=document.createElement('button');button.className='ah-tool';button.dataset.module='brightness';button.innerHTML='<i>09</i><span>调整亮度</span>';button.setAttribute('aria-expanded','false');
  const panel=document.createElement('div');panel.className='academy-brightness-controls';panel.hidden=true;panel.innerHTML='<label>页面亮度<input type="range" min="0" max="100" step="1" aria-label="页面亮度"><output>100%</output></label><small>背景渐暗，文字柔和提亮</small>';
  nav.append(button);root.append(panel);
  function show(anchor=button){const opening=panel.hidden;panel.hidden=!opening;button.setAttribute('aria-expanded',String(opening));if(opening){const r=anchor.getBoundingClientRect();panel.style.left=Math.max(12,Math.min(innerWidth-300,r.left))+'px';panel.style.top=Math.max(12,Math.min(innerHeight-170,r.bottom+8))+'px';}}
  button.onclick=()=>show();
  const hubButton=document.createElement('button');hubButton.dataset.module='brightness';hubButton.innerHTML='<small>14</small><span>BRIGHTNESS</span><b>调整亮度</b><p>背景渐暗，文字柔和提亮</p>';hubButton.onclick=()=>show(hubButton);root.querySelector('.hub-grid').append(hubButton);
  document.addEventListener('click',e=>{if(!panel.hidden&&!panel.contains(e.target)&&!e.target.closest('[data-module="brightness"]')){panel.hidden=true;button.setAttribute('aria-expanded','false');}},true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){panel.hidden=true;button.setAttribute('aria-expanded','false');}});
  const slider=panel.querySelector('input'),output=panel.querySelector('output');
  const mix=(a,b,t)=>'#'+[0,2,4].map(i=>Math.round(parseInt(a.slice(i,i+2),16)*(1-t)+parseInt(b.slice(i,i+2),16)*t).toString(16).padStart(2,'0')).join('');
  function apply(value){const t=(100-value)/100,colors={bg:mix('f7f1e8','20232a',t),panel:mix('fffaf3','282b32',t),soft:mix('ede9e2','30343c',t),text:mix('20242a','c9cbd1',t),muted:mix('797e85','a3aab5',t),line:mix('d4d1ca','484e58',t),acc:mix('7895b9','9aafc8',t)};
    if(t>0){const level=parseInt(colors.bg.slice(1,3),16)*.2126+parseInt(colors.bg.slice(3,5),16)*.7152+parseInt(colors.bg.slice(5,7),16)*.0722;colors.text=level<128?mix('d8dde5','c9cbd1',t):'#20242a';colors.muted=level<128?'#afb8c5':mix('797e85','454d58',t);}
    for(const [key,color] of Object.entries(colors)){root.style.setProperty('--s-'+key,color,'important');document.body.style.setProperty('--a-'+({panel:'bg',acc:'acc'}[key]||key),color);}
    for(const host of [root.querySelector('#academy-workspace'),document.documentElement].filter(Boolean)){for(const [key,color] of Object.entries({'background':colors.bg,'surface':colors.panel,'surface-soft':colors.soft,'text':colors.text,'muted':colors.muted,'border':colors.line,'accent':colors.acc}))host.style.setProperty('--color-'+key,color);host.style.backgroundColor=colors.bg;host.style.color=colors.text;}
    root.style.setProperty('--reading-image-brightness',String(1-t*.2));root.dataset.brightness=String(value);output.textContent=value+'%';
  }
  let initial=100;try{const saved=localStorage.getItem('academy:brightness');if(saved!==null&&Number.isFinite(Number(saved)))initial=Math.max(0,Math.min(100,Number(saved)));}catch{}
  slider.value=String(initial);if(initial!==100)apply(initial);
  slider.oninput=()=>{const value=Number(slider.value);apply(value);try{localStorage.setItem('academy:brightness',String(value));}catch{}};
  window.addEventListener('academy-theme',()=>apply(Number(slider.value)));
})();
</script>
