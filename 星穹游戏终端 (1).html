        } catch (e) { return cloneJSON(MEM_DEFAULTS); }
    }
    function setMemCfg(c) { try { GM_setValue('memCfg:v1', cloneJSON(c)); } catch (e) {} return c; }

    /* ---------- IndexedDB ---------- */
    let memDb = null, memDbErr = null;
    function dbOpen() {
        if (memDb) return Promise.resolve(memDb);
        if (memDbErr) return Promise.reject(memDbErr);
        return new Promise((res, rej) => {
            let rq;
            try {
                if (typeof indexedDB === 'undefined') throw new Error('这个浏览器没有 IndexedDB');
                rq = indexedDB.open(MEM_DB, 2);
            } catch (e) { memDbErr = e; rej(e); return; }
            rq.onupgradeneeded = () => {
                const d = rq.result;
                const mk = (name, keyPath, idxs) => {
                    if (d.objectStoreNames.contains(name)) return;
                    const s = d.createObjectStore(name, { keyPath: keyPath });
                    (idxs || []).forEach(i => { try { s.createIndex(i, i); } catch (e) {} });
                };
                mk('messages', 'id', ['conversationKey']);
                mk('batches', 'id', ['conversationKey', 'status']);
                mk('memories', 'id', ['conversationKey', 'status']);
                mk('vectors', 'id', ['conversationKey']);
                mk('conv', 'conversationKey');
                mk('meta', 'k');
                mk('sets', 'id');          // v4.5:记忆集(用户自己挑召回、新记忆往里累加)
            };
            rq.onsuccess = () => { memDb = rq.result; res(memDb); };
            rq.onerror = () => { memDbErr = rq.error || new Error('IndexedDB 打开失败'); rej(memDbErr); };
        });
    }
    function dbStore(name, mode) {
        return dbOpen().then(d => d.transaction(name, mode).objectStore(name));
    }
    function dbPut(name, val) {
        return dbStore(name, 'readwrite').then(st => new Promise((res, rej) => {
            const r = st.put(val); r.onsuccess = () => res(val); r.onerror = () => rej(r.error);
        }));
    }
    function dbGet(name, key) {
        return dbStore(name, 'readonly').then(st => new Promise((res, rej) => {
            const r = st.get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error);
        }));
    }
    function dbAll(name, idx, range) {
        return dbStore(name, 'readonly').then(st => new Promise((res, rej) => {
            const src = (idx && st.indexNames.contains(idx)) ? st.index(idx) : st;
            const r = (range == null) ? src.getAll() : src.getAll(range);
            r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
        }));
    }
    function dbDel(name, key) {
        return dbStore(name, 'readwrite').then(st => new Promise((res, rej) => {
            const r = st.delete(key); r.onsuccess = () => res(true); r.onerror = () => rej(r.error);
        }));
    }
    const memUnavailable = e => '本地记忆库不可用:' + ((e && e.message) || e);

    /* ---------- 会话隔离 ---------- */
    function convKeyNow() { return 'chat.qqy.ai:conversation:' + conversationId(); }
    let convState = null;
    function newConvState() {
        return { conversationKey: convKeyNow(), lastBatchedUid: 0, pendingMessageCount: 0, activeBatchId: null, lastBatchAt: 0 };
    }
    function loadConvState() {
        const k = convKeyNow();
        if (convState && convState.conversationKey === k) return Promise.resolve(convState);
        return dbGet('conv', k).then(s => {
            convState = (s && s.conversationKey === k) ? s : newConvState();
            return convState;
        }).catch(() => (convState = newConvState()));
    }
    function saveConvState() { return convState ? dbPut('conv', convState) : Promise.resolve(); }

    /* ---------- 记忆集(v4.5):记忆不再死绑一个聊天会话,而是拆成无数个"新会话" ----------
       · 每个记忆集 = 一条独立的故事线/存档,想建多少建多少;
       · 聊天时自己选一个激活,新整理出的记忆就累加进它;
       · 要用的时候自己勾选想召回的记忆,一键复制走。 */
    function ensureDefaultSet() {
        return dbAll('sets').then(sets => {
            const cfg = getMemCfg();
            if (sets.length) {
                if (cfg.activeSetId && sets.some(s => s.id === cfg.activeSetId)) return cfg.activeSetId;
                setMemCfg(Object.assign(cfg, { activeSetId: sets[0].id }));
                return sets[0].id;
            }
            const s = { id: newId('set'), name: '记忆集 1', note: '', createdAt: Date.now() };
            return dbPut('sets', s).then(() => saveVarTable(s.id, defaultVarTable())).then(() => dbAll('memories')).then(ms => {
                const old = ms.filter(m => !m.setId);        // 老记忆划进第一个集,不丢
                return Promise.all(old.map(m => dbPut('memories', Object.assign(m, { setId: s.id }))))
                    .then(() => {
                        const c2 = getMemCfg();
                        setMemCfg(Object.assign(c2, { activeSetId: s.id }));
                        return s.id;
                    });
            });
        });
    }
    const MEM_VAR_DEFAULTS = {
        '天数': { value: '', note: '故事经过的天数', check: '仅根据明确材料更新', readonly: false, builtin: true },
        '时间': { value: '', note: '当前时间或时段', check: '没有明确变化则保留', readonly: false, builtin: true },
        '地点': { value: '', note: '当前主要地点', check: '只记录材料明确地点', readonly: false, builtin: true },
        '人物': { value: [], note: '当前涉及人物', check: '数组，避免重复', readonly: false, builtin: true },
        '重要事件': { value: [], note: '已发生的重要事件', check: '数组，按发生顺序记录', readonly: false, builtin: true },
    };
    function normalizeVarField(name, field) {
        field = field && typeof field === 'object' && !Array.isArray(field) ? field : { value: field };
        return {
            value: Object.prototype.hasOwnProperty.call(field, 'value') ? cloneJSON(field.value) : '',
            note: String(field.note || ''), check: String(field.check || ''),
            readonly: name.charAt(0) === '_' || field.readonly === true,
            builtin: field.builtin === true || Object.prototype.hasOwnProperty.call(MEM_VAR_DEFAULTS, name),
            lock: field.lock === true,     // 用户定死不变的设定(比如衣服):AI 任何补丁都改不了它
            history: Array.isArray(field.history) ? field.history.slice(-20).map(x => String(x)) : [],
        };
    }
    function defaultVarTable() {
        const out = {};
        Object.keys(MEM_VAR_DEFAULTS).forEach(k => { out[k] = normalizeVarField(k, MEM_VAR_DEFAULTS[k]); });
        return out;
    }
    function normalizeVarTable(table) {
        const out = defaultVarTable();
        Object.keys(table || {}).forEach(k => { if (k) out[k] = normalizeVarField(k, table[k]); });
        return out;
    }
    function getVarTable(setId) {
        return dbGet('meta', 'vars:' + setId).then(row => normalizeVarTable(row && row.value));
    }
    function saveVarTable(setId, table) {
        const value = normalizeVarTable(table);
        return dbPut('meta', { k: 'vars:' + setId, value: value, updatedAt: Date.now() }).then(() => value);
    }
    function compactVarValues(table) {
        const out = {};
        Object.keys(table || {}).forEach(k => { out[k] = table[k] && Object.prototype.hasOwnProperty.call(table[k], 'value') ? table[k].value : ''; });
        return out;
    }
    function pointerParts(path) {
        if (typeof path !== 'string' || path.charAt(0) !== '/') throw new Error('JSON Pointer 必须以 / 开头');
        const parts = path.slice(1).split('/').map(s => s.replace(/~1/g, '/').replace(/~0/g, '~'));
        parts.forEach(p => {
            if (p === '__proto__' || p === 'prototype' || p === 'constructor') throw new Error('拒绝危险路径:' + p);
            if (p.charAt(0) === '_') throw new Error('拒绝修改只读字段:' + p);
        });
        return parts;
    }
    function patchParent(root, path, create) {
        const parts = pointerParts(path), key = parts.pop();
        let cur = root;
        parts.forEach(p => {
            if (cur == null || typeof cur !== 'object') throw new Error('路径不存在:' + path);
            if (!Object.prototype.hasOwnProperty.call(cur, p)) {
                if (!create) throw new Error('路径不存在:' + path);
                cur[p] = {};
            }
            cur = cur[p];
        });
        return { parent: cur, key: key };
    }
    function varValText(v) {
        if (Array.isArray(v)) return v.length ? v.map(x => String(x)).join('、') : '(空)';
        if (v == null || v === '') return '(空)';
        return String(v);
    }
    function applyVariablePatch(table, operations) {
        const out = normalizeVarTable(table);
        const readAt = path => {
            let cur = out;
            pointerParts(path).forEach(p => { if (cur == null || !Object.prototype.hasOwnProperty.call(cur, p)) throw new Error('路径不存在:' + path); cur = cur[p]; });
            return cloneJSON(cur);
        };
        (operations || []).forEach(op0 => {
            const op = op0 || {}, kind = String(op.op || op.operation || op.action || '').toLowerCase();
            if (['replace', 'delta', 'insert', 'remove', 'move'].indexOf(kind) < 0) return;
            const target = patchParent(out, op.path || op.to, kind === 'insert');
            const fieldName = pointerParts(op.path || op.to)[0] || '';
            if (fieldName.charAt(0) === '_' || (out[fieldName] && out[fieldName].readonly)) throw new Error('拒绝修改只读字段:' + fieldName);
            if (out[fieldName] && out[fieldName].lock && target.parent === out[fieldName]) throw new Error('字段已锁定(固定不变),AI 不能修改:' + fieldName);
            if (kind === 'replace') {
                if (!Object.prototype.hasOwnProperty.call(target.parent, target.key)) throw new Error('replace 路径不存在');
                const oldV = target.parent[target.key];
                target.parent[target.key] = cloneJSON(op.value);
                // 追踪类字段值被 AI 改动时,自动记一笔变化历史(锁定字段根本进不来这里)
                const fObj = out[fieldName];
                if (fObj && !fObj.lock && target.parent === fObj && target.key === 'value') {
                    const oldT = varValText(oldV), newT = varValText(fObj.value);
                    if (oldT !== newT && oldT !== '(空)') {
                        const dayV = out['天数'] && out['天数'].value;
                        fObj.history.push((dayV !== '' && dayV != null ? dayV + ':' : '') + oldT + ' → ' + newT);
                        if (fObj.history.length > 20) fObj.history = fObj.history.slice(-20);
                    }
                }
            } else if (kind === 'delta') {
                const old = target.parent[target.key], d = op.value == null ? op.delta : op.value;
                if (typeof old !== 'number' || typeof d !== 'number' || !isFinite(old) || !isFinite(d)) throw new Error('delta 仅允许有限数值');
                target.parent[target.key] = old + d;
            } else if (kind === 'insert') {
                if (Array.isArray(target.parent)) {
                    if (target.key === '-') target.parent.push(cloneJSON(op.value));
                    else { const n = Number(target.key); if (!Number.isInteger(n) || n < 0 || n > target.parent.length) throw new Error('insert 数组索引无效'); target.parent.splice(n, 0, cloneJSON(op.value)); }
                } else if (target.key === '-' && target.parent && Array.isArray(target.parent.value)) {
                    // 容错:AI 写成 /字段/- 时,落到字段的 value 数组里(标准写法是 /字段/value/-)
                    target.parent.value.push(cloneJSON(op.value));
                } else target.parent[target.key] = cloneJSON(op.value);
            } else if (kind === 'remove') {
                if (Array.isArray(target.parent)) { const n = Number(target.key); if (!Number.isInteger(n) || n < 0 || n >= target.parent.length) throw new Error('remove 数组索引无效'); target.parent.splice(n, 1); }
                else { if (!Object.prototype.hasOwnProperty.call(target.parent, target.key)) throw new Error('remove 路径不存在'); delete target.parent[target.key]; }
            } else if (kind === 'move') {
                pointerParts(op.from || '');
                const fromField = pointerParts(op.from)[0] || '';
                if (fromField.charAt(0) === '_' || (out[fromField] && out[fromField].readonly)) throw new Error('拒绝移动只读字段:' + fromField);
                if (out[fromField] && out[fromField].lock) throw new Error('字段已锁定(固定不变),AI 不能移动:' + fromField);
                const value = readAt(op.from), src = patchParent(out, op.from, false);
                if (Array.isArray(src.parent)) src.parent.splice(Number(src.key), 1); else delete src.parent[src.key];
                if (Array.isArray(target.parent)) target.key === '-' ? target.parent.push(value) : target.parent.splice(Number(target.key), 0, value);
                else target.parent[target.key] = value;
            }
        });
        return normalizeVarTable(out);
    }
    const memPick = new Set();          // 勾选了要召回的记忆 id
    const memBatchPick = new Set();     // 勾选了要删除的批次 id
    let memVarsCache = {};              // 当前记忆集变量表的渲染缓存
    let memVarsSetId = '';              // 缓存对应的记忆集 id

    /* ---------- 消息"已确认 / 已稳定" ---------- */
    const memStable = new Map();
    function updateStable() {
        const now = Date.now();
        for (const m of store.merged) {
            const s = memStable.get(m.uid);
            if (!s || s.text !== m.text) memStable.set(m.uid, { text: m.text, at: now });
        }
        return now;
    }
    function isStable(uid) {
        const s = memStable.get(uid);
        return !!s && (Date.now() - s.at) >= MEM_STABLE_MS;
    }
    // 参与计数的候选:本会话 + 已确认 + 非开场卡 + 已停止流式 + 还没进过已完成批次
    function eligibleMsgs() {
        const cfg = getMemCfg();
        const base = convState ? convState.lastBatchedUid : 0;
        return store.merged.filter(m => {
            if (m.intro) return false;
            if (!isFinite(m.uid) || m.uid <= base) return false;
            if (cfg.onlyConfirmed !== false && !isStable(m.uid)) return false;
            return true;
        });
    }
    function splitRounds(msgs) {
        const rounds = [];
        for (const m of msgs) {
            if (m.role === 'user' || !rounds.length) rounds.push([m]);
            else rounds[rounds.length - 1].push(m);
        }
        return rounds;
    }
    function unitsOf(msgs, trigger) {
        return trigger === 'rounds' ? splitRounds(msgs).length : msgs.length;
    }
    function takeBatch(msgs, cfg) {
        if (cfg.trigger === 'rounds') {
            const rs = splitRounds(msgs), out = [];
            for (let i = 0; i < Math.min(cfg.triggerCount, rs.length); i++) out.push.apply(out, rs[i]);
            return out;
        }
        return msgs.slice(0, cfg.triggerCount);
    }

    /* ---------- 批次 ---------- */
    function newId(p) { return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function createBatch(msgs, cfg) {
        const b = {
            id: newId('batch'),
            conversationKey: convKeyNow(),
            triggerType: cfg.trigger,
            triggerCount: cfg.triggerCount,
            messageUids: msgs.map(m => m.uid),
            status: 'pending',
            provider: null,
            createdAt: Date.now(),
            sentAt: null, receivedAt: null, completedAt: null,
            result: null, error: null, raw: null,
            messages: msgs.map(m => ({ uid: m.uid, role: m.role, text: m.text })),
        };
        return dbPut('batches', b).then(() => {
            if (convState) { convState.activeBatchId = b.id; convState.pendingMessageCount = msgs.length; return saveConvState(); }
        }).then(() => b);
    }
    function setBatchStatus(b, status, extra) {
        b.status = status;
        if (extra) Object.assign(b, extra);
        return dbPut('batches', b).then(() => b);
    }
    function memManualTrigger() {
        if (MEM_WIP) { memToast('记忆库还在完善中(v0.6),整理暂时停用'); return Promise.resolve('整理暂停'); }
        const cfg = getMemCfg();
        return loadConvState().then(() => {
            const msgs = store.merged.filter(m => !m.intro && isFinite(m.uid) && m.uid > convState.lastBatchedUid);
            if (!msgs.length) return '没有还没整理的消息';
            return createBatch(takeBatch(msgs, cfg), cfg).then(b => {
                b.manualRun = true;
                if (typeof openMemConsole === 'function') openMemConsole('batches');
                // 用户点了「现在整理」= 真正整理:建完批次马上跑,不等阈值、不留在 pending
                runBatch(b).then(r => {
                    if (!r || !r.ok) memToast('整理失败:' + ((r && r.err) || '未知原因'));
                    return null;
                }).catch(() => {});
                return '正在整理(共 ' + b.messageUids.length + ' 条消息)…';
            });
        });
    }
    let memBusy = false;
    let memRunNote = '';        // 非空 = 有一批正在真正整理(采集页状态行会显示)

    /* ---- 全部采集(v4.8.0):上滚采完 → 用户确认 → 回底 → 全部消息一次性整理(记忆只增不改) ---- */
    async function fullScanOrganize(btn, statusEl, renderFn) {
        if (MEM_WIP) { memToast('记忆库还在完善中(v0.6),采集整理暂时停用'); return; }
        const c = getMemCfg();
        if (!c.enabled) { memToast('先用管理台→设置把记忆库总开关打开'); return; }
        if (!c.api.baseUrl || !c.api.model) { memToast('先在管理台→设置里填好自接 API 和模型'); return; }
        if (memBusy) { memToast('上一批还在整理,等它跑完'); return; }
        const countAll = () => store.merged.filter(m => !m.intro && isFinite(m.uid)).length;
        try {
            btn.textContent = '上滚中…';
            await autoScrollToTop(statusEl, renderFn, btn, getSecs());
            while (true) {
                const p = await memModal({
                    title: '采集完毕了吗?',
                    note: '已采集 ' + countAll() + ' 条消息。确认后自动回到底部,并把这些消息全部发给 AI 整理记忆(只新增,不动已有记忆)。',
                    buttons: [
                        { key: 'done', label: '采集完毕,回底并整理', primary: true },
                        { key: 'more', label: '继续上滚' },
                        { key: 'cancel', label: '取消' },
                    ],
                });
                if (!p || p.key === 'cancel') return;
                if (p.key === 'more') { btn.textContent = '上滚中…'; await autoScrollToTop(statusEl, renderFn, btn, getSecs()); continue; }
                break;
            }
            btn.textContent = '回底中…';
            await autoScrollToBottom(statusEl);
            renderFn();
            const msgs = store.merged.filter(m => !m.intro && isFinite(m.uid));
            if (!msgs.length) { memToast('没有采到可整理的消息'); return; }
            const batch = await createBatch(msgs, Object.assign(getMemCfg(), { trigger: 'all', triggerCount: msgs.length }));
            batch.manualRun = true;
            if (typeof openMemConsole === 'function') openMemConsole('batches');
            memToast('开始整理全部 ' + msgs.length + ' 条消息…');
            runBatch(batch).then(r => {
                if (!r || !r.ok) memToast('整理失败:' + ((r && r.err) || '未知原因'));
            }).catch(() => {});
        } finally {
            btn.textContent = '全部采集+整理';
        }
    }

    /* ---- 限流(写死,不给 UI 改):两次整理之间至少 5 分钟,60 秒窗口内最多 3 次 ----
       目的是别一直弹"要不要整理"。冷却对「弹询问卡」同样生效:
       不管你是点了整理、还是点了暂不处理,5 分钟之内都不再来打扰。 */
    const MEM_COOLDOWN_MS = 5 * 60 * 1000;
    const MEM_RATE_WINDOW_MS = 60 * 1000;
    const MEM_RATE_MAX = 3;
    let memReqAt = [];
    try { memReqAt = GM_getValue('memReqAt:v1', []) || []; } catch (e) { memReqAt = []; }
    function memMarkReq() {
        memReqAt.push(Date.now());
        if (memReqAt.length > 30) memReqAt = memReqAt.slice(-30);
        try { GM_setValue('memReqAt:v1', memReqAt); } catch (e) {}
    }
    function memRateLeft() {                       // 距离下次可以整理还剩多少 ms
        const now = Date.now();
        if (!memReqAt.length) return 0;
        const last = memReqAt[memReqAt.length - 1];
        return Math.max(0, MEM_COOLDOWN_MS - (now - last));
    }
    function memRateOk() {
        const now = Date.now();
        let recent = 0;
        for (let i = memReqAt.length - 1; i >= 0; i--) {
            if (now - memReqAt[i] < MEM_RATE_WINDOW_MS) recent++; else break;
        }
        if (recent >= MEM_RATE_MAX) return false;
        return memRateLeft() === 0;
    }
    function memRateNote() {
        const left = memRateLeft();
        return left ? '限流中:' + Math.ceil(left / 1000) + ' 秒后可再整理(固定 5 分钟 / 3rpm)' : '';
    }

    let memAsking = false;                          // 询问卡正挂着,不要再建新批次
    function memHasCard() { return !!document.getElementById('__exp_memask__'); }

    // 全自动模式的失败保护:连续失败 3 次就自动暂停 30 分钟,免得无限重试刷屏
    let memFailStreak = 0;
    let memAutoPauseUntil = 0;

    function memTick() {
        if (!isQQY || MEM_WIP) return Promise.resolve(); // v4.9.0:完善中,自动采集/整理停摆
        const cfg = getMemCfg();
        if (!cfg.enabled || memBusy || memAsking) return Promise.resolve();
        if (Date.now() < memAutoPauseUntil) return Promise.resolve();
        if (memHasCard()) return Promise.resolve();     // 上一张卡片还没人处理
        if (!memRateOk()) return Promise.resolve();     // 冷却 / 频次没到
        try { captureNow(); } catch (e) {}   // 记忆循环自己也要看最新消息,不能只等别人采集
        updateStable();
        return loadConvState().then(() => {
            if (cfg.trigger === 'manual') return;
            const msgs = eligibleMsgs();
            if (unitsOf(msgs, cfg.trigger) < cfg.triggerCount) return;

                    '<h2 style="font:400 18px/1.3 var(--rpg-font);letter-spacing:2px;margin-bottom:10px">' +
                        escHtml(opts.title || '') + '</h2>' +
                    (opts.note ? '<p class="rpg-ask-note">' + escHtml(opts.note).replace(/\n/g, '<br>') + '</p>' : '') +
                    (opts.input ? '<input id="__memmodal_input__" type="text" value="' + escHtml(opts.value || '') +
                        '" placeholder="' + escHtml(opts.placeholder || '') + '" style="width:100%;box-sizing:border-box;' +
                        'padding:9px 10px;font:400 13px/1.4 var(--rpg-font);color:var(--rpg-text);' +
                        'background:rgba(var(--rpg-accent-rgb),.05);border:1px solid var(--rpg-border);' +
                        'border-radius:var(--rpg-radius-small);outline:none;margin-bottom:6px">' : '') +
                    '<div style="font:400 12px/1.7 var(--rpg-sans);color:var(--rpg-text)">' + (opts.bodyHtml || '') + '</div>' +
                    '<div class="rpg-ask-btns" style="margin-top:14px">' + btns + '</div>' +
                '</div>';
            const close = v => {
                if (ov.isConnected) ov.remove();
                document.removeEventListener('keydown', esc, true);
                res(v);
            };
            const readInput = () => {
                if (!opts.input) return '';
                const ip = ov.querySelector('#__memmodal_input__');
                return ip ? ip.value : '';
            };
            function esc(ev) {
                if (ev.key === 'Escape') close({ key: null, picked: [], text: '' });
            }
            ov.addEventListener('click', e => {
                const b = e.target.closest ? e.target.closest('[data-mkey]') : null;
                if (b) {
                    const picked = [];
                    ov.querySelectorAll('input[data-op]').forEach(i => { if (i.checked) picked.push(parseInt(i.dataset.op, 10)); });
                    close({ key: b.dataset.mkey, picked: picked, text: readInput() });
                } else if (e.target === ov && opts.dismiss !== false) close({ key: null, picked: [], text: '' });
            });
            document.addEventListener('keydown', esc, true);
            document.body.appendChild(ov);
            if (typeof opts.onReady === 'function') { try { opts.onReady(ov, close); } catch (e) {} }
            if (opts.input) {
                const ip = ov.querySelector('#__memmodal_input__');
                if (ip) {
                    setTimeout(() => { try { ip.focus(); ip.select(); } catch (e) {} }, 50);
                    ip.addEventListener('keydown', ev => {
                        if (ev.key === 'Enter') {
                            ev.stopPropagation();
                            const pri = (opts.buttons || []).find(b => b.primary) || (opts.buttons || [])[0] || {};
                            close({ key: pri.key || 'ok', picked: [], text: ip.value });
                        }
                    });
                }
            }
        });
    }

    /* ---------- 发送前预览 / 结果审核 ---------- */

    function reviewBody(ops) {

                        '<div style="font-size:14px;margin:3px 0">' + escHtml(o.title || '(无标题)') + '</div>' +
                        '<div style="color:var(--rpg-muted);white-space:pre-wrap">' + escHtml(String(o.content || '').slice(0, 400)) + '</div>' +
                        (o.reason ? '<div style="color:var(--rpg-muted);font-size:11px;margin-top:4px">理由:' + escHtml(o.reason) + '</div>' : '') +

    /* ---------- 跑一个批次 ---------- */
    /* ---------- 变量表大清洗(v4.8.0):每整理 N 次,把整张表重写成干净版本 ---------- */
    function getVarCount(setId) {
        return dbGet('meta', 'varCount:' + setId).then(row => Math.max(0, parseInt(row && row.value, 10) || 0));
    }
    function setVarCount(setId, n) {
        return dbPut('meta', { k: 'varCount:' + setId, value: n, updatedAt: Date.now() });
    }
    const MEM_CLEAN_PROMPT =
        '你是记忆变量表的清洗助手。这张表被增量更新了很多次,里面可能堆积了冗余、过时、互相矛盾的旧值。\n' +
        '你的任务:参照整理出的记忆,把每个字段的值重写成一份干净、浓缩、当前有效的版本(比如重要事件合并成按顺序的精简列表)。\n' +
        '硬性规则:只输出一个 JSON 对象,格式 {"values":{"字段名":新值,...}};不许增删字段;lock:true 的字段禁止出现在 values 里;数组字段的值必须是数组;没有把握的字段不要输出。\n' +
        '禁止 Markdown 代码块和任何解释文字。';
    function cleanSanitizeValue(oldV, nv) {
        if (Array.isArray(oldV)) {
            if (Array.isArray(nv)) return nv.map(x => String(x));
            const s = String(nv == null ? '' : nv);
            return s.indexOf('、') >= 0 ? s.split('、').map(x => x.trim()).filter(Boolean) : (s.trim() ? [s.trim()] : []);
        }
        if (typeof oldV === 'number') { const n = Number(nv); return isFinite(n) ? n : oldV; }
        return nv == null ? oldV : String(nv);
    }
    async function bigCleanVariables(setId, cfg) {
        const table = await getVarTable(setId);
        const names = Object.keys(table).filter(k => !table[k].lock && !table[k].readonly);
        if (!names.length) return { ok: false, err: '没有可清洗的字段' };
        const mems = await dbAll('memories').catch(() => []);
        const payload = {
            task: 'variable_table_cleanup',
            fields: names.map(k => ({ name: k, value: table[k].value, note: table[k].note, check: table[k].check })),
            lockedFields: Object.keys(table).filter(k => table[k].lock),
            memories: mems.slice(0, 60).map(m => ({ title: m.title, content: String(m.content || '').slice(0, 200) })),
        };
        let raw = '';
        try {
            raw = await apiRequest(MEM_CLEAN_PROMPT + '\n\n下面是材料(JSON)：\n' + JSON.stringify(payload, null, 2) +
                '\n\n只输出 {"values":{…}} 这一个 JSON 对象。', cfg);
        } catch (e) { return { ok: false, err: e.message }; }
        let obj = null;
        try { obj = parseLooseJSON(unwrapAIContent(raw)); } catch (e) { obj = null; }
        const values = obj && typeof obj === 'object' && !Array.isArray(obj) ? (obj.values || obj.值 || obj.变量) : null;
        if (!values || typeof values !== 'object' || Array.isArray(values)) return { ok: false, err: '清洗返回里没有 values 对象' };
        let changed = 0;
        names.forEach(k => {
            if (!Object.prototype.hasOwnProperty.call(values, k)) return;
            const nv = cleanSanitizeValue(table[k].value, values[k]);
            const oldT = varValText(table[k].value), newT = varValText(nv);
            if (oldT !== newT) {
                table[k].value = nv;
                table[k].history.push('大清洗:' + oldT + ' → ' + newT);
                if (table[k].history.length > 20) table[k].history = table[k].history.slice(-20);
                changed++;
            }
        });
        await saveVarTable(setId, table);
        await setVarCount(setId, 0);
        return { ok: true, changed: changed };
    }

    async function runBatch(batch) {
        const cfg = getMemCfg();
        if (memBusy) return { ok: false, err: '还有一个批次在跑' };
        // 自动触发继续遵守限流；用户主动点击“现在整理/重跑”必须立即真正请求。
        if (!batch.manualRun && !memRateOk()) {
            const note = memRateNote();
            memToast(note || '限流中');
            return { ok: false, err: note || '限流中' };
        }
        memBusy = true;
        memRunNote = '正在整理…(发到 ' + hostOf(cfg.api.baseUrl) + ')';
        memToast(memRunNote);
        if (memRoot && memRoot.isConnected) renderMem();
        try {
            if (cfg.previewBeforeSend) {
                const okSend = await memModal({
                    title: '确认发送这一批?',
                    note: '只会发送下面这几条消息,不发送其他会话内容。',
                    bodyHtml: previewBody(batch, cfg),
                    buttons: [{ key: 'yes', label: '发送', primary: true }, { key: 'no', label: '取消' }],
                });
                if (!okSend || okSend.key !== 'yes') { await setBatchStatus(batch, 'cancelled'); return { ok: false, err: '已取消' }; }
            }
            const existing = await dbAll('memories', 'conversationKey', batch.conversationKey).catch(() => []);
            const setId = await ensureDefaultSet();
            const variableTable = await getVarTable(setId);
            const payload = buildPayload(batch, existing, variableTable, cfg);
            const promptText = payloadToPrompt(payload);
            await setBatchStatus(batch, 'requesting', { provider: 'api', sentAt: Date.now() });
            if (memRoot && memRoot.isConnected) renderMem();
            let raw = '';
            try {
                raw = await apiRequest(promptText, cfg);
            } catch (e) {
                await setBatchStatus(batch, 'request-failed', { error: e.message });
                return { ok: false, err: e.message };        // 失败:不计入限流
            }
            if (!String(raw || '').trim()) {                 // 空回:也不计入限流
                await setBatchStatus(batch, 'request-failed', { error: 'AI 返回了空回复' });
                return { ok: false, err: 'AI 返回了空回复' };
            }
            let parsed = null;
            try {
                parsed = parseResult(raw, batch);
            } catch (e) {
                await setBatchStatus(batch, 'invalid-response', { error: e.message, raw: String(raw).slice(0, 2000) });
                return { ok: false, err: e.message };
            }
            const ops = parsed.memoryOps || [];
            let updatedVariables = variableTable;
            let varCount = -1;
            try {
                updatedVariables = applyVariablePatch(variableTable, parsed.variableOps || []);
                await saveVarTable(setId, updatedVariables);
                if ((parsed.variableOps || []).length) {           // 表真的动过才计次
                    varCount = await getVarCount(setId).then(n => n + 1);
                    await setVarCount(setId, varCount);
                }
            } catch (e) {
                await setBatchStatus(batch, 'invalid-response', { error: '变量补丁被拒绝:' + e.message, raw: String(raw).slice(0, 2000) });
                return { ok: false, err: '变量补丁被拒绝:' + e.message };
            }
            memMarkReq();
            await setBatchStatus(batch, 'awaiting-review', { receivedAt: Date.now(), result: { operations: ops, variableOperations: parsed.variableOps || [] }, raw: String(raw).slice(0, 4000) });
            let chosen = ops;
            if (cfg.reviewBeforeWrite) {
                const pick = await memModal({
                    title: '审核这批记忆建议',
                    note: '勾掉的不会写入;忽略项本来就不写入。写入只新增记忆,不会改动原始聊天。',
                    bodyHtml: reviewBody(ops),
                    dismiss: false,
                    buttons: [{ key: 'ok', label: '批准并写入', primary: true }, { key: 'no', label: '先不写' }],
                });
                if (!pick || pick.key !== 'ok') { await setBatchStatus(batch, 'cancelled'); return { ok: false, err: '未批准' }; }
                chosen = pick.picked.map(i => ops[i]);
            } else {
                chosen = ops.filter(o => o.operation === 'create' || o.operation === 'update');
            }
            const written = await ensureDefaultSet().then(() => applyOps(batch, chosen));
            await setBatchStatus(batch, 'embedding', { completedAt: null });
            let vec = { ok: 0, failed: 0, err: '未配置 Embedding' };
            if (cfg.api.embUrl && cfg.api.embModel) vec = await ensureVectors(written, cfg);
            if (convState) {
                convState.lastBatchedUid = Math.max(convState.lastBatchedUid, Math.max.apply(null, batch.messageUids.concat([0])));
                convState.activeBatchId = null;
                convState.lastBatchAt = Date.now();
                await saveConvState();
            }
            await setBatchStatus(batch, (vec.failed && !vec.ok) ? 'partially-completed' : 'completed',
                { completedAt: Date.now(), vector: vec });
            memToast('批次完成:写入 ' + written.length + ' 条记忆,向量 ' + vec.ok + ' 条' + (vec.err ? '(' + vec.err + ')' : ''));
            const cleanEvery = Math.max(0, Math.min(500, parseInt(cfg.varCleanEvery, 10) || 50));
            if (varCount >= 0 && cleanEvery > 0 && varCount >= cleanEvery) {
                memRunNote = '变量表已整理 ' + varCount + ' 次,自动大清洗中…';
                if (memRoot && memRoot.isConnected) renderMem();
                const cr = await bigCleanVariables(setId, cfg);
                memToast(cr.ok ? '表格大清洗完成(重写了 ' + cr.changed + ' 个字段,计数已清零)'
                               : '自动大清洗失败:' + cr.err);
            }
            return { ok: true, written: written, vec: vec, ops: ops, variables: updatedVariables };
        } finally {
            memBusy = false;
            memRunNote = '';
            if (memRoot && memRoot.isConnected) renderMem();
        }
    }

    /* ---------- 询问是否整理(达到阈值时) ---------- */
    async function askBatchCard(batch) {
        const cfg = getMemCfg();
        const pick = await memModal({
            title: '整理这一批?',
            note: '累计到 ' + batch.messageUids.length + ' 条已确认消息。',
            bodyHtml: previewBody(batch, cfg),
            buttons: [
                { key: 'api', label: '用自接 API 整理', primary: true },
                { key: 'later', label: '暂不处理' },
            ],
        });
        if (!pick || !pick.key || pick.key === 'later') return { ok: false, err: '暂不处理' };
        return runBatch(batch);
    }

            : '') + '<div style="color:var(--rpg-muted);font-size:12px">读取中…</div>';

            : '') + (MEM_WIP

            bodyHtml:
                '<label class="rpg-field"><span>名字(比如:身高)</span>' +

                '<div class="action-grid">' +
                    radio('track', '剧情里会变,跟着更新', '比如身高、位置、持有物——变了就改成新的,并记下变化') +
                    radio('lock', '定下来就不变', '比如衣服、外貌设定——AI 只能照着用,永远不许改') +
                '</div>' +
                '<label class="rpg-field" style="margin-top:8px"><span>补充说明(可不填)</span>' +
                '<input id="__var_note__" class="rpg-input" value="' + escHtml(f.note) + '" placeholder="想让 AI 特别注意什么就写这里"></label>' +
                hist,
            buttons: [{ key: 'ok', label: isNew ? '加上' : '保存', primary: true }, { key: 'cancel', label: '取消' }],
        }).then(p => {
            if (!p || p.key !== 'ok') return;
            const newName = String((document.getElementById('__var_name__') || {}).value || '').trim().slice(0, 24);
            const rawVal = String((document.getElementById('__var_value__') || {}).value || '');
            const note = String((document.getElementById('__var_note__') || {}).value || '').trim().slice(0, 60);
            const modeEl = document.querySelector('input[name="__var_mode__"]:checked');

            if (!newName) { memToast('名字不能为空'); return; }
            if (newName.charAt(0) === '_') { memToast('名字不能以下划线开头'); return; }
            if (newName !== name && table[newName] && table[newName].builtin) { memToast('「' + newName + '」是内置字段,不能覆盖'); return; }
            const next = Object.assign({}, table);
            if (!isNew && newName !== name) delete next[name];
            // 数组启发:原值是数组,或用户用、分隔了多项 → 存数组
            const wasArray = Array.isArray(f.value);
            const parts = rawVal.split('、').map(s => s.trim()).filter(Boolean);
            const value = (wasArray || (parts.length > 1 && rawVal.indexOf('、') >= 0)) ? parts : rawVal;
            next[newName] = {
                value: value,
                note: note || (lock ? '用户定死的设定,固定不变' : '随剧情更新的信息'),
                check: lock ? '锁定字段,AI 禁止修改' : '随剧情更新,仅依据明确材料',
                readonly: false, builtin: table[name] ? table[name].builtin === true : false,
                lock: lock, history: f.history || [],
            };
            saveVarTable(setId, next).then(() => { memToast(isNew ? '已加上「' + newName + '」' : '已保存'); renderMem(); });
        });
    }

    function renderVectors() {
        return Promise.all([dbAll('memories'), dbAll('vectors')]).then(r => {
            const mems = r[0], vecs = r[1];
            const byId = {};
            vecs.forEach(v => { byId[v.memoryId || v.id] = v; });
            let normal = 0, pending = 0, stale = 0, orphan = 0;
            mems.forEach(m => {
                const v = byId[m.id];
                if (!v || !v.data) pending++;
                else if (v.hash !== m.hash || v.status !== 'normal') stale++;
                else normal++;
            });
            vecs.forEach(v => { if (!mems.some(m => m.id === (v.memoryId || v.id))) orphan++; });
            const model = (vecs[0] && vecs[0].model) || '(未配置)';
            return '<div class="rpg-group"><div class="rpg-group-title">向量</div>' +
                '<div class="rpg-note">记忆 ' + mems.length + ' 条 · 正常 ' + normal + ' · 待生成 ' + pending +
                ' · 已过期 ' + stale + ' · 孤儿 ' + orphan + '</div>' +
                '<div class="rpg-note">当前模型:' + escHtml(model) + '</div>' +
                '<div class="action-grid" style="margin-top:9px">' +
                    '<button class="rpg-btn is-primary" type="button" data-mact="v-fill">补全缺失向量</button>' +
                    '<button class="rpg-btn" type="button" data-mact="v-stale">重算过期向量</button>' +
                    '<button class="rpg-btn" type="button" data-mact="v-orphan">清理孤儿向量</button>' +
                    '<button class="rpg-btn" type="button" data-mact="refresh">刷新</button>' +
                '</div></div>';
        });
    }

            '限流写死:两次整理之间至少 5 分钟、60 秒内最多 3 次;失败和空回复不占次数,可以马上重试。</div>' +

    function readSettingsForm() {
        const v = id => { const e = document.getElementById(id); return e ? e.value : ''; };
        const r = n => { const e = document.querySelector('input[name="' + n + '"]:checked'); return e ? e.value : null; };
        const c = getMemCfg();
        const num = (x, d) => { const n = parseInt(x, 10); return isFinite(n) ? n : d; };
        c.triggerCount = Math.max(1, num(v('__set_count__'), 5));
        c.recentWindow = Math.max(5, Math.min(200, num(v('__set_win__'), 40)));
        c.varCleanEvery = Math.max(5, Math.min(500, num(v('__set_clean__'), 50)));
        c.mode = r('mode') || c.mode;
        c.trigger = r('trigger') || c.trigger;
        c.onThreshold = r('onT') || c.onThreshold;
        c.vectorMode = r('vmode') || c.vectorMode;
        c.api.baseUrl = v('__set_url__').trim();
        c.api.model = v('__set_model__').trim();
        c.api.token = v('__set_token__');
        c.api.timeoutMs = num(v('__set_timeout__'), 120000);
        c.api.maxRetry = Math.max(1, num(v('__set_retry__'), 1));
        c.api.jsonMode = v('__set_json__').trim() !== '0';
        c.api.embUrl = v('__set_eurl__').trim();
        c.api.embModel = v('__set_emodel__').trim();
        c.api.embToken = v('__set_etoken__');
        c.api.batchSize = Math.max(1, num(v('__set_ebatch__'), 8));
        return c;
    }
    function onMemChange(e) {
        if (MEM_WIP) { memToast('记忆库还在完善中(v0.6),暂时只读'); return; }  // v4.9.0:完善中不接任何改动
        const t = e.target;
        if (!t || !t.dataset) return;
        if (t.dataset.mempick) {
            if (t.checked) memPick.add(t.dataset.mempick); else memPick.delete(t.dataset.mempick);
            const btn = memRoot && memRoot.querySelector('[data-mact="recall-copy"]');
            if (btn) btn.textContent = '复制召回内容(' + memPick.size + ')';
            return;
        }
        if (t.dataset.batchpick) {
            if (t.checked) memBatchPick.add(t.dataset.batchpick); else memBatchPick.delete(t.dataset.batchpick);
            const btn = memRoot && memRoot.querySelector('[data-mact="b-pickdel"]');
            if (btn) btn.textContent = '删除勾选(' + memBatchPick.size + ')';
        }
    }
    function onMemClick(e) {
        const t = e.target;
        if (!t || !t.closest) return;
        if (t.closest('.rpg-head') && !t.closest('[data-mact]')) return;
        const b = t.closest('[data-mact]');
        if (!b) {
            // 变量表整行可点:没点到按钮但点到行 → 直接编辑该字段
            const row = t.closest('[data-varrow]');
            if (row && row.dataset.varrow) {
                if (MEM_WIP) { memToast('记忆库还在完善中(v0.6),编辑暂时停用'); return; }
                varEditModal(memVarsSetId, row.dataset.varrow, memVarsCache);
            }
            return;
        }
        const act = b.dataset.mact;
        const id = b.dataset.id;
        const after = () => { if (memRoot) renderMem(); };
        if (act === 'close') { closeMemConsole(); return; }
        if (act === 'tab') { memTab = b.dataset.tab; renderMem(); return; }
        if (act === 'refresh') { renderMem(); return; }
        if (MEM_WIP) { memToast('记忆库还在完善中(v0.6),这个操作暂时停用'); return; }  // v4.9.0:关闭/切页/刷新之外的操作全停
        if (act === 'collect-now') { memManualTrigger().then(msg => memToast(msg || '已创建批次')).then(after); return; }
        if (act === 'b-view') {
            dbGet('batches', id).then(bt => bt && memModal({
                title: '批次消息',
                note: (bt.messageUids || []).length + ' 条 · ' + (MEM_STATUS_CN[bt.status] || bt.status),
                bodyHtml: (bt.messages || []).map(m => '<div style="margin-bottom:8px"><span style="color:var(--rpg-accent)">' +
                    (m.role === 'user' ? '我' : '角色') + '</span> <span style="color:var(--rpg-muted);font-size:11px">uid ' + m.uid +
                    '</span><div style="white-space:pre-wrap">' + escHtml(m.text) + '</div></div>').join(''),
                buttons: [{ key: 'ok', label: '知道了', primary: true }],
            }));
            return;
        }
        if (act === 'b-api') {
            dbGet('batches', id).then(bt => {
                if (!bt) return;
                if (bt.conversationKey !== convKeyNow()) { memToast('这是另一个会话的批次,结果不会混进来'); return; }
                if (bt.status === 'completed') { memToast('这个批次已经完成了'); return; }
                bt.manualRun = true;
                runBatch(bt).then(r => { if (!r.ok && r.err) memToast('失败:' + r.err); }).then(after);
            });
            return;
        }
        if (act === 'b-cancel') {
            dbGet('batches', id).then(bt => bt && setBatchStatus(bt, 'cancelled').then(() => {
                if (convState && convState.activeBatchId === id) { convState.activeBatchId = null; return saveConvState(); }
            })).then(after);
            return;
        }
        if (act === 'b-del') {
            dbGet('batches', id).then(bt => bt && memModal({
                title: '删除这个批次?',
                note: (bt.messageUids || []).length + ' 条消息 · ' + (MEM_STATUS_CN[bt.status] || bt.status),
                bodyHtml: '<div style="color:var(--rpg-muted)">只删批次记录,不影响已采集的聊天和已写入的记忆;' +
                    '删掉后这几条消息回到"待处理",下次整理会重新带上。</div>',
                buttons: [{ key: 'yes', label: '删除', primary: true }, { key: 'no', label: '取消' }],
            }).then(p => {
                if (!p || p.key !== 'yes') return;
                return dbDel('batches', id).then(() => {
                    if (convState && convState.activeBatchId === id) { convState.activeBatchId = null; return saveConvState(); }
                }).then(() => memToast('批次已删除'));
            })).then(after);
            return;
        }
        if (act === 'b-clear') {
            memModal({
                title: '清空已完成/已取消的批次?',
                note: '只清这两种状态的批次记录;失败的和没处理的都留着。',
                bodyHtml: '',
                buttons: [{ key: 'yes', label: '清空', primary: true }, { key: 'no', label: '取消' }],
            }).then(p => {
                if (!p || p.key !== 'yes') return;
                return dbAll('batches').then(all => Promise.all(
                    all.filter(b => b.status === 'completed' || b.status === 'cancelled').map(b => dbDel('batches', b.id))
                )).then(deleted => memToast('清掉了 ' + deleted.length + ' 个批次'));
            }).then(after);
            return;
        }
        if (act === 'b-pickdel') {
            if (!memBatchPick.size) { memToast('先勾选要删除的批次'); return; }
            memModal({
                title: '删除勾选的 ' + memBatchPick.size + ' 个批次?',
                note: '只删批次记录,不影响已写入的记忆;被删批次里的消息会回到"待处理",下次整理会重新带上。',
                bodyHtml: '',
                buttons: [{ key: 'yes', label: '删除', primary: true }, { key: 'no', label: '取消' }],
            }).then(p => {
                if (!p || p.key !== 'yes') return;
                const ids = Array.from(memBatchPick);
                return Promise.all(ids.map(id => dbDel('batches', id))).then(() => {
                    if (convState && ids.indexOf(convState.activeBatchId) >= 0) {
                        convState.activeBatchId = null;
                        return saveConvState();
                    }
                }).then(() => {
                    memBatchPick.clear();
                    memToast('已删除 ' + ids.length + ' 个批次');
                });
            }).then(after);
            return;
        }
        if (act === 'b-clearall') {
            memModal({
                title: '清空全部 ' + (memRoot ? '' : '') + '批次?',
                note: '所有批次的记录(包括还没处理的)全部删除;已写入的记忆不受影响;没处理的消息下次整理会重新带上。',
                bodyHtml: '',
                buttons: [{ key: 'yes', label: '全部清空', primary: true }, { key: 'no', label: '取消' }],
            }).then(p => {
                if (!p || p.key !== 'yes') return;
                return dbAll('batches').then(all => Promise.all(all.map(b => dbDel('batches', b.id))))
                    .then(del => {
                        memBatchPick.clear();
                        if (convState) { convState.activeBatchId = null; return saveConvState().then(() => del.length); }
                        return del.length;
                    })
                    .then(n => memToast('已清空 ' + n + ' 个批次'));
            }).then(after);
            return;
        }
        if (act === 'var-inj') {
            const c = getMemCfg();
            if (!c.enabled) { memToast('先把「设置」页的记忆库总开关打开,注入才有意义'); return; }
            c.injectVariables = !c.injectVariables;
            setMemCfg(c);
            memToast('发送注入变量表已' + (c.injectVariables ? '开启:发消息时会自动附上变量表' : '关闭'));
            renderMem();
            return;
        }
        if (act === 'var-clean') {
            if (memBusy) { memToast('还有批次在整理,等它跑完'); return; }
            memBusy = true;
            memRunNote = '表格大清洗中…';
            renderMem();
            bigCleanVariables(memVarsSetId, getMemCfg())
                .then(r => memToast(r.ok ? '表格大清洗完成(重写了 ' + r.changed + ' 个字段,计数已清零)' : '大清洗失败:' + r.err))
                .catch(e => memToast('大清洗失败:' + ((e && e.message) || e)))
                .then(() => { memBusy = false; memRunNote = ''; renderMem(); });
            return;
        }
        if (act === 'var-add') {
            varEditModal(memVarsSetId, '', memVarsCache);
            return;
        }
        if (act === 'var-edit') {
            if (!id || !memVarsCache[id]) { memToast('找不到这个字段'); return; }
            varEditModal(memVarsSetId, id, memVarsCache);
            return;
        }
        if (act === 'var-del') {
            if (!id || !memVarsCache[id]) { memToast('找不到这个字段'); return; }
            if (memVarsCache[id].builtin || memVarsCache[id].readonly) { memToast('内置/只读字段不能删除'); return; }
            memModal({
                title: '删除变量「' + id + '」?',
                note: '只删这个字段,AI 以后不再维护它;其他字段和记忆不受影响。',
                bodyHtml: '',
                buttons: [{ key: 'yes', label: '删除', primary: true }, { key: 'no', label: '取消' }],
            }).then(p => {
                if (!p || p.key !== 'yes') return;
                const next = Object.assign({}, memVarsCache);
                delete next[id];
                saveVarTable(memVarsSetId, next).then(() => { memToast('已删除'); renderMem(); });
            });
            return;
        }
        if (act === 'var-reset') {
            memModal({
                title: '恢复默认变量字段?',
                note: '自定义字段全部清掉,内置五个字段恢复初始值(天数/时间/地点/人物/重要事件)。',
                bodyHtml: '',
                buttons: [{ key: 'yes', label: '恢复', primary: true }, { key: 'no', label: '取消' }],
            }).then(p => {
                if (!p || p.key !== 'yes') return;
                saveVarTable(memVarsSetId, defaultVarTable()).then(() => { memToast('已恢复默认'); renderMem(); });
            });
            return;
        }
        if (act === 'set-switch') {
            dbAll('sets').then(sets => {
                if (!sets.length) return;
                const cfg = getMemCfg();
                sets.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                memModal({
                    title: '切换到哪个记忆集?',
                    note: '新整理出的记忆会累加进你选中的这个。',
                    bodyHtml: sets.map(s =>
                        '<button class="rpg-btn' + (s.id === cfg.activeSetId ? ' is-on' : '') + '" type="button" ' +
                        'data-mkey="set:' + s.id + '" style="width:100%;margin-bottom:6px;justify-content:flex-start">' +
                        escHtml(s.name) + (s.id === cfg.activeSetId ? ' · 当前' : '') + '</button>').join(''),
                    buttons: [{ key: 'cancel', label: '取消' }],
                }).then(p => {
                    if (!p || !p.key || p.key === 'cancel' || p.key.indexOf('set:') !== 0) return;
                    const c2 = getMemCfg();
                    c2.activeSetId = p.key.slice(4);
                    setMemCfg(c2);
                    memPick.clear();
                    memToast('已切换记忆集');
                    after();
                });
            });
            return;
        }
        if (act === 'set-new') {
            memModal({
                title: '新建记忆集',
                note: '一条独立的故事线,召回与累加互不干扰。',
                input: true,
                value: '记忆集 ' + (new Date().getMonth() + 1),
                placeholder: '最多 40 个字',
                buttons: [
                    { key: 'ok', label: '创建', primary: true },
                    { key: 'cancel', label: '取消' }
                ]
            }).then(p => {
                const name = p && p.text;
                if (!p || p.key !== 'ok' || !name || !name.trim()) return;
                const s = { id: newId('set'), name: name.trim().slice(0, 40), note: '', createdAt: Date.now() };
                dbPut('sets', s).then(() => saveVarTable(s.id, defaultVarTable())).then(() => {
                    const c = getMemCfg();
                    c.activeSetId = s.id;
                    setMemCfg(c);
                    memPick.clear();
                    memToast('已创建并切换到「' + s.name + '」');
                }).then(after);
            });
            return;
        }
        if (act === 'set-rename') {
            const cfg1 = getMemCfg();
            dbGet('sets', cfg1.activeSetId).then(s => {
                if (!s) { memToast('先选一个记忆集'); return null; }
                return memModal({
                    title: '重命名记忆集',
                    input: true,
                    value: s.name,
                    placeholder: '最多 40 个字',
                    buttons: [
                        { key: 'ok', label: '保存', primary: true },
                        { key: 'cancel', label: '取消' }
                    ]
                }).then(p => {
                    const name = p && p.text;
                    if (!p || p.key !== 'ok' || !name || !name.trim()) return;
                    s.name = name.trim().slice(0, 40);
                    return dbPut('sets', s).then(() => memToast('已重命名'));
                });
            }).then(after);
            return;
        }
        if (act === 'set-del') {
            const cfg2 = getMemCfg();
            dbGet('sets', cfg2.activeSetId).then(s => {
                if (!s) { memToast('没有可删除的记忆集'); return; }
                return memModal({
                    title: '删除记忆集「' + s.name + '」?',
                    note: '集里的记忆和向量会一起删掉;原始聊天不受影响。',
                    bodyHtml: '',
                    buttons: [{ key: 'yes', label: '删除', primary: true }, { key: 'no', label: '取消' }],
                }).then(p => {
                    if (!p || p.key !== 'yes') return;
                    return dbAll('memories').then(ms => Promise.all(
                        ms.filter(m => m.setId === s.id).map(m =>
                            Promise.all([dbDel('memories', m.id), dbDel('vectors', m.id)]))
                    )).then(() => dbDel('meta', 'vars:' + s.id))       // 变量表也一起清
                      .then(() => dbDel('sets', s.id)).then(() => dbAll('sets')).then(rest => {
                        const c = getMemCfg();
                        c.activeSetId = (rest[0] || {}).id || '';
                        setMemCfg(c);
                        memPick.clear();
                        memToast('记忆集已删除');
                    });
                });
            }).then(after);
            return;
        }
        if (act === 'recall-copy') {
            if (!memPick.size) { memToast('先勾选要召回的记忆'); return; }
            const cfg3 = getMemCfg();
            Promise.all([dbGet('sets', cfg3.activeSetId), dbAll('memories')]).then(r => {
                const setName = r[0] ? r[0].name : '记忆';
                const picked = r[1].filter(m => memPick.has(m.id));
                picked.sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
                const text = '【记忆召回 · ' + setName + ' · ' + picked.length + ' 条】\n\n' + picked.map((m, i) =>
                    '#' + (i + 1) + ' ' + (m.title || '') + '\n' + (m.content || '')).join('\n\n');
                copyText(text, () => memToast('已复制 ' + picked.length + ' 条召回内容,粘到聊天里就能用'),
                    () => memToast('复制失败'));
            });
            return;
        }
        if (act === 'recall-clear') { memPick.clear(); after(); return; }
        if (act === 'recall-del') {
            if (!memPick.size) { memToast('先勾选要删除的'); return; }
            memModal({
                title: '删除勾选的 ' + memPick.size + ' 条记忆?',
                note: '连向量一起删;原始聊天不受影响。',
                bodyHtml: '',
                buttons: [{ key: 'yes', label: '删除', primary: true }, { key: 'no', label: '取消' }],
            }).then(p => {
                if (!p || p.key !== 'yes') return;
                return Promise.all(Array.from(memPick).map(id =>
                    Promise.all([dbDel('memories', id), dbDel('vectors', id)])))
                    .then(() => { memPick.clear(); memToast('已删除'); });
            }).then(after);
            return;
        }
        if (act === 'm-view') {
            dbGet('memories', id).then(m => m && memModal({
                title: m.title || '(无标题)',
                note: m.category + ' · ' + fmTime(m.updatedAt),
                bodyHtml: '<div style="white-space:pre-wrap">' + escHtml(m.content) + '</div>',
                buttons: [{ key: 'ok', label: '关闭', primary: true }],
            }));
            return;
        }
        if (act === 'm-del') {
            dbGet('memories', id).then(m => m && memModal({
                title: '删除这条记忆?',
                note: m.title || '',
                bodyHtml: '<div style="white-space:pre-wrap;color:var(--rpg-muted)">' + escHtml(String(m.content).slice(0, 300)) + '</div>',
                buttons: [{ key: 'yes', label: '删除', primary: true }, { key: 'no', label: '取消' }],
            }).then(p => {
                if (!p || p.key !== 'yes') return;
                return Promise.all([dbDel('memories', id), dbDel('vectors', id)]).then(() => memToast('已删除'));
            })).then(after);
            return;
        }
        if (act === 'v-fill' || act === 'v-stale') {
            const cfg = getMemCfg();
            if (!cfg.api.embUrl || !cfg.api.embModel) { memToast('先在「AI 设置」里填 Embedding 地址和模型'); return; }
            dbAll('memories').then(mems => {
                const need = act === 'v-stale' ? mems : mems;
                return ensureVectors(need, cfg);
            }).then(r => memToast('向量完成 ' + r.ok + ' 条,失败 ' + r.failed + (r.err ? '(' + r.err + ')' : ''))).then(after);
            return;
        }
        if (act === 'v-orphan') {
            Promise.all([dbAll('memories'), dbAll('vectors')]).then(r => {
                const ids = r[0].map(m => m.id);
                const jobs = r[1].filter(v => ids.indexOf(v.memoryId || v.id) < 0).map(v => dbDel('vectors', v.id));
                return Promise.all(jobs).then(() => memToast('清理了 ' + jobs.length + ' 条孤儿向量'));
            }).then(after);
            return;
        }
        if (act === 'save') {
            const c = readSettingsForm();
            const hosts = [];
            if (c.api.baseUrl) hosts.push(hostOf(c.api.baseUrl));
            if (c.api.embUrl) hosts.push(hostOf(c.api.embUrl));
            const fresh = hosts.filter(h => h && (c.api.authorizedHosts || []).indexOf(h) < 0);
            const go = () => {
                c.api.authorizedHosts = (c.api.authorizedHosts || []).concat(fresh);
                setMemCfg(c);
                memToast('设置已保存' + (fresh.length ? '(本次新增放行域名:' + fresh.join(' / ') + ')' : ''));
                after();
            };
            if (fresh.length) {
                memModal({
                    title: '授权这些域名?',
                    note: '只有点了确认,脚本才会往这些地址发这个批次的文本。',
                    bodyHtml: fresh.map(h => '<div>· ' + escHtml(h) + '</div>').join(''),
                    buttons: [{ key: 'yes', label: '允许', primary: true }, { key: 'no', label: '不允许' }],
                }).then(p => { if (p && p.key === 'yes') go(); else memToast('未授权,设置没保存'); });
            } else go();
            return;
        }
        if (act === 'mem-toggle') {
            const c0 = getMemCfg();
            c0.enabled = !c0.enabled;
            setMemCfg(c0);
            memToast(c0.enabled ? '记忆库已启用(达到阈值才会问你要不要整理)' : '记忆库已关闭:不整理、不发送、不连任何 AI');
            after();
            return;
        }
        if (act === 'pullmodels') {
            const c = readSettingsForm();               // 直接读表单当前值,不用先保存
            if (!c.api.baseUrl) { memToast('先填服务地址'); return; }
            const box = document.getElementById('__mem_pullmodels__');
            const listUrl = joinApiUrl(String(c.api.baseUrl).replace(/\/chat\/completions\/?$/i, ''), '/models');
            if (box) box.textContent = '拉取模型中…(' + listUrl + ')';
            const h = {};
            if (c.api.token) h.Authorization = 'Bearer ' + c.api.token;
            gmRequest({ method: 'GET', url: listUrl, timeout: 30000, headers: h }).then(r => {
                let ids = [];
                try {
                    const j = JSON.parse(r.responseText);
                    const arr = (j && (j.data || j.models || j.model_list)) || [];
                    ids = arr.map(m => (typeof m === 'string' ? m : (m && (m.id || m.name || m.model))) || '').filter(Boolean);
                } catch (e) {}
                const el = document.getElementById('__mem_pullmodels__');
                if (r.status >= 400 || !ids.length) {
                    if (el) el.textContent = '拉取失败:' + (r.status >= 400
                        ? apiErrMsg(r.status, r.responseText)
                        : '没解析到模型列表(这家服务可能不支持 /models,手动填模型名也一样用)');
                    return;
                }
                ids.sort();
                if (el) el.textContent = '拉到 ' + ids.length + ' 个模型,点一个直接填入:';
                const known = (document.getElementById('__set_model__') || {}).value || '';
                return memModal({
                    title: '可选模型(' + ids.length + ')',
                    note: '点一个 → 自动填进「模型名称」,再点「保存设置」生效。',
                    bodyHtml: '<div style="max-height:46vh;overflow:auto">' + ids.slice(0, 300).map(id =>
                        '<div data-pickmodel="' + escHtml(id) + '" style="padding:7px 9px;border:1px dotted var(--rpg-border);' +
                        'margin-bottom:6px;cursor:pointer;font:400 12px/1.5 var(--rpg-sans)' +
                        (id === known ? ';color:var(--rpg-accent)' : '') + '">' + escHtml(id) + '</div>').join('') + '</div>',
                    buttons: [{ key: 'close', label: '关闭' }],
                    onReady(ov, closeModal) {
                        ov.addEventListener('click', e => {
                            const t = e.target.closest ? e.target.closest('[data-pickmodel]') : null;
                            if (!t) return;
                            const inp = document.getElementById('__set_model__');
                            if (inp) inp.value = t.dataset.pickmodel;
                            memToast('已填入「' + t.dataset.pickmodel + '」,记得点「保存设置」');
                            closeModal({ key: 'picked', picked: [], text: '' });
                        });
                    },
                });
            }).catch(err => {
                const el = document.getElementById('__mem_pullmodels__');
                if (el) el.textContent = '拉取失败:' + err.message;
            });
            return;
        }
        if (act === 'testapi') {
            const cfg1 = getMemCfg();
            if (!cfg1.api.baseUrl) { memToast('先填整理 API 地址并保存'); return; }
            apiRequest('请只回复 {"schemaVersion":1,"operations":[]}', cfg1)
                .then(() => memToast('自接 API 通了(测试没发聊天正文)'))
                .catch(err => memToast('测试失败:' + err.message));
            return;
        }
        if (act === 'wipe') {
            memModal({
                title: '清空整个记忆库?',
                note: '记忆、向量、批次、记忆集、会话记录全部删除;原始聊天不受影响(它本来就不存在这里)。AI 设置会保留。',
                bodyHtml: '',
                buttons: [{ key: 'yes', label: '全部清空', primary: true }, { key: 'no', label: '取消' }],
            }).then(p => {
                if (!p || p.key !== 'yes') return;
                return Promise.all(['memories', 'vectors', 'batches', 'sets', 'conv', 'meta'].map(n => dbStore(n, 'readwrite')
                    .then(st => new Promise(res => { const r = st.clear(); r.onsuccess = () => res(); r.onerror = () => res(); }))))
                    .then(() => {
                        memPick.clear();
                        memBatchPick.clear();
                        convState = null;                      // 下次访问重建
                        const c = getMemCfg();
                        c.activeSetId = '';                    // 下次 ensureDefaultSet 会重新建「记忆集 1」
                        setMemCfg(c);
                        memToast('记忆库已完全清空(6 张表 + 记忆集选择);AI 设置保留');
                    });
            }).then(after);
            return;
        }
        if (act === 's-kw' || act === 's-vec') {
            const qEl = document.getElementById('__mem_q__');
            const q = qEl ? qEl.value.trim() : '';
            const out = document.getElementById('__mem_res__');
            if (!q) { if (out) out.textContent = '先输入关键词。'; return; }
            if (out) out.textContent = '检索中…';
            searchMemories(q, act === 's-vec').then(list => {
                const box = document.getElementById('__mem_res__');
                if (!box) return;
                box.innerHTML = list.length
                    ? list.map(r => '<div style="margin-bottom:8px"><span style="color:var(--rpg-accent)">' +
                        r.score.toFixed(3) + '</span> ' + escHtml(r.title || '') +
                        '<div class="rpg-note" style="white-space:pre-wrap">' + escHtml(String(r.content || '').slice(0, 200)) + '</div></div>').join('')
                    : '没有匹配的记忆。';
            });
            return;
        }
    }

    /* ---------- 检索 ---------- */
    function searchMemories(q, useVec) {
        const cfg = getMemCfg();
        return dbAll('memories').then(mems => {
            let pool = mems;
            if (!cfg.crossConv) pool = pool.filter(m => !m.conversationKey || m.conversationKey === convKeyNow());
            const curSet = cfg.activeSetId;
            if (curSet) pool = pool.filter(m => !m.setId || m.setId === curSet);   // 只搜当前激活的记忆集
            if (useVec) {
                if (!cfg.api.embUrl || !cfg.api.embModel) return Promise.reject(new Error('没配置 Embedding,只能用关键词检索'));
                const have = pool.filter(m => true);
                return embedRequest([q], cfg).then(vs => {
                    const qv = vs[0];
                    if (!qv) return [];
                    return dbAll('vectors').then(all => {
                        const byId = {};
                        all.forEach(v => { byId[v.memoryId || v.id] = v; });
                        return have.map(m => {
                            const v = byId[m.id];
                            return { title: m.title, content: m.content, score: v && v.data ? cosine(qv, v.data) : -1 };
                        }).filter(r => r.score >= 0).sort((a, b) => b.score - a.score).slice(0, 12);
                    });
                });
            }
            const kw = q.toLowerCase();
            return pool.map(m => {
                const t = (m.title || '') + '\n' + (m.content || '');
                let score = 0;
                kw.split(/\s+/).filter(Boolean).forEach(w => { if (t.toLowerCase().indexOf(w) >= 0) score += 1; });
                return { title: m.title, content: m.content, score: score };
            }).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 20);
        }).catch(e => { memToast('检索失败:' + e.message); return []; });
    }

    // 排错用:控制台里 __memDebug.state() 能看当前会话/批次/记忆的状态
    try {
        window.__memDebug = {
            cfg: getMemCfg, state: () => Promise.all([loadConvState(), dbAll('batches'), dbAll('memories')])
                .then(r => ({ conv: r[0], batches: r[1].length, memories: r[2].length,
                    merged: store.merged.length, tick: memTick })),
            tick: memTick,
        };
    } catch (e) {}

    /* ================== 脚本菜单 ================== */

    function getDebugPref() {
        try { return GM_getValue('debugLog', false) === true; } catch (e) { return false; }
    }

    /* v4.11.1:菜单注册收进函数、由 bootMain 调用——非绑定页一个菜单都不出现,
       SPA 补启动时菜单也会跟着补上 */
    function registerMenus() {
        if (typeof GM_registerMenuCommand !== 'function') return;
        GM_registerMenuCommand('打开/关闭导出面板', openPanel);
        GM_registerMenuCommand('打开/收起 功能面板(紧凑)', openRPG);
        // 面板开在屏幕外 / 方块找不着的时候用:清掉三个位置存档,下次打开重新居中
        GM_registerMenuCommand('位置复位(面板跑出屏幕时)', () => {
            ['panelPos', 'rpgPos:v1', 'ballPosV2'].forEach(k => { try { GM_setValue(k, null); } catch (e) {} });
            try { saveDock(Object.assign({}, loadDock(), { mode: 'free' })); } catch (e) {}
            rpgLaid = false;
            const r = document.getElementById('__exp_rpg__');
            if (r) { r.style.left = ''; r.style.top = ''; r.style.display = 'none'; }
            const p = document.getElementById('__exp_panel__');
            if (p) p.remove();
            const b = document.getElementById('__exp_ball__');
            if (b) { positionBall(b); b.dataset.docked = ''; }
            console.log('[导出] 位置已复位:再点悬浮方块 / 打开面板即可');
        });
        GM_registerMenuCommand('打开「指令/小剧场」提取', () => openPanel('cmd'));
        GM_registerMenuCommand('打开「快捷复制库」', () => openPanel('lib'));
        // 上滚过程中面板可能已被关掉,菜单/浮动按钮/Esc 都能终止
        GM_registerMenuCommand('停止自动上滚', () => stopAutoScroll());
        GM_registerMenuCommand('切换:合并调试日志(控制台)', () => {
            const v = !getDebugPref();
            try { GM_setValue('debugLog', v); } catch (e) {}
            setDebug(v);
            console.log('[导出] 调试日志已' + (v ? '开启' : '关闭'));
        });
        GM_registerMenuCommand('切换:小精灵大小(1/1.5/2/2.5/3 倍)', () => {
            applyQScale(QSCALE_STEPS[(QSCALE_STEPS.indexOf(getQPetScale()) + 1) % QSCALE_STEPS.length]);
            const b = document.getElementById('__exp_qsize__');
            if (b) b.textContent = '精灵大小:' + getQPetScale() + 'x';
            console.log('[导出] 小精灵大小改为 ' + getQPetScale() + 'x');
        });
        GM_registerMenuCommand('切换:小精灵(顶上的那几只)', () => {
            setQPetPref(!getQPetPref());
            console.log('[导出] 小精灵已' + (getQPetPref() ? '显示' : '隐藏'));
        });
        GM_registerMenuCommand('切换:发送标注(发送时自动加行动评估)', () => {
            setSendTagPref(!getSendTagPref());
            const b = document.getElementById('__exp_sendtag__');
            if (b) b.textContent = '发送标注:' + (getSendTagPref() ? '开' : '关');
            console.log('[导出] 发送标注已' + (getSendTagPref() ? '开启' : '关闭'));
        });
        GM_registerMenuCommand('切换:随机事件(发送时按概率触发)', () => {
            const c = getRevCfg(); c.on = !c.on; setRevCfg(c); syncRevPanelBtn();
            console.log('[导出] 随机事件已' + (c.on ? '开启(概率 ' + c.prob + '%)' : '关闭'));
        });
        GM_registerMenuCommand('随机事件:概率/事件库设置', openRevDlg);
        GM_registerMenuCommand('切换:页面上显示事件文本', () => {
            setEvtVis(!getEvtVis());
            ensureEvtStyle();
            const b = document.getElementById('__exp_revvis__');
            if (b) b.textContent = '页面上显示事件文本:' + (getEvtVis() ? '开' : '关');
            console.log('[导出] 事件文本在页面上已' + (getEvtVis() ? '可见' : '隐形') + '(三率标注和随机事件一起)');
        });
        GM_registerMenuCommand('三率模式:切换 日常/困难/地狱/高收益', () => {
            const order = triModeOrder();
            const next = order[(order.indexOf(getTriMode()) + 1) % order.length];
            setTriMode(next);
            const m = SENDTAG_MODES[next];
            console.log('[导出] 三率模式:' + m.name + '(成功率' + m.ok[0] + '-' + m.ok[1] +
                ' / 危机' + m.risk[0] + '-' + m.risk[1] + ' / 收益' + m.gain[0] + '-' + m.gain[1] + ')');
        });
        GM_registerMenuCommand('小精灵家园:切换 方块/输入框', () => {
            const next = getQHomePref() === 'input' ? 'ball' : 'input';
            setQHomePref(next);
            if (getQPetPref()) mountQPets(next, true);
            const btn = document.getElementById('__exp_pethome__');
            if (btn) btn.textContent = '小精灵:' + (next === 'input' ? '输入框' : '方块');
            console.log('[导出] 小精灵大本营改成' + (next === 'input' ? '输入框上沿(三只)' : '悬浮方块上(一只)') + ';两个落脚点都还在,拖着就能换地方站');
        });
        GM_registerMenuCommand('悬浮方块:切换 贴附/自由', () => {
            const st = loadDock();
            saveDock(Object.assign({}, st, { mode: st.mode === 'free' ? 'dock' : 'free' }));
            applyBallDock();
            const b = document.getElementById('__exp_dock__');
            if (b) b.textContent = loadDock().mode === 'free' ? '贴附:已挪开' : ('贴附:' + (SIDE_NAME[loadDock().side || 'down'] || '下'));
        });
        GM_registerMenuCommand('悬浮方块:点选贴附目标', pickAnchor);
        GM_registerMenuCommand('记忆库:打开管理台', () => openMemConsole());
        GM_registerMenuCommand('记忆库:现在整理一批', () => {
            memManualTrigger().then(m => console.log('[记忆] ' + (m || '')), e => console.log('[记忆] 失败:' + e.message));
        });
        GM_registerMenuCommand('切换:页面已采集标记高亮', () => {
            setMarkPref(!getMarkVisible());
            const b = document.getElementById('__exp_markbtn__');
            if (b) b.textContent = '页面标记:' + (getMarkVisible() ? '开' : '关');
        });
        GM_registerMenuCommand('打开/关闭:深蓝开屏', () => { splashOpen() ? closeSplash() : openSplash(); });
        GM_registerMenuCommand('打开「学生档案录入」', () => openStudentFile());
    }
    // 启动时恢复调试开关(默认关闭,不刷屏)
    try { setDebug(getDebugPref()); } catch (e) {}

    // 刷新会话后的自动重开:等 DOM 稳定再弹面板;带标记时自动续上自动上滚
    function maybeAutoOpen() {
        let flag = false, wantScroll = false;
        try {
            flag = GM_getValue('autoOpenPanel', false) === true;
            wantScroll = GM_getValue('autoScrollAfterReload', false) === true;
        } catch (e) {}
        if (!flag) return;
        try { GM_setValue('autoOpenPanel', false); } catch (e) {}
        const start = Date.now();
        let lastCount = -1, stable = 0;
        const wait = setInterval(() => {
            const n = document.querySelectorAll('.message-item').length;
            stable = (n > 0 && n === lastCount) ? stable + 1 : 0;
            lastCount = n;
            const timeout = Date.now() - start > 15000;
            if (stable >= 2 || timeout) {
                clearInterval(wait);
                openPanel();
                if (wantScroll) {
                    try { GM_setValue('autoScrollAfterReload', false); } catch (e) {}
                    setTimeout(() => {
                        document.getElementById('__exp_scroll__')?.click();
                    }, 600);
                }
            }
        }, 700);
    }

    /* v4.11.1:启动入口收敛成一个函数——页面加载就在绑定页时这里直接跑;
       从非绑定页 SPA 切进来的,由顶部的 bootOnce() 哨兵补跑。 */
    function bootMain() {
        registerMenus();  // 菜单跟着启动走(v4.11.1)
        ensureMobileStyle();
        ensureBall();
        hookSendTag();    // 发送标注的拦截要尽早挂上,面板没开过也得生效
        hookRandEvents(); // 随机事件的页面隐形包装也要尽早挂上
        ensureRPGSkin();  // 面板/小窗的 RPG 皮肤:变量挂 body,主题跟 rpgTheme:v1
        setMarkVisible(getMarkVisible()); // 首次注入就恢复上次的"页面标记"偏好
        /* v4.11.2:深蓝开屏 —— 每次刷新/进入绑定页都自动显示一次(不再只首显),
           想关就点右上 ✕ / Esc / Enter;菜单「打开/关闭:深蓝开屏」仍可随时唤起
           v4.27.1:悬浮面板加了「自动弹出」开关,关掉后这里直接跳过 */
        try {
            setTimeout(() => { if (getSplashAuto()) try { openSplash(); } catch (e) {} }, 350);
        } catch (e) {}
        maybeAutoOpen();
        window.addEventListener('load', () => { ensureMobileStyle(); ensureBall(); });
        const timer = setInterval(() => {
            if (document.getElementById('__exp_ball__')) { clearInterval(timer); return; }
            ensureMobileStyle();
            ensureBall();
        }, 1000);
        setTimeout(() => clearInterval(timer), 15000);

        /* v4.4:记忆库整理循环。默认总开关是关的,所以什么都不会自动发。 */
        setInterval(() => { try { memTick(); } catch (e) {} }, 2500);
    }
    window.PRO = {open:openSplash, close:closeSplash, root:()=>splashRoot, theme:getRPGTheme,
      setTheme:(t,e)=>themeSwapAnimated(()=>{setRPGTheme(t);syncRPGSkin();if(splashRoot)splashRoot.__splashTheme();window.dispatchEvent(new Event('academy-theme'));},e),
      events:()=>{const c=getRevCfg();return c.list&&c.list.length?c.list:REV_DEFAULT_LIST;}, characters:SPLASH_CHARACTERS, toast:memToast, panel:()=>{openRPG();if(rpgRoot)rpgRoot.style.zIndex='2147483644';},
      exportView:(view)=>openPanel(view||'full',true), memory:openMemConsole,
      captureDraft:(text)=>{store.merged=text.trim()?[{uid:1,role:'user',text:text,intro:false}]:[];},
      generate:()=>askRevConfirm(rerollEvent(''),(yes,text)=>{if(yes){window.academyDraft(text);memToast('事件已加入本地指令草稿');}}),
      pet:()=>{ensureMobileStyle();ensureBall();}, student:openStudentFile};
    ensureRPGSkin();openSplash();
})();

#__exp_splash__ .scx-item.on{background:var(--s-panel);box-shadow:inset 3px 0 0 var(--s-acc)}
#__exp_splash__ .scx-ava{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--s-acc);color:var(--s-acc);font:18px var(--s-font-en);flex:none}
#__exp_splash__ .scx-item b{display:block;font:400 13px var(--s-font-zh);letter-spacing:2px;color:var(--s-text)}
#__exp_splash__ .scx-item small{display:block;color:var(--s-muted);font:8px/2 Arial;letter-spacing:2px}
#__exp_splash__ .scx-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#__exp_splash__ .scx-head{display:flex;align-items:center;gap:14px;padding:13px 30px;border-bottom:1px dotted var(--s-line)}
#__exp_splash__ .scx-head b{display:block;font:400 16px var(--s-font-zh);letter-spacing:3px;color:var(--s-text)}
#__exp_splash__ .scx-head small{display:block;color:var(--s-muted);font:8px/2 Arial;letter-spacing:2px}
#__exp_splash__ .scx-log{flex:1;overflow:auto;padding:26px 6%;display:flex;flex-direction:column;gap:16px}
#__exp_splash__ .scx-msg{max-width:72%;display:flex;flex-direction:column;gap:5px}
#__exp_splash__ .scx-msg.me{align-self:flex-end;align-items:flex-end}
#__exp_splash__ .scx-msg .who{font:8px Arial;letter-spacing:2px;color:var(--s-muted)}
#__exp_splash__ .scx-msg .bubble{border:1px solid var(--s-line);background:var(--s-panel);color:var(--s-text);padding:11px 16px;font:13px/1.9 var(--s-font-zh);white-space:pre-wrap;word-break:break-word}
#__exp_splash__ .scx-msg.me .bubble{border-color:rgba(var(--s-acc-rgb),.5);background:rgba(var(--s-acc-rgb),.06)}
#__exp_splash__ .scx-typing{display:flex;align-items:center;gap:5px;padding:8px 6%;font:9px Arial;letter-spacing:2px;color:var(--s-muted)}
#__exp_splash__ .scx-typing i{width:5px;height:5px;border-radius:50%;background:var(--s-acc);animation:scxDot 1s ease-in-out infinite}
#__exp_splash__ .scx-typing i:nth-child(2){animation-delay:.15s}
#__exp_splash__ .scx-typing i:nth-child(3){animation-delay:.3s}
@keyframes scxDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
#__exp_splash__ .scx-input{display:flex;gap:12px;padding:14px 6% 20px;border-top:1px dotted var(--s-line);align-items:flex-end}
#__exp_splash__ .scx-input textarea{flex:1;background:var(--s-panel);border:1px solid var(--s-line);color:var(--s-text);padding:11px 14px;resize:none;height:64px;font:13px/1.7 var(--s-font-zh)}
#__exp_splash__ .scx-input textarea:focus{outline:none;border-color:var(--s-acc)}
#__exp_splash__ .scx-send{flex:none;border:1px solid var(--s-acc);color:var(--s-acc);background:transparent;padding:0 24px;height:44px;font:700 10px Arial;letter-spacing:3px;transition:.3s}
#__exp_splash__ .scx-send:hover{background:var(--s-acc);color:var(--s-on)}
@media(max-width:760px){#__exp_splash__ .scx-side{flex-basis:168px;width:168px}#__exp_splash__ .scx-item{padding:10px;gap:8px}#__exp_splash__ .scx-item small{display:none}#__exp_splash__ .scx-log,#__exp_splash__ .scx-input{padding-left:14px;padding-right:14px}#__exp_splash__ .scx-head{padding:11px 14px}#__exp_splash__ .scx-msg{max-width:86%}}
