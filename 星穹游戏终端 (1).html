       .message-item                              一条消息(扁平列表,同层兄弟)
         ├ .user-info > .message-context.message-incoming   ← 用户消息(纯文本)
         └ .message-area > .message-context > .markdown-renderer  ← 角色消息
            └ 正文可能是普通 markdown,也可能是 <iframe srcdoc="..."> 卡片
       .message-item.background-introduction      世界书/开场档案卡(永远是第一条)
       滚动容器 = .message-list 祖先中第一个 overflowY 为 scroll 的元素

       ★ 消息身份判定(v3.7,DOM 标记优先 + 严格序列对齐兜底 + 标记净化):
         主机制:已采集的 .message-item 直接打上 data-exp-uid 标记,扫描时
         带标记 = 已采集(不再收录);未标记的新节点靠两侧带标记邻居定位插入;
         下面这套序列对齐只在"整个 DOM 无任何标记"时作为兜底。原始设计:
       DOM 没有服务端 message ID,身份只能靠"多次扫描的序列重叠"建立。
       v3.7 额外处理"虚拟列表复用 DOM 节点导致旧标记残留"的情况(否则新消息
       不会被收录、旧记录还会被别的消息内容覆盖),见 sanitizeTags()。
       核心规则:
         1. exactEq(文本完全一致)是身份判定的唯一标准;
            streamEq(一方为另一方前缀)只允许用在"最新一条消息"的边缘——
            那里是唯一可能正在流式生成、文本还会变长的位置。
            历史消息之间一律严格全等,绝不让"好"和"好。"被当成同一条。
         2. 合并顺序:指纹检查 → 严格包含(带偏移,可同时补更早/更新两段)
            → 尾部修剪(仅最新边缘容许流式) → 头部最长严格重叠(要求达到
            最小安全长度)→ 全部失败则进隔离区,与后续波串联重试,
            绝不整波盲插。
         3. 不存在任何"按文本内容去重":连续 N 条一模一样的真实消息,
            只要它们在序列里是相邻的多格,就全部保留。
         4. 对齐失败、无法确认身份的波 → 标记"不确定",进入隔离区等待
            与后续波拼接;宁可留下缺口,也不制造整段重复。
         5. 诚实说明:没有服务端 ID 时,理论上无法 100% 判定身份
            (例如两条完全相同的长消息分别处于两个窗口的边界)。
            本设计把这类风险压缩到"需要对齐的单条消息恰好又是长文本"这一
            很小的场景,但不能声称零误判。
       ================================================================== */

    /* ================== 文本工具 ================== */

    let textBox = null;
    function getBox() {
        if (!textBox || !textBox.isConnected) {
            textBox = document.createElement('div');
            textBox.style.cssText = 'position:fixed;left:-99999px;top:0;width:760px;';
            document.body.appendChild(textBox);
        }
        return textBox;
    }

    function toText(html) {
        const box = getBox();
        box.innerHTML = html;
        const t = (box.innerText || '').replace(/\u00a0/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
        box.innerHTML = '';
        return t;
    }

    // 解析角色卡片 iframe 的 srcdoc:先在 DOMParser 里删掉 script/style/img 等
    // (保证不加载任何外部资源),再进离屏容器取纯文本。
    // iframe 内容本来就不属于父元素 innerText,所以不会被抓取两遍。
    function iframeToText(srcdoc) {
        try {
            const doc = new DOMParser().parseFromString(srcdoc, 'text/html');
            doc.querySelectorAll('script,style,link,img,video,audio,source,iframe,noscript').forEach(n => n.remove());
            return toText(doc.body ? doc.body.innerHTML : '');
        } catch (e) {
            return '';
        }
    }

    const clean = s => (s || '').replace(/\u00a0/g, ' ').replace(/\n{3,}/g, '\n\n').trim();

    /* ================== 采集存储 + 节点标记(v3.6 引入 / v3.7 加固) ==================

       ★ 身份机制:直接在网页 DOM 上给已采集的 .message-item 打标记
         data-exp-uid="消息编号"。扫描时:
         - 带标记的节点 = 已经采集过,绝不再收录;文本变长(流式)则更新原记录;
         - 不带标记的节点 = 新出现的节点,靠它两侧最近的带标记邻居在结果中的
           位置来决定插入点(前面 → 更早历史,插到头部;后面 → 更新消息,追加;
           两个标记之间 → 按顺序填进中间,能对上原文的映射回原记录,
           对不上的作为新消息插入);
         - 整个 DOM 都没有标记(首次采集/整窗重建)时,退回"严格序列对齐":
           只有能证明与已采集内容连续重叠时才合并,否则标记"不确定"暂存,
           绝不按文本相似去重,连续相同的真实消息全部保留。
       DOM 里没有时间戳(实测 0 个 <time>、无时间文本),标记就是最硬的身份。

       ★ v3.7 修掉的三类真实缺陷(都会直接造成重复或乱序):
         1. 头部前插时逐个 unshift → 更早历史被倒序写进结果;
         2. 中间 run(两侧都有标记)被误判成头部 run → 新消息插到最前面;
         3. 虚拟列表复用 DOM 节点时 data-exp-uid 会残留 → 新消息既不被收录,
            旧记录还会被别的消息文本覆盖。新增 sanitizeTags() 专门净化这类标记。
    */
    const store = {
        merged: [],
        convId: null,
        nextUid: 1,
        stats: { added: 0, updated: 0, matched: 0, uncertain: 0, recycled: 0 },
        quarantine: [],   // 无法确认身份的波,等后续扫描拿到锚点再并回来
        qKeys: [],        // 上面每个波的指纹,避免同一窗口重复入队
        prints: [],       // 最近若干波的指纹,用于识别"同一个 DOM 窗口重复出现"
    };
    const TAG = 'data-exp-uid';

    /* ---------- 调试日志:默认关闭,不刷屏 ----------
       脚本菜单里可开关;打开后每次扫描在控制台打一行合并结果。 */
    let DEBUG = false;
    function setDebug(v) { DEBUG = !!v; return DEBUG; }
    function getDebug() { return DEBUG; }
    function dbg() {
        if (!DEBUG) return;
        try { console.log.apply(console, ['[导出]'].concat(Array.prototype.slice.call(arguments))); } catch (e) {}
    }

    function conversationId() {
        return new URLSearchParams(location.search).get('conversationId') || location.pathname + location.search;
    }

    function resetStore() {
        store.merged.length = 0;
        store.nextUid = 1;
        store.convId = conversationId();
        store.stats = { added: 0, updated: 0, matched: 0, uncertain: 0, recycled: 0 };
        store.quarantine.length = 0;
        store.qKeys.length = 0;
        store.prints.length = 0;
        // 换会话:清掉页面上所有旧标记,避免串会话
        document.querySelectorAll('[' + TAG + ']').forEach(el => el.removeAttribute(TAG));
    }

    /* ---------- 单次 DOM 扫描:节点列表(带元素引用与已有标记) ---------- */
    function scanNodes() {
        const nodes = [];
        for (const el of document.querySelectorAll('.message-item')) {
            const isIntro = el.classList.contains('background-introduction');
            const incoming = el.querySelector('.message-context.message-incoming');
            let role = null, text = '';
            if (incoming) {
                role = 'user';
                // 事件文本在前端是隐形 span,innerText 会丢;导出前先还原成普通文本
                text = clean(incoming.querySelector('span.' + REVT_MARK)
                    ? evtRestoredClone(incoming).innerText : incoming.innerText);
            } else {
                const md = el.querySelector('.markdown-renderer') || el.querySelector('.message-context');
                if (!md) continue;
                role = 'char';
                const clone = evtRestoredClone(md);
                clone.querySelectorAll('iframe').forEach(f => f.remove());
                text = clean(clone.innerText);
                for (const f of md.querySelectorAll('iframe')) {
                    const src = f.getAttribute('srcdoc');
                    if (src) {
                        const t = clean(iframeToText(src));
                        if (t) text += (text ? '\n\n' : '') + t;
                    }
                }
            }
            if (!text) continue;
            const tag = el.getAttribute(TAG);
            nodes.push({
                el: el,
                role: role,
                text: text,
                intro: isIntro,
                ord: 0,                                   // 本次扫描中的序号,v3.7 用于判断"边缘"
                uid: tag ? parseInt(tag, 10) : null,
            });
        }
        return nodes;
    }

    /* ================== 身份比较 ================== */

    // 严格全等:身份判定唯一标准(历史消息之间只用它)
    function exactEq(a, b) {
        return !!a && !!b && a.role === b.role && a.text === b.text;
    }

    // 流式比较:一方文本是另一方前缀(生成中间态)。
    // ★ 只允许用在"最新边缘":① 已标记节点的内容更新;② 尾部 run 的第一条。
    //   历史消息之间一律走 exactEq,绝不让"好"和"好。"被当成同一条。
    function streamEq(a, b) {
        if (!a || !b || a.role !== b.role) return false;
        const x = a.text, y = b.text;
        return x === y || x.startsWith(y) || y.startsWith(x);
    }

    // 公共前缀长度
    function cpLen(a, b) {
        const n = Math.min(a.length, b.length);
        let i = 0;
        while (i < n && a.charCodeAt(i) === b.charCodeAt(i)) i++;
        return i;
    }

    // 两段文本的关系 —— v3.7 用来判断"同一条消息被重写"还是"节点被借壳显示别的消息":
    //   same   完全一致
    //   prefix 一方是另一方前缀(流式中间态的典型形态)
    //   near   公共前缀占较短一方 ≥60%(同一条消息被重新渲染的常见形态)
    //   diff   基本无关 → 大概率是另一个消息,用于识别 DOM 节点复用
    function textRelation(a, b) {
        if (a === b) return 'same';
        if (a.startsWith(b) || b.startsWith(a)) return 'prefix';
        const m = Math.min(a.length, b.length);
        if (m > 0 && cpLen(a, b) / m >= 0.6) return 'near';
        return 'diff';
    }
    const relRank = r => (r === 'same' ? 3 : r === 'prefix' ? 2 : r === 'near' ? 1 : 0);

    // 最小安全重叠:序列对齐兜底时,对齐段必须足够可信
    // v3.7 补充:短的 ping 消息(比如"好")之所以危险,是因为它在结果里可能出现多次,
    // 有多个候选位置就无法判断到底接在哪儿。反过来,如果这条锚点文本在整个结果里
    // 只出现过一次 → 位置唯一、没有歧义,短文本同样可信。真正该拦的是"歧义",不是"长度"。
    function anchorTrusted(block, uniq) {
        const k = block.length;
        if (k === 0) return false;
        if (k >= 3) return true;
        let minLen = Infinity;
        for (const r of block) minLen = Math.min(minLen, r.text.length);
        if (k === 2 && minLen >= 12) return true;
        if (k === 1 && minLen >= 30) return true;
        // 锚点在结果中只出现一次时，其序列位置没有歧义。
        // 即使文本很短，也可以作为严格全等锚点。这里仍然不是按文本全局去重，
        // 只是用唯一位置证明当前 wave 与已采集序列的连接关系。
        if (uniq) return true;
        return false;
    }

    // 锚点文本在结果里出现的次数(最多数到 2 就够判断唯一性)
    function countExact(node) {
        let c = 0;
        for (const r of store.merged) {
            if (exactEq(r, node) && ++c >= 2) return c;
        }
        return c;
    }

    // 波的指纹:最近若干波指纹相同 = 同一个 DOM 窗口重复出现(v3.7 建议项)
    function waveKey(nodes) {
        let h = 5381;
        for (const n of nodes) {
            const s = (n.role || '') + '␟' + n.text;
            for (let i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i)) >>> 0;
        }
        return nodes.length + ':' + h.toString(36);
    }

    function newRecord(r) {
        return { uid: store.nextUid++, role: r.role, text: r.text, intro: r.intro };
    }

    function tagNode(node, rec) {
        if (node && node.el) node.el.setAttribute(TAG, String(rec.uid));
    }

    // 撤销标记:节点上的 uid 作废,页面属性也删掉,让它重新走"未标记"判定
    function stripTag(n) {
        n.uid = null;
        if (n.el && n.el.removeAttribute) n.el.removeAttribute(TAG);
    }

    /* ================== v3.7 新增:标记净化 ==================
       为什么必须做:虚拟列表会复用 DOM 节点。data-exp-uid 写在元素上,框架把这个
       元素拿去显示另一条消息时属性还在 —— 于是那条新消息被当成"已采集"(丢消息),
       旧记录的文本还会被它的内容覆盖(脏数据)。两类证据能识别出这种复用:
         A. 顺序矛盾:按 DOM 顺序排列的带标记节点,它们在结果中的位置必须递增;
            出现回跳,回跳那个节点的属性就是残留的。
         B. 文本矛盾:节点文本与它声称的记录文本几乎无关(diff),且它不在"最新边缘"
            —— 边缘允许流式生成和整段重写,非边缘就不该变成完全不同的内容。
       命中后只撤销标记,不删原记录:那条消息我们确实采集过,只是节点被借走了。
    */
    function sanitizeTags(nodes) {
        const M = store.merged;
        const posOf = new Map();
        for (let i = 0; i < M.length; i++) posOf.set(M[i].uid, i);
        const lastOrd = nodes.length - 1;
        let n2 = 0;
        const tagged = [];

        for (const n of nodes) {
            if (n.uid == null) continue;
            if (!posOf.has(n.uid)) { stripTag(n); n2++; continue; }   // 标记指向已不存在的记录
            const rec = M[posOf.get(n.uid)];
            n._rel = textRelation(n.text, rec.text);
            const dup = tagged.filter(t => t.uid === n.uid)[0];
            if (dup) {
                // 同一条记录被两个节点声明:文本更贴合的那个才是真身
                if (relRank(n._rel) > relRank(dup._rel)) {
                    stripTag(dup); n2++;
                    tagged[tagged.indexOf(dup)] = n;
                } else { stripTag(n); n2++; }
            } else {
                tagged.push(n);
            }
        }

        // A. 顺序必须单调递增
        let maxPos = -1;
        for (const n of tagged) {
            if (n.uid == null) continue;
            const p = posOf.get(n.uid);
            if (p < maxPos) {
                dbg('标记顺序回跳 → 判定为 DOM 复用', n.uid, p, '<', maxPos, safe(n.text));
                stripTag(n); n2++;
                continue;
            }
            maxPos = p;
        }

        // B. 文本矛盾且非边缘 → 判为被借壳的节点
        for (const n of tagged) {
            if (n.uid == null) continue;
            if (n._rel !== 'diff') continue;
            const rec = M[posOf.get(n.uid)];
            const isEdge = (n.ord === lastOrd) || (rec === M[M.length - 1]);
            if (isEdge) continue;                       // 边缘允许整段重写(流式/卡片刷新)
            dbg('文本矛盾且非边缘 → 判定为 DOM 复用', n.uid, safe(rec.text), '→', safe(n.text));
            stripTag(n); n2++;
        }
        return n2;
    }
    const safe = s => (s || '').slice(0, 24).replace(/\n/g, '⏎');

    /* ================== 合并(核心) ==================
       返回 {added, updated, matched, uncertain, recycled} 并累计进 store.stats。
       全程不存在"按文本内容去重":同一段文本出现两次,只可能是序列里的两格。
    */
    function mergeNodes(nodes) {
        const res = { added: 0, updated: 0, matched: 0, uncertain: 0, recycled: 0 };
        const M = store.merged;
        const fin = () => {
            store.stats.added += res.added;
            store.stats.updated += res.updated;
            store.stats.matched += res.matched;
            store.stats.uncertain += res.uncertain;
            store.stats.recycled += res.recycled;
            dbg('扫描 add=' + res.added + ' upd=' + res.updated + ' hit=' + res.matched +
                ' un=' + res.uncertain + ' rcy=' + res.recycled + ' 共' + M.length + '条');
            return res;
        };
        if (!nodes.length) return fin();

        // 结构不变量:开场白只会是第一条,出现在末尾说明是历史误采集,清除
        while (M.length > 1 && M[M.length - 1].intro) M.pop();

        for (let i = 0; i < nodes.length; i++) nodes[i].ord = i;
        res.recycled = sanitizeTags(nodes);   // v3.7:先净化残留标记,后面的判定才有意义

        // 指纹:同一个 DOM 窗口重复出现时可以识别出来(见本文顶部注释)
        const key = waveKey(nodes);
        const sameAsPrev = store.prints.length > 0 && store.prints[store.prints.length - 1] === key;
        store.prints.push(key);
        if (store.prints.length > 8) store.prints.shift();

        const posOf = uid => { for (let i = 0; i < M.length; i++) if (M[i].uid === uid) return i; return -1; };
        const lastOrd = nodes.length - 1;

        // 空库:全部按 DOM 顺序收入
        if (!M.length) {
            for (const n of nodes) {
                const rec = newRecord(n);
                M.push(rec);
                tagNode(n, rec);
                res.added++;
            }
            return fin();
        }

        // ① 已标记节点:身份已被标记确认;文本差异按关系处理(见 textRelation)
        for (const n of nodes) {
            if (n.uid == null) continue;
            const rec = M.find(r => r.uid === n.uid);
            if (!rec) { stripTag(n); continue; }        // 理论少见,按未标记处理
            const rel = textRelation(n.text, rec.text);
            if (rel === 'same') { res.matched++; continue; }
            if (rel === 'prefix') {
                if (n.text.length > rec.text.length) {
                    rec.text = n.text;                  // 流式生成变长 → 更新同一条
                    res.updated++; res.matched++;
                    dbg('流式补全', n.uid, '→', n.text.length, '字');
                } else {
                    res.matched++;                      // 渲染瞬间抓到较短快照,保留已存长文本
                }
                continue;
            }
            // near / diff:标记本身就是身份证据(净化已排除复用),以 DOM 当前文本为准
            rec.text = n.text; res.updated++; res.matched++;
            dbg('同条消息内容变化(' + rel + ')', n.uid, safe(n.text));
        }

        // ② 把未标记节点按"最近标记邻居"分组:
        //    head(前面无标记) / middle(两侧都有标记) / tail(后面无标记)
        const runs = [];
        let cur = null, prevTagUid = null, sawTag = false;
        for (const n of nodes) {
            if (n.uid != null) {
                if (cur) { cur.afterUid = n.uid; runs.push(cur); cur = null; }
                prevTagUid = n.uid;
                sawTag = true;
            } else {
                if (!cur) cur = { items: [], beforeUid: prevTagUid, afterUid: null };
                cur.items.push(n);
            }
        }
        if (cur) runs.push(cur); // 尾部 run(afterUid 为空)

        // ③ 整个 DOM 无任何标记:退回严格序列对齐(带映射,合并后补打标记)
        if (!sawTag) {
            const ok = anchorAlign(nodes, res);
            if (!ok) {
                // 同一个窗口反复出现时只入队一次,避免隔离区堆同一份内容
                if (store.qKeys.indexOf(key) < 0) {
                    store.quarantine.unshift(nodes.map(n => ({ role: n.role, text: n.text, intro: n.intro })));
                    store.qKeys.unshift(key);
                    if (store.quarantine.length > 4) { store.quarantine.pop(); store.qKeys.pop(); }

                }
                res.uncertain = 1;
                dbg('无法确认身份 → 隔离区', key, sameAsPrev ? '(与上一波完全相同的窗口)' : '');
            }
            return fin();
        }

        // ④ 从最后一个 run 往前处理:后面的插入不会影响前面 run 的锚点位置
        for (let ri = runs.length - 1; ri >= 0; ri--) {
            const run = runs[ri];
            const items = run.items;
            const aPos = run.beforeUid != null ? posOf(run.beforeUid) : -1;
            const bPos = run.afterUid != null ? posOf(run.afterUid) : -1;

            if (run.beforeUid == null && run.afterUid != null) {
                // ── 头部 run:位于首个标记之前 → 这些是更早的历史 ──
                if (bPos < 0) continue;
                let i = items.length - 1, j = bPos - 1;
                while (i >= 0 && j >= 0 && exactEq(items[i], M[j])) {
                    items[i].uid = M[j].uid;            // 同一条消息被重新渲染 → 映射回原记录
                    res.matched++; i--; j--;
                }
                // ★ v3.7:先按顺序收集再一次 unshift。逐个 unshift 会把更早历史倒序写进结果。
                const recs = [];
                for (let k = 0; k <= i; k++) {
                    const rec = newRecord(items[k]);
                    items[k].uid = rec.uid;
                    recs.push(rec);
                    res.added++;
                }
                if (recs.length) M.unshift(...recs);
            } else if (run.beforeUid != null && run.afterUid != null) {
                // ── 中间 run:两侧都有标记 → 只能填进 [aPos+1, bPos) 这个区间 ──
                // ★ v3.7:v3.6 把这类 run 误当成"头部 run"unshift 到最前面,导致顺序错乱。
                if (aPos < 0 || bPos <= aPos) continue;
                fillRange(lastOrd, items, aPos + 1, bPos, false, res);
            } else if (run.beforeUid != null && run.afterUid == null) {
                // ── 尾部 run:锚点是最后一个标记,后面是可能出现的新消息 ──
                if (aPos < 0) continue;
                fillRange(lastOrd, items, aPos + 1, M.length, true, res);
            } else {
                // sawTag 为真时不可能出现(整波都无标记是 ③ 处理的)
            }
        }

        // ⑤ 统一补打标记:新入库与映射回原记录的节点都要带上标记,下次扫描直接命中
        for (const n of nodes) {
            if (n.uid != null && n.el && n.el.getAttribute(TAG) !== String(n.uid)) {
                n.el.setAttribute(TAG, String(n.uid));
            }
        }

        // ⑥ 兜底清除意外落尾的开场白
        while (M.length > 1 && M[M.length - 1].intro) M.pop();
        return fin();
    }

    /* ---------- 区间填充:把一串未标记节点填进 [pos, bound) ----------
       allowStream 为 true 时才允许对第一条做流式(前缀)比较,且必须是边缘消息:
       既要是"结果里最后一条",又或者它是"DOM 里最后一个节点"。
       中间区间一律严格全等,绝不因为相似就吞掉一条真实消息。
    */
    function fillRange(lastOrd, items, pos, bound, allowStream, res) {
        const M = store.merged;
        for (let i = 0; i < items.length; i++) {
            const it = items[i];
            if (pos < bound && exactEq(it, M[pos])) {
                it.uid = M[pos].uid;                    // 已采集过的内容被重渲染 → 映射回原记录
                res.matched++; pos++;
                continue;
            }
            if (allowStream && i === 0 && pos < M.length) {
                const isEdge = (pos === M.length - 1) || (it.ord === lastOrd);
                if (isEdge && streamEq(it, M[pos]) && it.text.length > M[pos].text.length) {
                    // 仅限"尾部 run 第一条 + 边缘"允许流式比较:同一条消息变长 → 更新
                    M[pos].text = it.text;
                    it.uid = M[pos].uid;
                    res.updated++; res.matched++; pos++;
                    dbg('尾部流式更新', M[pos - 1] && M[pos - 1].uid, '→', it.text.length, '字');
                    continue;
                }
            }
            // 真正的新消息,插到当前对应位置(顺序由 DOM 顺序保证)
            const rec = newRecord(it);
            M.splice(pos, 0, rec);
            it.uid = rec.uid;
            res.added++; pos++; bound++;
        }
    }

    /* ---------- 无标记兜底:严格序列对齐(整窗重建/首次采集后 DOM 全换) ----------
       与 v3.5 相同的保守策略:exactEq 锚定扩展 + 最小安全重叠;
       方向约束:前缀只准插头部、后缀只准追加末尾;
       对不上的波 → "不确定"暂存隔离区,等后续扫描再试,绝不盲插。
       成功后给块内节点补打标记,下次扫描就不再走这条慢路径。
    */
    function anchorAlign(nodes, res) {
        const M = store.merged;
        if (!M.length) {
            for (const n of nodes) {
                const rec = newRecord(n);
                M.push(rec);
                tagNode(n, rec);
                res.added++;
            }
            return true;
        }
        for (const ai of [nodes.length - 1, 0]) {
            const cand = [];
            for (let p = 0; p < M.length && cand.length < 50; p++) {
                if (exactEq(M[p], nodes[ai])) cand.push(p);
            }
            let best = null;
            for (const p of cand) {
                let back = 0, fwd = 0;
                while (ai - back - 1 >= 0 && p - back - 1 >= 0 && back < 300 &&
                       exactEq(nodes[ai - back - 1], M[p - back - 1])) back++;
                while (ai + fwd + 1 < nodes.length && p + fwd + 1 < M.length && fwd < 300 &&
                       exactEq(nodes[ai + fwd + 1], M[p + fwd + 1])) fwd++;
                const len = back + 1 + fwd;
                if (!best || len > best.len) best = { p: p, back: back, fwd: fwd, len: len, ai: ai };
            }
            if (best && best.len > 0) {
                const i0 = best.ai - best.back;
                const p0 = best.p - best.back;
                const prefix = nodes.slice(0, i0);
                const suffix = nodes.slice(best.ai + best.fwd + 1);
                const p1 = best.p + best.fwd;
                const block = nodes.slice(i0, best.ai + best.fwd + 1);
                const headOK = prefix.length === 0 || p0 === 0;
                const tailOK = suffix.length === 0 || p1 === M.length - 1;
                if (anchorTrusted(block, countExact(nodes[best.ai]) === 1) && headOK && tailOK) {
                    for (let i = 0; i < block.length; i++) {
                        block[i].uid = M[p0 + i].uid;    // 块内节点映射回原记录
                        tagNode(block[i], M[p0 + i]);
                    }
                    // 方向约束:更早的前缀按 DOM 顺序插到对齐块之前
                    for (let i = prefix.length - 1; i >= 0; i--) {
                        const rec = newRecord(prefix[i]);
                        M.splice(p0, 0, rec);
                        tagNode(prefix[i], rec);
                        res.added++;
                    }
                    const at = p0 + prefix.length + block.length;
                    for (let i = 0; i < suffix.length; i++) {
                        const rec = newRecord(suffix[i]);
                        M.splice(at + i, 0, rec);
                        tagNode(suffix[i], rec);
                        res.added++;
                    }
                    res.matched += block.length;
                    return true;
                }
            }
        }
        return false;
    }

    /* ---------- 采集入口:换会话自动重置;先消化隔离区,再采当前 DOM ---------- */
    function captureNow() {
        if (store.convId !== conversationId()) resetStore();
        try { expandFoldedText(); } catch (e) {}   // v4.9.2:采集前把折叠的文本展开,读到的才是全文
        // 之前"不确定"的波:现在可能有了锚点,先试着合并回来
        for (let qi = 0; qi < store.quarantine.length; qi++) {
            const tmp = { added: 0, updated: 0, matched: 0, uncertain: 0, recycled: 0 };
            const fakeNodes = store.quarantine[qi].map(r => ({ el: null, role: r.role, text: r.text, intro: r.intro, uid: null, ord: 0 }));
            if (anchorAlign(fakeNodes, tmp)) {
                store.stats.added += tmp.added;
                store.stats.updated += tmp.updated;
                store.stats.matched += tmp.matched;
                store.quarantine.splice(qi, 1);
                store.qKeys.splice(qi, 1);
                qi--;
                dbg('隔离区已并入', 'add=' + tmp.added, 'hit=' + tmp.matched);
            }
        }
        return mergeNodes(scanNodes());
    }

    /* ================== 导出格式 ================== */

    function buildExport(msgs, format, nick, charName) {
        if (format === 'json') {
            return JSON.stringify(msgs.map((m, i) => ({
                index: i + 1,
                id: 'm' + m.uid,
                role: m.role === 'user' ? nick : charName,
                text: m.text,
            })), null, 2);
        }
        const line = '────────────────';
        const out = [];
        for (let i = 0; i < msgs.length; i++) {
            const name = msgs[i].role === 'user' ? nick : charName;
            if (format === 'md') {
                if (i > 0 && msgs[i].role !== msgs[i - 1].role) out.push('---');
                out.push('**' + name + ':**\n\n' + msgs[i].text);
            } else {
                if (i > 0 && msgs[i].role !== msgs[i - 1].role) out.push(line);
                out.push(name + ':\n' + msgs[i].text);
            }
        }
        return out.join('\n\n');
    }

    function download(name, content, mime) {
        const blob = new Blob([content], { type: mime + ';charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }

    function fileStem(suffix) {
        const cid = new URLSearchParams(location.search).get('conversationId') || '未知会话';
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        return 'qqy聊天记录-' + cid + (suffix ? '-' + suffix : '') + '-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes());
    }

    /* ================== 指令 / 小剧场 提取(v3.8) ==================

       ★ 判定规则(按你的确认:只认 $):
         只扫用户的消息(role === 'user'),文本里出现半角 $ 就把【整段】算一条。
         - 为什么不看角色消息:你说的就是"用户可能发送的指令/小剧场"。
         - 为什么取整段而不是取到换行:这类指令经常跨多行(带场景、带参数),
           按行切会把一条指令撕成几段,点复制时就不好用了。
         - 只有半角 $。全角 ＄ 没算进来(中文输入法容易误触会太多噪声),
           要加的话说一声。

       ★ 排序:按真实对话顺序(store.merged 的顺序),不重新排、不去重。
         两条一模一样的指令在对话里出现两次,这里也是两条。
    */
    const CMD_MARK = '$';

    function pickCommands(list) {
        const out = [];
        for (const m of list) {
            if (m.role !== 'user') continue;
            if (m.text.indexOf(CMD_MARK) < 0) continue;
            out.push(m);
        }
        return out;
    }

    // 列表里显示的一行摘要:取第一个非空行,过长截断
    function briefOf(text, max) {
        const lines = String(text || '').split('\n');
        let s = '';
        for (const l of lines) { if (l.trim()) { s = l.trim(); break; } }
        const n = max || 40;
        return s.length > n ? s.slice(0, n) + '…' : (s || '(空)');
    }

    function previewOf(text, max) {
        const t = String(text || '');
        const n = max || 220;
        return t.length > n ? t.slice(0, n) + '\n…(共 ' + t.length + ' 字)' : t;
    }

    function buildCmdExport(cmds, format, nick) {
        if (format === 'json') {
            return JSON.stringify(cmds.map((m, i) => ({
                index: i + 1,
                id: 'm' + m.uid,
                role: nick,
                title: briefOf(m.text),
                text: m.text,
            })), null, 2);
        }
        const line = '────────────────';
        const out = [];
        for (let i = 0; i < cmds.length; i++) {
            const no = format === 'md'
                ? '## 指令 ' + (i + 1) + ' / ' + cmds.length
                : '指令 ' + (i + 1) + ' / ' + cmds.length;
            if (i > 0) out.push(line);
            out.push(no + '\n' + cmds[i].text);
        }
        return out.join('\n\n');
    }

    /* ================== 快捷复制库(v3.8) ==================

       存哪儿:油猴 GM_setValue → 该扩展自己的本地存储,只在这台浏览器里,
       刷新/重启浏览器都还在,但不会上传、不会跟任何账号同步。
       ★ 写入时机:只有你在列表里点了「存入快捷」并且确认框选了"确定",才会写。
         没有任何自动入库的逻辑,这是你明确要求的"保存需要用户同意"。
    */
    const LIB_KEY = 'quickLib:v1';

    function libAll() {
        try {
            const a = GM_getValue(LIB_KEY, null);
            return Array.isArray(a) ? a : [];
        } catch (e) { return []; }
    }
    function libWrite(arr) {
        try { GM_setValue(LIB_KEY, arr); return true; } catch (e) { return false; }
    }
    // 返回新长度;已存在(文本完全相同)返回 -1
    function libAdd(text) {
        const arr = libAll();
        const t = String(text || '');
        if (!t.trim()) return -1;
        if (arr.some(it => it.text === t)) return -1;
        arr.push({
            id: 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            title: briefOf(t),
            text: t,
            savedAt: new Date().toISOString(),
        });
        return libWrite(arr) ? arr.length : -1;
    }
    function libRemove(id) {
        const arr = libAll().filter(it => it.id !== id);
        libWrite(arr);
        return arr.length;
    }

    function buildLibExport(items, format) {
        if (format === 'json') {
            return JSON.stringify(items.map((it, i) => ({
                index: i + 1, id: it.id, title: it.title, text: it.text, savedAt: it.savedAt,
            })), null, 2);
        }
        const line = '────────────────';
        const out = [];
        for (let i = 0; i < items.length; i++) {
            const no = format === 'md'
                ? '## ' + (i + 1) + ' / ' + items.length
                : (i + 1) + ' / ' + items.length;
            if (i > 0) out.push(line);
            out.push(no + '\n' + items[i].text);
        }
        return out.join('\n\n');
    }

    /* ---------- 写入 qqy 聊天输入框(v3.9) ----------

       ★ 真实 DOM(2026-10 从 qqy 前端 bundle 核对到的 ChatInput 组件):
           <div class="qqy-input-wrap input-wrap">
             <textarea rows="1" placeholder="…" class="placeholder-visible">   ← Vue v-model 受控
           <div class="send-button">…
         所以:
         1. 它是原生 textarea,不是 contenteditable;
         2. 绑定靠 v-model + onInput,【写完必须补一次 input 事件】,
            否则界面上看着有字,点发送却拿到空值;
         3. 」placeholder-visible」这个类只在没内容时挂上,别拿它当永久标识。

       ★ 已有内容时是【追加】而不是替换:宁可多两行,也不把你打了一半的字抹掉。
       ★ 只填不发送,发送永远由你按回车/点按钮决定。
    */
    const COMPOSER_SELECTORS = [
        '.qqy-input-wrap textarea',
        '.input-wrap textarea',
        '.qqy-input-container textarea',
        '.input-container textarea',
        '.input-area textarea',
        'textarea',
    ];
    const COMPOSER_KEY = 'composerSel:v1';

    function getComposerSel() {
        try { return GM_getValue(COMPOSER_KEY, '') || ''; } catch (e) { return ''; }
    }
    function setComposerSel(sel) {
        try { GM_setValue(COMPOSER_KEY, sel); } catch (e) {}
    }
    function readValue(el) {
        if (!el) return '';
        if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') return el.value || '';
        return el.innerText || '';
    }
    function usable(el) {
        if (!el || !el.isConnected) return false;
        if (el.disabled || el.readOnly) return false;
        const r = el.getBoundingClientRect();
        if (!(r.width > 30 && r.height > 16)) return false;
        try {
            const cs = getComputedStyle(el);
            if (cs.visibility === 'hidden' || cs.display === 'none') return false;
        } catch (e) {}
        return true;
    }
    // 找出最像「聊天输入框」的那个元素:优先上次成功过的选择器 → 已知类名 → 位置/大小打分
    function findComposer() {
        const saved = getComposerSel();
        if (saved) {
            try {
                const hit = document.querySelector(saved);
                if (usable(hit)) return { el: hit, sel: saved, saved: true, rect: hit.getBoundingClientRect() };
            } catch (e) {}
        }
        const seen = [];
        const push = (el, sel) => {
            if (!usable(el)) return;
            if (seen.some(c => c.el === el)) return;
            seen.push({ el: el, sel: sel, rect: el.getBoundingClientRect() });
        };
        COMPOSER_SELECTORS.forEach(sel => {
            try { document.querySelectorAll(sel).forEach(el => push(el, sel)); } catch (e) {}
        });
        if (!seen.length) return null;
        seen.forEach(c => {
            let score = 0;
            const hasParent = c.el.closest && (c.el.closest('.qqy-input-wrap') || c.el.closest('.input-wrap') ||
                c.el.closest('.qqy-input-container') || c.el.closest('.input-area'));
            if (hasParent) score += 1000;                                  // 命中已知聊天输入容器
            if (c.el.tagName === 'TEXTAREA') score += 300;                 // 原生文本框优先
            else if (c.el.isContentEditable) score += 200;
            if (c.rect.bottom > window.innerHeight * 0.55) score += 400;   // 输入框一般在页面下方
            score += Math.min(c.rect.width * c.rect.height / 500, 300);    // 越大越像主输入框
            c.score = score;
        });
        seen.sort((a, b) => b.score - a.score);
        return seen[0];
    }
    function caretEnd(el) {
        try {
            const range = document.createRange();
            range.selectNodeContents(el);
            range.collapse(false);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            return range;
        } catch (e) { return null; }
    }
    // 走原生 setter + 补发 input 事件,绕开 Vue / React 对 value 的监听
    function writeValue(el, text) {
        const tag = el.tagName;
        if (tag === 'TEXTAREA' || tag === 'INPUT') {
            let ok = false;
            try {
                const proto = tag === 'TEXTAREA' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
                const desc = Object.getOwnPropertyDescriptor(proto, 'value');
                if (desc && desc.set) desc.set.call(el, text); else el.value = text;
                ok = true;
            } catch (e) { el.value = text; ok = true; }
            el.dispatchEvent(new Event('input', { bubbles: true }));
            el.dispatchEvent(new Event('change', { bubbles: true }));
            return ok;
        }
        if (el.isContentEditable) {
            caretEnd(el);
            let ok = false;
            try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
            if (!ok) {
                const range = caretEnd(el);
                if (range) {
                    range.insertNode(document.createTextNode(text));
                    caretEnd(el);
                }
                el.dispatchEvent(new InputEvent('input', { inputType: 'insertText', data: text, bubbles: true }));
            }
            return true;
        }
        return false;
    }
    // 返回 {ok, reason, el, sel, appended}
    function fillToComposer(text) {
        if(window.academyDraft){const ok=window.academyDraft(text);return {ok,reason:ok?undefined:'NO_SESSION',el:document.querySelector('#academy-workspace .composer textarea'),appended:true};}

        const found = findComposer();
        if (!found) return { ok: false, reason: 'NO_INPUT' };
        const el = found.el;
        try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) {} }
        let appended = false;
        if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
            const before = readValue(el);
            appended = !!before.trim();
            const sep = (appended && !/\n$/.test(before)) ? '\n' : '';
            writeValue(el, appended ? (before + sep + text) : text);
            try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
        } else {
            const before = readValue(el).trim();
            appended = !!before;
            if (appended) writeValue(el, '\n' + text); else writeValue(el, text);
        }
        if (!found.saved && found.sel) setComposerSel(found.sel);
        return { ok: true, el: el, sel: found.sel, appended: appended };
    }
    // 找发送按钮:和输入框同一个容器里的 .send-button
    function findSendButton(inputEl) {
        if (inputEl) {
            const scope = inputEl.closest('.qqy-input-wrap') || inputEl.closest('.input-wrap') ||
                inputEl.closest('.input-area') || inputEl.closest('.input-container');
            if (scope) {
                const b = scope.querySelector('.send-button');
                if (b) return b;
            }
        }
        const all = [];
        try { document.querySelectorAll('.send-button').forEach(el => all.push(el)); } catch (e) {}
        let best = null;
        all.forEach(el => {
            const r = el.getBoundingClientRect();
            if (!(r.width > 10 && r.height > 10)) return;
            if (!best || r.bottom > best.getBoundingClientRect().bottom) best = el;
        });
        return best;
    }
    // 填入后等 Vue 把 v-model 处理完再点发送(不然按钮还停在禁用态)
    function fillAndSend(text) {
        const r = fillToComposer(text);
        if (!r.ok) return { ok: false, reason: r.reason };
        const btn = findSendButton(r.el);
        if (!btn) return { ok: false, reason: 'NO_SEND' };
        const fire = () => { try { btn.click(); } catch (e) {} };
        setTimeout(fire, 160);
        return { ok: true, sel: btn.className };
    }

    /* ---------------------------------------------------------------------------
       发送标注(v3.14):点发送的那一下,把「行动评估」一行追加到消息尾再让消息出去:
         <此消息为系统脚本控制:当前此行动危机率为12%,成功率为87%,收益率为40%>
       评估只看这条消息的文字:关键词定基调(危险的词抬高危机率、客气的词压低、
       钱物类的词抬收益率),再叠一层按文本哈希的确定性抖动 —— 同一条消息
       不管算几次,三个数都一样;换个说法就会变。纯本地计算,不联网。
       面板按钮 / 脚本菜单都能关(存 sendTag:v1)。

    const SENDTAG_KEY = 'sendTag:v1';
    const SENDTAG_RE = /<此消息为系统脚本控制[:：][^>]*>\s*/g;

    const SENDTAG_SAFE = ['请', '谢谢', '帮忙', '合作', '商量', '道歉', '抱歉', '好好说', '慢慢来', '一起'];
    const SENDTAG_GAIN = ['钱', '金', '宝', '奖励', '报酬', '利益', '宝藏', '积分', '经验', '装备', '好处', '赚', '情报', '线索'];

    const TRIMODE_KEY = 'triMode:v1';
    const SENDTAG_MODES = {
        daily: { name: '日常',   ok: [50, 100], risk: [0, 100],  gain: [0, 100] },   // 稳:成功率最低 50
        hard:  { name: '困难',   ok: [30, 100], risk: [0, 100],  gain: [0, 100] },   // 成功率最低 30
        hell:  { name: '地狱',   ok: [0, 100],  risk: [20, 100], gain: [50, 100] },  // 危机高,收益也高
        rich:  { name: '高收益', ok: [0, 100],  risk: [50, 100], gain: [50, 100] },  // 收益大危机也大
    };

    function setTriMode(m) { try { GM_setValue(TRIMODE_KEY, SENDTAG_MODES[m] ? m : 'daily'); } catch (e) {} }

        const lo = range[0], hi = range[1];

    }
    function sendTagHash(s) {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
        return h >>> 0;
    }
    function assessAction(text) {
        const t = String(text || '').slice(0, 500);
        let risk = 15, gain = 20 + Math.min(t.length, 200) * .1;
        SENDTAG_RISK.forEach(w => { if (t.indexOf(w) >= 0) risk += 12; });
        SENDTAG_SAFE.forEach(w => { if (t.indexOf(w) >= 0) risk -= 6; });
        SENDTAG_GAIN.forEach(w => { if (t.indexOf(w) >= 0) gain += 12; });
        const h = sendTagHash(t);
        /* v4.28.2:抖动从 ±4/±5 拉到 ±12 —— 之前太小,换个说法三个数几乎不动,没有随机感 */
        risk += (h % 25) - 12;               // ±12 确定性抖动:同文同值,换写法就变
        gain += ((h >> 8) % 25) - 12;        // ±12
        risk = Math.max(1, Math.min(95, Math.round(risk)));
        gain = Math.max(0, Math.min(99, Math.round(gain)));
        /* v4.28.2:成功率跟危机率强挂钩(0.75) + ±8 抖动 —— 旧版 92-risk*.6±3,
           没危险词时 risk≈15 → ok 永远 80-90,换什么模式映射完都差不多高 */
        let ok = 88 - risk * .75 + ((h >> 16) % 17) - 8;
        ok = Math.max(5, Math.min(95, Math.round(ok)));
        // v4.9.1:按当前三率模式把三个数映射进模式区间(同文同模式同值)
        const M = SENDTAG_MODES[getTriMode()] || SENDTAG_MODES.daily;
        return { risk: triMap(risk, M.risk), ok: triMap(ok, M.ok), gain: triMap(gain, M.gain) };
    }
    function buildTagLine(text) {

    // 去掉旧标注再加新的(事件由拦截层先决定好传进来,这里是纯拼装):
    // ev = '' 不带事件;ev = '<触发事件:…>' 带上。重发不会叠出好几行。
    function tagComposerText(raw, ev) {
        let stripped = String(raw || '').replace(SENDTAG_RE, '').replace(REVT_RE, '').replace(/\s+$/, '');
        if (!stripped) return '';
        let next = stripped;
        if (getSendTagPref()) next += '\n' + buildTagLine(stripped);
        if (ev) next += '\n' + ev;         // 事件永远另起一行,跟在标注后面
        return next === stripped ? '' : next;

        if (!found || !found.el) return false;

        try { before = readValue(el); } catch (e) { return false; }
        if (!before || !before.trim()) return false;      // 空消息没什么可评估的
        const next = tagComposerText(before, ev || '');
        if (!next || next === before) return false;
        writeValue(el, next);
        if (!found.saved && found.sel) setComposerSel(found.sel);
        return true;
    }

        return el && el.closest && (el.closest('.qqy-input-wrap') || el.closest('.input-wrap') ||

    }

    let sendTagHooked = false;
    let revReplaying = false;     // 确认/跳过后的自动补发:放行,别再拦一遍
    let revDialogOpen = false;    // 询问弹窗挂着的时候,后续发送先放行
    let memInjecting = false;     // 异步读取变量表时摁住当前发送，避免重复触发
    function variableInjectionEnabled() {
        if (MEM_WIP) return false;                       // v4.9.0:记忆库完善中,注入停用
        try {

    }
    function injectVariableTable(replay) {
        const found = findComposer();
        if (!found || !found.el) return Promise.resolve(false);
        const el = found.el;
        let raw = '';
        try { raw = readValue(el); } catch (e) { return Promise.resolve(false); }
        raw = String(raw || '').replace(MEM_VAR_INJECT_RE, '').replace(/\s+$/, '');
        if (!raw.trim()) return Promise.resolve(false);
        return ensureDefaultSet().then(setId => getVarTable(setId)).then(table => {

    function interceptSend(e, replay) {

        const found = findComposer();
        const scope = found && found.el ? sendTagScope(found.el) : null;

    function replaySend(replay) {
        const found = findComposer();
        const el = (found && found.el) || replay.el || null;

        const fireClick = () => {
            let btn = replay.btn;

        if (run()) return;
        let tries = 0;
        const again = () => {                        // 最多再试几轮,还不行就换回车兜底

    /* 实际生效的事件池:自己存的库优先,空了用内置默认 100 条(想彻底关掉请用开关) */
    function revListAll() {
        const c = getRevCfg();
        return c.list.length ? c.list : REV_DEFAULT_LIST;
    }
    function getRevCfg() {
        let d = null;
        try { d = GM_getValue(REVT_KEY, null); } catch (e) {}
        const c = d && typeof d === 'object' ? d : {};
        const p = Math.round(Number(c.prob));
        return {
            on: c.on !== false,
            prob: isNaN(p) ? 30 : Math.max(0, Math.min(100, p)),
            list: Array.isArray(c.list) ? c.list.map(s => String(s).trim()).filter(Boolean) : []
        };
    }
    function setRevCfg(cfg) { try { GM_setValue(REVT_KEY, cfg); } catch (e) {} }
    function revActive() { const c = getRevCfg(); return c.on && c.prob > 0 && revListAll().length > 0; }
    function getEvtVis() { try { return GM_getValue(REVT_VIS_KEY, false) === true; } catch (e) { return false; } }
    function setEvtVis(v) { try { GM_setValue(REVT_VIS_KEY, !!v); } catch (e) {} }
    function ensureEvtStyle() {
        let st = document.getElementById('__exp_evtcss__');
        if (!st) {
            st = document.createElement('style');
            st.id = '__exp_evtcss__';
            (document.head || document.documentElement).appendChild(st);
        }
        st.textContent = getEvtVis()
            ? '.' + REVT_MARK + '{display:inline;font-size:12px;color:#b06060;font-style:italic;opacity:.8}'
            : '.' + REVT_MARK + '{display:inline-block;width:0;height:0;overflow:hidden;font-size:0;line-height:0;letter-spacing:0;vertical-align:baseline}';
    }
    // 导出用:把克隆里的事件 span 还原成普通文本节点,innerText/textContent 才带得上
    function evtRestoredClone(el) {
        const c = el.cloneNode(true);
        if (c.querySelectorAll) c.querySelectorAll('span.' + REVT_MARK).forEach(s => {
            s.replaceWith(document.createTextNode(s.getAttribute('data-t') || s.textContent || ''));
        });
        return c;
    }
    // 把页面消息里的 <触发事件:…> 和 <此消息为系统脚本控制:…> 都包进隐形 span;
    // Vue 重渲染后观察器会再包一遍
    let revObsTimer = 0, revObs = null;
    function revScanOnce() {
        document.querySelectorAll('.message-item').forEach(item => {
            const walker = document.createTreeWalker(item, REVT_SHOW_TEXT, null);
            const hits = [];
            let n;
            while ((n = walker.nextNode())) {
                if (!n.nodeValue || !EVT_HIDE_FIND.test(n.nodeValue)) continue;
                const p = n.parentElement;
                if (p && p.closest && p.closest('.' + REVT_MARK)) continue;   // 包过的不碰
                hits.push(n);
            }
            hits.forEach(node => {
                const text = node.nodeValue;
                const frag = document.createDocumentFragment();
                let last = 0;
                EVT_HIDE_RE.lastIndex = 0;
                let m;
                while ((m = EVT_HIDE_RE.exec(text))) {
                    const whole = m[0].replace(/\s+$/, '');
                    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
                    const sp = document.createElement('span');
                    sp.className = REVT_MARK;
                    sp.setAttribute('data-t', whole);
                    sp.textContent = whole;
                    frag.appendChild(sp);
                    last = m.index + m[0].length;
                }
                if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
                node.parentNode.replaceChild(frag, node);
            });
        });
    }
    function hookRandEvents() {
        if (revObs || typeof document === 'undefined' || !document.body || !window.MutationObserver) return;
        ensureEvtStyle();
        revObs = new MutationObserver(() => {
            if (revObsTimer) return;
            revObsTimer = setTimeout(() => { revObsTimer = 0; try { revScanOnce(); } catch (e) {} }, 120);
        });
        revObs.observe(document.body, { childList: true, subtree: true, characterData: true });
        revScanOnce();
    }

        if (typeof rpgIsOpen === 'function' && rpgIsOpen() && rpgRoot && rpgRoot.__rpgRefresh) {

        document.body.appendChild(d);

       动画也就必须一起做:统一从这里走。不支持 View Transitions / 用户禁动效 → 直接切。 */
    function themeSwapAnimated(apply, ev) {
        let reduce = false;
        try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
        const el = document.documentElement;
        if (el) {
            try {
                if (ev && typeof ev.clientX === 'number' && typeof ev.clientY === 'number') {
                    el.style.setProperty('--exp-vt-x', Math.round(ev.clientX) + 'px');
                    el.style.setProperty('--exp-vt-y', Math.round(ev.clientY) + 'px');
                } else {                       // 键盘触发/没有坐标:交回默认圆心
                    el.style.removeProperty('--exp-vt-x');
                    el.style.removeProperty('--exp-vt-y');
                }
            } catch (e) {}
        }
        if (typeof document.startViewTransition !== 'function' || reduce) { apply(); return; }
        try { document.startViewTransition(apply); } catch (e) { apply(); }
    }


    const SCROLL_HIDE_CSS = "#__exp_splash__ *,#__exp_splash__{scrollbar-width:none;-ms-overflow-style:none}#__exp_rpg__ *,#__exp_rpg__{scrollbar-width:none;-ms-overflow-style:none}#__exp_panel__ *,#__exp_panel__{scrollbar-width:none;-ms-overflow-style:none}#__exp_revdlg__ *,#__exp_revdlg__{scrollbar-width:none;-ms-overflow-style:none}#__exp_revask__ *,#__exp_revask__{scrollbar-width:none;-ms-overflow-style:none}#__exp_mem__ *,#__exp_mem__{scrollbar-width:none;-ms-overflow-style:none}#__exp_memask__ *,#__exp_memask__{scrollbar-width:none;-ms-overflow-style:none}#__exp_splash__ *::-webkit-scrollbar,#__exp_splash__::-webkit-scrollbar{display:none;width:0;height:0}#__exp_rpg__ *::-webkit-scrollbar,#__exp_rpg__::-webkit-scrollbar{display:none;width:0;height:0}#__exp_panel__ *::-webkit-scrollbar,#__exp_panel__::-webkit-scrollbar{display:none;width:0;height:0}#__exp_revdlg__ *::-webkit-scrollbar,#__exp_revdlg__::-webkit-scrollbar{display:none;width:0;height:0}#__exp_revask__ *::-webkit-scrollbar,#__exp_revask__::-webkit-scrollbar{display:none;width:0;height:0}#__exp_mem__ *::-webkit-scrollbar,#__exp_mem__::-webkit-scrollbar{display:none;width:0;height:0}#__exp_memask__ *::-webkit-scrollbar,#__exp_memask__::-webkit-scrollbar{display:none;width:0;height:0}";

    function syncRPGSkin() {

    /* ---------- 触发确认弹窗(v4.2):Event Generator 卡片 ----------
       拦截到一次发送、并且这次抽中了事件时弹出来。四个按钮:
         触发事件      = 把这条事件注入消息尾,放行这次发送
         重新随机      = 只换一条,不发(还在等你决定)
         本次跳过      = 原样发送,不加事件
         编辑我的事件库 = 打开设置小窗,不发送
       Esc = 本次跳过;点遮罩不生效(防误触);done 只会被调用一次;
       标题只是界面展示(从正文首行生成),不改注入的正文。 */
    function revBodyOf(s) {
        let b = String(s == null ? '' : s).replace(/^<触发事件[:：]/, '').replace(/>\s*$/, '').trim();
        /* v4.28.1:剥掉末尾的「|分类」标注(内置 100 条库带分类尾缀,注入只要正文) */
        b = b.replace(/\|+\s*(?:危机|奇迹|未知|恐怖|幸运|不幸)\s*$/, '').trim();
        return b;
    }
    function revTitleOf(s) {
        const b = revBodyOf(s);
        if (!b) return 'EVENT';
        const first = b.split(/\r?\n/)[0].trim();
        return first.length <= 12 ? first : first.slice(0, 11) + '…';
    }
    function rerollEvent(cur) {
        const list = revListAll();
        if (!list.length) return cur;
        let pick = list[Math.floor(Math.random() * list.length)];
        if (list.length > 1) {
            const now = revBodyOf(cur);
            let guard = 0;
            /* v4.28.2:比较前先剥分类尾缀 —— 库条目带「|危机」这类标注时,
               原始 pick 永远 ≠ 剥过的 now,防重复循环会失效,换一换能换出同一条 */
            while (revBodyOf(pick) === now && guard++ < 24) pick = list[Math.floor(Math.random() * list.length)];
        }
        return '<触发事件:' + revBodyOf(pick) + '>';
    }

    function askRevConfirm(evText, done) {
        ensureRPGSkin();
        revDialogOpen = true;

        const ov = document.createElement('div');
        ov.id = '__exp_revask__';
        ov.innerHTML =
            '<div class="rpg-ask-card">' +
                '<div class="module-top">' +
                    '<span class="module-label">Event Generator</span>' +
                    '<span class="module-status"><i class="status-light"></i>Triggered</span>' +
                '</div>' +
                '<div class="event-display">' +
                    '<span class="event-index">EVENT 001</span>' +
                    '<h2 class="event-title"></h2>' +
                    '<p class="event-text __exp_revask_txt__"></p>' +
                '</div>' +
                '<p class="rpg-ask-note">本次发送已暂停:确认后事件随消息一起注入输入框;' +
                    '跳过则原样发送。Esc = 本次跳过。</p>' +
                '<div class="rpg-ask-btns">' +
                    '<button class="rpg-btn is-primary" type="button" data-revact="yes">触发事件</button>' +
                    '<button class="rpg-btn" type="button" data-revact="reroll">重新随机</button>' +
                    '<button class="rpg-btn" type="button" data-revact="skip">本次跳过</button>' +
                    '<button class="rpg-btn" type="button" data-revact="edit">编辑我的事件库</button>' +
                '</div>' +
            '</div>';

        const titleEl = ov.querySelector('.event-title');
        const textEl = ov.querySelector('.__exp_revask_txt__');
        const idxEl = ov.querySelector('.event-index');
        let cur = String(evText == null ? '' : evText);
        let roll = 0;
        let finished = false;

        const paint = () => {
            textEl.textContent = revBodyOf(cur);
            titleEl.textContent = revTitleOf(cur);
            idxEl.textContent = 'EVENT ' + String(roll + 1).padStart(3, '0');
        };
        paint();

        const finish = v => {
            if (finished) return;               // 防连点:只放行一次
            finished = true;
            if (typeof document !== 'undefined' && document.removeEventListener) {
                document.removeEventListener('keydown', onKey, true);
            }
            if (ov.isConnected) ov.remove();    // 清掉临时 DOM
            revDialogOpen = false;
            done(v, cur);
        };
        const onKey = e => {
            if (e.key !== 'Escape') return;
            e.preventDefault();
            e.stopPropagation();
            finish(false);
        };

        ov.querySelector('[data-revact="yes"]').addEventListener('click', () => finish(true));
        ov.querySelector('[data-revact="skip"]').addEventListener('click', () => finish(false));
        ov.querySelector('[data-revact="reroll"]').addEventListener('click', () => {
            cur = rerollEvent(cur);
            roll++;
            paint();
        });
        ov.querySelector('[data-revact="edit"]').addEventListener('click', () => openRevDlg());

        if (typeof document !== 'undefined' && document.addEventListener) {
            document.addEventListener('keydown', onKey, true);
        }
        document.body.appendChild(ov);
        const first = ov.querySelector('[data-revact="yes"]');
        if (first && first.focus) first.focus();
    }

        const CHAR_FOLD_SCALE = .88;           // 折叠态卡片只比展开时小一点点
        let charFoldX = null;                  // 折叠态整排的横向位置(null = 从最左边开始)
        let charActive = -1, charFanned = false, charDetail = false, charDealTimer = 0, charInfoTimer = 0, charDrawTimer = 0;
        let charStep = 202;                     // 相邻卡片固定步长(重叠量恒定,不随数量压缩)

        let charDragCard = null, charWheelLock = false;

        let charW = 160, charSelW = 300;        // 普通卡宽 / 选中卡宽(像素)
        function charMeasure() {                // 把 CSS 的 clamp 折算成像素
            const mk = v => {
                const pr = document.createElement('div');
                pr.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;height:0;width:var(' + v + ')';
                charDeck.appendChild(pr);

            charW = mk('--ch-w') || charW;
            charSelW = mk('--ch-w-sel') || charSelW;

        function charCardW() { return charW; }
        function charCardH() { return charCards[0] ? (charCards[0].offsetHeight || 400) : 400; }
        function charLayout() {
            charMeasure();
            charStep = Math.round(charW * 1.55);     // v4.30.0:参考版窄卡排布,卡间留出明显空隙
        }
        function charX(i) {                     // 选中卡右边的卡整体让出多出来的宽度
            return i * charStep + (i > charActive ? charSelW - charW : 0);
        }
        function charDeckW() { return charDeck.clientWidth || 800; }
        function charDeckH() { return charDeck.clientHeight || 520; }
        function charPose(i) {
            if (!charFanned) {                      // 默认(折叠):一整排窄长斜切卡,间距均匀,全部可见
                return { x: i * charStep, y: 0, skew: 6, scale: 1, z: 1000-i };
            }
            const off = i - charActive;
            /* 轮播一排:固定步长,离中心越远越往下压,层级越低。
               v4.16.1:斜切只用一个方向(不再左右两边反向歪),视觉更整齐;
               只有中间被选中的那张放平(skew 0)。

            return {

                y: Math.abs(off) * 8,

                scale: 1,

        function charApply(i) {

            /* v4.19.0:把落点也写成自定义属性,「抽出来」那段 CSS 动画直接读它们做起止帧 */
            el.style.setProperty('--ch-x', p.x + 'px');

        }

            const n = charCards.length, rowW = (n - 1) * charStep + charW, sw = rowW * sc, dw = charDeckW();
            if (sw <= dw - 80) return { fit: true, x: (dw - sw) / 2 };       // 装得下:居中
            return { fit: false, min: dw - sw - 40, max: 40 };                // 装不下:可以左右滑
        }

            const r = charFoldRange(CHAR_FOLD_SCALE);
            return r.fit ? r.x : Math.max(r.min, Math.min(r.max, x));

        function charFoldScroll(dx, anim) {
            const r = charFoldRange(CHAR_FOLD_SCALE);
            if (r.fit) return;
            charFoldX = charFoldClamp(charTrackX + dx);
            charTrack.style.transition = anim ? 'transform .3s cubic-bezier(.22,1,.36,1)' : 'none';
            charSetTrackXY(charFoldX, charTrackY, CHAR_FOLD_SCALE);

        function charTrackTarget(stack) {
            /* 竖向居中:无论是叠着的一摞还是展开的一排,卡片都在视口垂直正中 */
            const y = charDeckH() / 2 - charCardH() / 2;
            if (stack || !charFanned) {

                const sc = CHAR_FOLD_SCALE, r = charFoldRange(sc);

                return { x: x, y: charDeckH() / 2 - sc * charCardH() / 2, sc: sc };
            }

            return {

            charInfoNo.style.display = 'none';

        /* v4.16.2:免动画就位——加 spl-notrans 抹掉过渡,摆好位置,双 rAF 后再恢复,

        function charPlaceStill() {

            setTimeout(() => root.classList.remove('spl-notrans'), 160);

        function charInit() {
            /* v4.29.0:改回第一版横向滑动轮播 —— 进入即一横排展开、中间那张默认选中放平,

            if (!charCards.length) return;

            charDetail = true;
            charActive = Math.min(charCards.length - 1, Math.floor((charCards.length - 1) / 2));
            charFoldX = null;
            clearTimeout(charDealTimer);
            root.classList.add('spl-fanned');
            charLayout();
            charPlaceStill();
            charInfoFill(charActive);
        }
        function charRefresh() {
            charCards.forEach((el, i) => { el.style.transitionDelay = '0ms'; charApply(i); });
            charTrack.style.transition = 'transform .5s cubic-bezier(.22,1,.36,1)';
            const p = charTrackTarget(false);
            charSetTrackXY(p.x, p.y, p.sc);
        }
        function charFan(idx) {                 // 点折叠堆里的某张:展开成排 + 直接显示全部详细信息(v4.26.0 不用再点一下)
            charFanned = true;
            charActive = idx;
            root.classList.add('spl-fanned');
            charLayout();
            charRefresh();
            charShowDetail();
        }
        function charCollapse() {               // 没点到下一张卡:回到全部折叠
            if (!charFanned) return;
            const fr = charFoldRange(CHAR_FOLD_SCALE);       // 收起时让刚才那张留在视口中间附近
            if (!fr.fit) charFoldX = charFoldClamp(charDeckW() / 2 - CHAR_FOLD_SCALE * (charActive * charStep + charW / 2));
            charFanned = false;
            charDetail = false;
            charActive = -1;
            root.classList.remove('spl-fanned');
            charRefresh();
            charInfoEmptyFill('点击任意一张卡片抽出。');
        }
        function charShowDetail() {             // 显示详细信息(v4.26.0:选中即显示,不再两步)
            charDetail = true;
            charCards.forEach((el, i) => charApply(i));
            charInfoFill(charActive);
        }
        function charGo(idx) {
            if (!charFanned) return;
            idx = Math.max(0, Math.min(charCards.length - 1, idx));
            if (idx === charActive) { if (!charDetail) charShowDetail(); return; }
            charActive = idx;
            charRefresh();
            charShowDetail();                    // 切到哪张就立刻显示哪张的详细信息
        }
        /* 点击卡片:牌堆 → 抽出居中 → 再点显示详情;点别的卡 → 它居中;点空白 → 全部收回。
           v4.23.1:由 pointerup(<5px)调用,不再走 click 事件(被 setPointerCapture 重定向吞掉,见上) */
        root.__academyDraw = idx => {if(idx<0||idx>=charCards.length)return;charTapCard(idx);};
        root.__academyStep = n => {if(!charFanned)charFan(0);else charGo(charActive+n);};
        root.__academyFold = () => charCollapse();
        function charTapCard(idx) {
            if (idx < 0) { charCollapse(); return; }
            if (!charFanned) { charFan(idx); return; }
            if (idx === charActive) { if (!charDetail) charShowDetail(); return; }
            charGo(idx);
        }
        /* 拖拽 / 手指滑动:松手吸附到最近一张;没怎么动 = 点击那张卡(v4.23.1) */
        charDeck.addEventListener('pointerdown', e => {
            if (e.button !== undefined && e.button !== 0) return;
            charDragOn = true;
            charDragging = false;
            charDragStartX = e.clientX;
            charDragBase = charTrackX;
            charDragCard = e.target && e.target.closest ? e.target.closest('.spl-chcard') : null;
            charDeck.classList.add('spl-drag');
            try { charDeck.setPointerCapture(e.pointerId); } catch (err) {}
        });
        charDeck.addEventListener('pointermove', e => {
            if (!charDragOn) return;
            const dx = e.clientX - charDragStartX;
            if (Math.abs(dx) > 4) charDragging = true;
            if (!charDragging) return;
            charTrack.style.transition = 'none';
            if (charFanned) charSetTrackXY(charClampX(charDragBase + dx), charTrackY);
            else { charFoldX = charFoldClamp(charDragBase + dx); charSetTrackXY(charFoldX, charTrackY, CHAR_FOLD_SCALE); }
        });
        function charEndDrag() {
            if (!charDragOn) return;
            charDragOn = false;
            charDeck.classList.remove('spl-drag');
            if (charDragging) {
                charDragging = false;
                if (!charFanned) return;                     // 折叠态拖完就停在那儿
                const n = charCards.length;
                const cur = charTrackX;
                const active = Math.round((charDeckW() / 2 - charW / 2 - cur) / charStep);
                charGo(Math.max(0, Math.min(n - 1, active)));
                return;
            }
            /* v4.23.1:位移 <4px = 点击 —— 用按下那一刻记下的卡,不依赖 click 事件 */
            const card = charDragCard;
            charDragCard = null;
            charTapCard(card ? charCards.indexOf(card) : -1);
        }
        charDeck.addEventListener('pointerup', charEndDrag);
        charDeck.addEventListener('pointercancel', charEndDrag);
        /* 滚轮横向/纵向切换(节流) */
        charDeck.addEventListener('wheel', e => {
            const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
            if (!charFanned) { charFoldScroll(-d * 1.2, false); return; }   // 折叠态:滚轮直接平移整排
            if (charWheelLock || Math.abs(d) < 4) return;
            charWheelLock = true;
            setTimeout(() => { charWheelLock = false; }, 320);
            charGo(charActive + (d > 0 ? 1 : -1));
        }, { passive: true });

        /* ---------- 学生档案录入(v4.17.0) ----------
           左边列表 = 本机存档(GM_setValue 的 stuFiles:v1,只在这台浏览器里),
           右边表单 = STU_FIELDS 生成;三个动作:填入并发送 / 只填入 / 存档案。
           填好后正文 = 三段迎新文案 + [ 请填写] + 非空字段(一项一行)。 */
        const stuList = root.querySelector('#__spl_stulist__');
        const stuCount = root.querySelector('#__spl_stucount__');
        /* v4.19.0:表单有「两份」——整页里一份(.spl-stupage)、主页卡片里一份(.spl-file),
           改任何一份都要同步另一份,读的时候以当前看得见的那份为准 */
        const stuInputs = {}, stuMini = {};
        Array.prototype.forEach.call(root.querySelectorAll('.spl-stupage .spl-stuinp'), el => {
            if (el.dataset.sk) stuInputs[el.dataset.sk] = el;
        });
        Array.prototype.forEach.call(root.querySelectorAll('.spl-file .spl-stuinp'), el => {
            if (el.dataset.sk) stuMini[el.dataset.sk] = el;
        });
        function stuActiveMap() {
            if (root.classList.contains('spl-stu')) return stuInputs;       // 整页开着
            if (root.classList.contains('spl-filemode') && stuMini.name) return stuMini;
            return stuInputs;
        }
        function stuOtherMap() { return stuActiveMap() === stuInputs ? stuMini : stuInputs; }
        function stuEach(k, fn) { [stuInputs[k], stuMini[k]].forEach(el => { if (el) fn(el); }); }
        /* 在哪份里打字另一份就跟着变(程序赋值不会触发对方的 input 事件,不会来回弹) */
        function stuMirror(from, to) {
            STU_FIELDS.forEach(f => {
                const a = from[f.k], b = to[f.k];
                if (!a || !b) return;
                a.addEventListener('input', () => { b.value = a.value; });
            });
        }
        stuMirror(stuInputs, stuMini);
        stuMirror(stuMini, stuInputs);
        let stuCur = '';                       // 当前载入的档案姓名;空 = 新建
        function stuReadForm() {
            const read = map => {
                const o = stuBlank();
                STU_FIELDS.forEach(f => { const el = map[f.k]; if (el) o[f.k] = String(el.value || '').trim(); });
                return o;
            };
            const a = read(stuActiveMap());
            if (STU_FIELDS.some(f => a[f.k])) return a;
            return read(stuOtherMap());        // 当前这份是空的,看看另一份有没有内容
        }
        function stuPaintList(arr) {
            if (!stuList) return;
            if (!arr || !arr.length) {
                stuList.innerHTML = '<p class="spl-stuempty">还没有存档。<br>' +
                    '在右边填一份,点「保存到档案」就留在这台浏览器里了。<br>' +
                    '下次进来点左边任意一条就能原样调回来。</p>';
            } else {
                stuList.innerHTML = arr.map(it =>
                    '<button class="spl-stuitem' + (it.fields.name === stuCur ? ' on' : '') + '" type="button" ' +
                        'data-sact="stu-load" data-name="' + escHtml(it.fields.name) + '" title="载入这条人设">' +
                        '<span class="spl-stuiname">' + escHtml(it.fields.name) + '</span>' +
                        '<span class="spl-stumeta">' + escHtml(stuMetaOf(it.fields) || '一点补充信息都没留') + '</span>' +
                        '<span class="spl-studel" data-sact="stu-del" data-name="' + escHtml(it.fields.name) + '" ' +
                            'role="button" title="删除这条档案">⨯</span>' +
                    '</button>').join('');
            }
            if (stuCount) stuCount.textContent = String(arr ? arr.length : 0);
            stuPaintMini(arr);
            const stat = root.querySelector('#__spl_cardstat__');
            if (stat && root.classList.contains('spl-filemode')) stat.textContent = (arr ? arr.length : 0) + ' SAVED';
        }
        /* 主页卡片里的存档:一行小胶囊,点一下载入(整页里那份列表还是老样子) */
        function stuPaintMini(arr) {
            const box = root.querySelector('#__spl_stusaved__');
            if (!box) return;
            if (!arr || !arr.length) { box.innerHTML = '<span class="spl-stumeta">还没有存档 · 填完点保存</span>'; return; }
            box.innerHTML = arr.slice(0, 16).map(it =>
                '<button class="spl-stuchip" type="button" data-sact="stu-load" ' +
                    'data-name="' + escHtml(it.fields.name) + '" title="载入这条人设">' +
                    escHtml(it.fields.name) + '</button>').join('');
        }
        function stuWriteForm(fields) {
            const f = stuNorm(fields);
            STU_FIELDS.forEach(x => stuEach(x.k, el => { el.value = f[x.k]; }));
            stuCur = f.name || '';
            stuPaintList(getStuFiles());
        }
        function stuClearForm() {
            STU_FIELDS.forEach(f => stuEach(f.k, el => { el.value = ''; }));
            stuCur = '';
            stuPaintList(getStuFiles());
        }
        function stuFocus(name) {
            const el = stuActiveMap()[name] || stuInputs[name];
            if (el) setTimeout(() => { try { el.focus({ preventScroll: true }); } catch (e) {} }, 60);
        }
        function stuDel(name) {
            memModal({
                title: '删除这条档案?',
                note: '姓名:' + name + '\n删掉就找不回来了(这台浏览器里)。',
                buttons: [{ key: 'no', label: '再想想' }, { key: 'yes', label: '删掉', primary: true }]
            }).then(r => {
                if (!r || r.key !== 'yes') return;
                stuPaintList(stuRemove(name));
                if (stuCur === name) stuCur = '';
                memToast('已删除档案:' + name);
            });
        }
        function stuSaveForm(silent) {
            const f = stuReadForm();
            if (!f.name) { memToast('先填姓名才能存档'); return false; }
            const r = stuUpsert(f);
            if (!r.ok) { memToast('存档失败(浏览器不给写)'); return false; }
            stuCur = f.name;
            stuPaintList(getStuFiles());
            if (!silent) memToast('已存入本机档案:' + f.name);
            return true;
        }
        function stuSubmit(send) {
            const fields = stuReadForm();
            const text = stuCompose(fields);
            if (!text) { memToast('至少要填一项才能' + (send ? '发送' : '填入')); return; }
            /* 有姓名就顺手存一份,免得刚发出去就丢了 */
            if (fields.name) { stuUpsert(fields); stuCur = fields.name; stuPaintList(getStuFiles()); }
            closeSplash();                     // 先把开屏收掉,好让输入框露出来
            setTimeout(() => {
                const r = send ? fillAndSend(text) : fillToComposer(text);
                if (!r.ok) {
                    if (r.reason === 'NO_INPUT') memToast('没找到 qqy 的输入框,先退回聊天页再试一次');
                    else if (r.reason === 'NO_SEND') memToast('已填进输入框,但没找到发送键,你自己按发送吧');
                    else memToast('写入失败(' + (r.reason || '未知') + ')');
                    return;
                }
                memToast(send ? '学生档案已填入并发送' : '学生档案已填进输入框(没有发送)');
            }, 180);
        }
        root.__stuRefresh = () => stuPaintList(getStuFiles());
        root.__stuOpen = () => {
            root.classList.add('spl-stu');
            stuPaintList(getStuFiles());
            stuFocus('name');
        };

        /* v4.28.1:把概率 + 事件库文本框落盘(保存按钮 / ← BACK 退回时都走这里) */
        root.__revApply = () => {
            const c = getRevCfg();
            const prob = root.querySelector('#__spl_revprob__');
            const list = root.querySelector('#__spl_revlist__');
            const p = Math.round(Number(prob && prob.value));
            c.prob = isNaN(p) ? 30 : Math.max(0, Math.min(100, p));
            c.list = (list && list.value ? list.value : '').split('\n').map(s => s.trim()).filter(Boolean);
            setRevCfg(c);
            syncRevPanelBtn();
            root.__revSync();
            return c.list.length;
        };
        /* v4.22.1:菜单 01「随机事件」全屏设置页 —— 打开时把当前配置刷进控件 */
        root.__revOpen = () => {
            root.classList.add('spl-rev');
            const c = getRevCfg();
            const on = root.querySelector('#__spl_revon__ span');
            const prob = root.querySelector('#__spl_revprob__');
            const list = root.querySelector('#__spl_revlist__');
            const vis = root.querySelector('#__spl_revvis__ span');
            const tag = root.querySelector('#__spl_revtag__ span');
            const tri = root.querySelector('#__spl_revtri__ span');
            const stat = root.querySelector('#__spl_revstat__');
            if (on) on.textContent = '事件:' + (c.on ? '开' : '关');
            if (prob) prob.value = c.prob;
            if (list) list.value = revListAll().join('\n');
            if (vis) vis.textContent = '页面显隐:' + (getEvtVis() ? '开' : '关');
            if (tag) tag.textContent = '发送标注:' + (getSendTagPref() ? '开' : '关');
            if (tri) tri.textContent = '三率模式:' + SENDTAG_MODES[getTriMode()].name;
            if (stat) stat.textContent = c.on ? 'Online · ' + c.prob + '%' : 'Off';
        };
        /* 按钮按下后只刷按钮文案,不关页 */
        root.__revSync = () => {
            const c = getRevCfg();
            const on = root.querySelector('#__spl_revon__ span');
            const vis = root.querySelector('#__spl_revvis__ span');
            const tag = root.querySelector('#__spl_revtag__ span');
            const tri = root.querySelector('#__spl_revtri__ span');
            const stat = root.querySelector('#__spl_revstat__');
            if (on) on.textContent = '事件:' + (c.on ? '开' : '关');
            if (vis) vis.textContent = '页面显隐:' + (getEvtVis() ? '开' : '关');
            if (tag) tag.textContent = '发送标注:' + (getSendTagPref() ? '开' : '关');
            if (tri) tri.textContent = '三率模式:' + SENDTAG_MODES[getTriMode()].name;
            if (stat) stat.textContent = c.on ? 'Online · ' + c.prob + '%' : 'Off';
        };
        /* v4.22.1:菜单 03「桌面宠物」全屏设置页 */
        root.__petOpen = () => { root.classList.add('spl-pet'); root.__petSync(); };
        root.__petSync = () => {
            const petOn = getQPetPref();
            const set = (id, txt) => { const el = root.querySelector('#' + id + ' span'); if (el) el.textContent = txt; };
            set('__spl_peton__', '精灵:' + (petOn ? (getQHomePref() === 'input' ? '输入框' : '方块') : '关'));
            set('__spl_pethome__', '大本营:' + (getQHomePref() === 'input' ? '输入框' : '方块'));
            set('__spl_petsize__', '大小:' + getQPetScale() + 'x');
            set('__spl_petmark__', '页面标记:' + (getMarkVisible() ? '开' : '关'));
            const st = loadDock();
            set('__spl_petdock__', '方块贴附:' + (st.mode === 'free' ? '已挪开' : (SIDE_NAME[st.side || 'down'] || '下')));
            const stat = root.querySelector('#__spl_petstat__');
            if (stat) stat.textContent = petOn ? 'On Duty' : 'Off';
        };

        root.addEventListener('click', e => {
            const t = e.target;
            if (!t || !t.closest) return;
            const b = t.closest('[data-sact]');
            if (!b) return;
            const act = b.dataset.sact;
            if (act === 'close') { closeSplash(); return; }
            /* v4.22.2:竖屏 ⇄ 横屏(手机端;电脑上按钮是隐藏的,点不到) */
            if (act === 'orient') {
                setSplashOrient(getSplashOrient() === 'landscape' ? 'portrait' : 'landscape');
                applySplashOrient();
                return;
            }
            if (act === 'theme') {
                /* v4.18.0:跟浮窗一致 —— 从你点的那颗滑块处圆形扩散换主题,
                   整页(开屏 + 浮窗 + 导出面板 + 小精灵)一起过渡 */
                const next = getRPGTheme() === 'light' ? 'dark' : 'light';
                themeSwapAnimated(() => {
                    setRPGTheme(next);
                    root.dataset.theme = getRPGTheme();
                    syncThemeUI();
                    syncRPGSkin();
                    if (rpgRoot && rpgRoot.__rpgRefresh) { try { rpgRoot.__rpgRefresh(); } catch (err) {} }
                }, e);
                return;
            }
            if (act === 'gen') { rollEv(); return; }
            /* v4.11.0:角色介绍子页的进出(菜单 04 / 返回键);v4.16.0:进入即一横排(无抽牌) */
            if (act === 'chars') {
                root.classList.add('spl-chars');
                charInit();
                return;
            }
            if (act === 'chars-back') { root.classList.remove('spl-chars'); return; }
            /* v4.27.0:角色邂逅 —— 与之邂逅(选中的角色) / 随机邂逅(随机抽一位),
               把系统控制提示词填进聊天输入框(不发送);先收开屏再延迟写入(复用学生档案的链路) */
            if (act === 'encounter-new' || act === 'encounter' || act === 'encounter-rand') {
                let ei = charActive;
                if (act === 'encounter-rand') ei = Math.floor(Math.random() * SPLASH_CHARACTERS.length);
                const ec = SPLASH_CHARACTERS[ei];
                if (!ec || !ec.name) { memToast('先抽一张卡,再与之邂逅'); return; }
                const encounterText = '<此为系统脚本控制:请为根据用户人设,触发起一场' + ec.name + '的偶遇>';
                if (act === 'encounter-new') {
                    const detail = {entry:'new',insert:encounterText,accepted:false};
                    window.dispatchEvent(new CustomEvent('academy:encounter-new',{detail}));
                    return;
                }
                if (window.academyDraft) {
                    if (!window.academyDraft(encounterText)) return;
                    memToast('与「' + ec.name + '」的邂逅已填入剧情输入框，尚未发送');
                    return;
                }
                closeSplash();
                setTimeout(() => {
                    const r = fillToComposer('<此为系统脚本控制:请为根据用户人设,触发起一场' + ec.name + '的偶遇>');
                    if (!r.ok) {
                        memToast('尚未建立会话，请先建立会话后使用');
                        return;
                    }
                    memToast(act === 'encounter-rand'
                        ? '随机邂逅「' + ec.name + '」· 提示词已填进输入框(没有发送)'
                        : '与「' + ec.name + '」的邂逅 · 提示词已填进输入框(没有发送)');
                }, 180);
                return;
            }
            /* v4.17.0:学生档案录入页(菜单 05) */
            if (act === 'stu') { root.__stuOpen(); return; }
            if (act === 'map') { root.classList.add('spl-map'); if (root.__mapApi) root.__mapApi.onShow(); return; }
            if (act === 'map-back') { root.classList.remove('spl-map'); return; }
            if (act === 'cardopen') {                      // 05:主页右边那张卡直接切到填写表
                root.classList.add('spl-filemode');
                const st = root.querySelector('#__spl_cardstat__');
                if (st) st.textContent = getStuFiles().length + ' SAVED';
                stuPaintList(getStuFiles());
                stuFocus('name');
                const cd = root.querySelector('.spl-card');
                if (cd && cd.scrollIntoView) { try { cd.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {} }
                return;
            }
            if (act === 'stu-back') { root.classList.remove('spl-stu'); return; }
            if (act === 'stu-chip') {                      // 快捷选项:没填就填、重复了再点取消、已有别的就追加
                const src = stuActiveMap()[b.dataset.sk];
                if (!src) return;
                const v = b.dataset.val || '';
                const cur = String(src.value || '').trim();
                let next;
                if (!cur) next = v;
                else if (cur === v) next = '';
                else if (cur.indexOf(v) >= 0) next = cur;
                else next = cur + '、' + v;
                stuEach(b.dataset.sk, el => { el.value = next; });   // 两份表单同步
                try { src.focus({ preventScroll: true }); } catch (err) {}
                return;
            }
            /* v4.21.0:主页那张卡:迎新文案 ⇄ 人设填写表格 */
            if (act === 'cardfile') {
                const on = !root.classList.contains('spl-filemode');
                root.classList.toggle('spl-filemode', on);
                const st = root.querySelector('#__spl_cardstat__');
                if (st) st.textContent = on ? getStuFiles().length + ' SAVED' : 'Online';
                if (on) { stuPaintList(getStuFiles()); stuFocus('name'); }
                return;
