<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新版账号管理 · 学院</title><link rel="stylesheet" href="./accounts.css"><script src="./accounts.js" defer></script></head><body><main class="passport"><h1>新版账号管理</h1><p><a href="./">返回学院档案编辑</a></p><section><h2>用户账号</h2><form id="search-form"><label for="account-search">查询账号或昵称</label><input id="account-search" autocomplete="off"><button>查询</button></form><div id="users"></div></section><section><h2>设置新密码</h2><p>请先核对账号所有权。修改后，该账号原有登录会话失效。</p><form id="password-form"><label for="password-handle">账号</label><input id="password-handle" autocomplete="off" required><label for="new-password">新密码</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button>设置新密码</button></form></section><hr><section><h2>邀请码</h2><form id="invite-form"><label for="count">生成数量（1～1000）</label><input id="count" type="number" min="1" max="1000" value="5" required><label for="batch">批次</label><input id="batch" maxlength="100" placeholder="例如：内测一批" required><label for="note">备注</label><input id="note" maxlength="500"><button>生成邀请码</button></form><p>仅本次显示明文，请复制保存。每个邀请码只能注册一个普通账号。</p><textarea id="codes" readonly rows="5" hidden aria-label="本次生成的邀请码"></textarea><button id="stats" type="button">查看批次统计</button><pre id="stats-result"></pre><form id="revoke-form"><label for="revoke-code">撤销未使用的邀请码</label><input id="revoke-code" maxlength="24" autocomplete="off" required><button>撤销邀请码</button></form></section><p id="message" role="status"></p></main></body></html>
